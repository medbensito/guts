<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guts</title>
<meta name="description" content="Guts, ton calendrier avec un renard qui protège ton temps libre.">
<meta name="theme-color" content="#0c1433">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<style>
  :root {
    --bg: #0c1433; --bleu: #4f7cff; --bleu-fond: #3b63e6; --rouge: #ff4d5e; --rouge-fond: #d92636;
    --creme: #fff4ea; --papier: #fffaf4; --noir: #0a0f26; --cyan: #7ef0ff; --or: #ffd66b; --doux: #8d99cc;
    --ligne: #ece3d8; --ligne-forte: #d8ccbe; --gris: #5d627c;
    --H: 56px;              /* hauteur d'une heure dans la grille */
    --gouttiere: 46px;      /* colonne des heures */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--creme); overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    background-image: repeating-linear-gradient(-45deg, transparent 0 22px, rgba(79,124,255,.08) 22px 24px); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
  .papier :focus-visible, dialog :focus-visible { outline-color: var(--bleu-fond); }
  .masque { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 860px; margin: 0 auto; }

  /* ---------- En-tête Guts ---------- */
  header.haut { flex: none; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; }
  .ligne1 { display: flex; align-items: center; gap: 10px; }
  .guts-mini { display: flex; align-items: center; gap: 4px; background: var(--bleu-fond); color: var(--creme); border: 3px solid var(--noir); text-align: left;
    box-shadow: 3px 3px 0 var(--noir); padding: 0 8px 0 0; height: 46px; flex: none; }
  .guts-mini svg { width: 46px; height: 46px; margin: -6px -2px 0 -4px; }
  .guts-mini:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--noir); }
  .guts-mini b.monte { display: inline-block; animation: monte-pts .7s ease-out; }
  @keyframes monte-pts { 30% { transform: scale(1.35); color: var(--or); } }
  .guts-mini b { font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; }
  .guts-mini small { display: block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  h1 { flex: 1; min-width: 0; margin: 0; font-size: 23px; line-height: 1; font-weight: 900; text-transform: uppercase; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 small { display: block; font-size: 11px; color: var(--doux); letter-spacing: .08em; margin-bottom: 3px; }
  .rond { width: 38px; height: 38px; flex: none; display: grid; place-items: center; background: var(--creme); color: var(--noir);
    border: 3px solid var(--noir); box-shadow: 3px 3px 0 var(--noir); padding: 0; }
  .rond:active, .pilule:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--noir); }
  .rond svg { width: 20px; height: 20px; }
  .ligne2 { display: flex; gap: 8px; margin-top: 12px; }
  .vues { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--creme); border: 3px solid var(--noir); box-shadow: 3px 3px 0 var(--noir); }
  .vues button { border: 0; border-left: 2px solid var(--noir); background: none; color: var(--noir); font-weight: 800; font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em; padding: 8px 0; min-height: 36px; }
  .vues button:first-child { border-left: 0; }
  .vues button[aria-selected="true"] { background: var(--rouge-fond); color: var(--creme); }
  .pilule { flex: none; background: var(--creme); color: var(--noir); border: 3px solid var(--noir); box-shadow: 3px 3px 0 var(--noir);
    font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 0 10px; min-height: 42px; }
  .pilule[disabled] { opacity: .45; cursor: default; }

  /* ---------- Feuille du calendrier ---------- */
  main.papier { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--papier); color: var(--noir);
    border-top: 3px solid var(--noir); position: relative; touch-action: pan-y; }
  @media (min-width: 700px) { main.papier { border: 3px solid var(--noir); margin: 0 14px 14px; box-shadow: 6px 6px 0 var(--noir); } }
  .defile { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; overscroll-behavior: contain; }

  /* Bande de la semaine (vue Jour) */
  .bande { flex: none; display: grid; grid-template-columns: 26px repeat(7, 1fr) 26px; align-items: center; padding: 6px 2px 2px; border-bottom: 1px solid var(--ligne); }
  .fleche { border: 0; background: none; color: var(--gris); font-size: 22px; font-weight: 700; padding: 6px 0; line-height: 1; }
  .jour-b { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0 4px; color: var(--noir); }
  .jour-b span { font-size: 10px; font-weight: 700; color: var(--gris); text-transform: uppercase; }
  .jour-b b { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .jour-b.auj b { color: var(--rouge-fond); font-weight: 900; }
  .jour-b[aria-pressed="true"] b { background: var(--noir); color: var(--creme); }
  .jour-b.auj[aria-pressed="true"] b { background: var(--rouge-fond); color: var(--creme); }
  .jour-b i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .jour-b i.plein { background: var(--ligne-forte); }
  .jour-titre { flex: none; padding: 8px 14px 6px; font-weight: 800; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
  .jour-titre .compte { font-weight: 600; font-size: 12px; color: var(--gris); }

  /* Journée entière */
  .journee { flex: none; display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 8px 6px var(--gouttiere); position: relative; border-bottom: 1px solid var(--ligne); }
  .journee::before { content: "journée"; position: absolute; left: 4px; top: 9px; font-size: 10px; color: var(--gris); width: calc(var(--gouttiere) - 8px); text-align: right; }
  .puce { display: flex; align-items: center; gap: 6px; min-height: 30px; max-width: 100%; border-radius: 6px; background: var(--fond); border-left: 4px solid var(--c); padding: 0 8px 0 4px; font-size: 13px; font-weight: 600; }
  .puce .ouvrir { border: 0; background: none; padding: 4px 2px; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .puce.fait { background: #f1ebe3; }
  .puce.fait .ouvrir { text-decoration: line-through; color: var(--gris); }

  /* Grille horaire */
  .grille { position: relative; height: calc(24 * var(--H)); margin: 0; }
  .heure { position: absolute; left: 0; width: var(--gouttiere); padding-right: 6px; text-align: right; font-size: 11px; color: var(--gris);
    transform: translateY(-50%); font-variant-numeric: tabular-nums; pointer-events: none; }
  .trait-h { position: absolute; left: var(--gouttiere); right: 0; border-top: 1px solid var(--ligne); pointer-events: none; }
  .colonnes { position: absolute; left: var(--gouttiere); right: 4px; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
  .colonne { position: relative; border-left: 1px solid var(--ligne); }
  .colonne.auj { background: rgba(217, 38, 54, .035); }
  .maintenant { position: absolute; left: var(--gouttiere); right: 0; height: 0; border-top: 2px solid var(--rouge-fond); z-index: 3; pointer-events: none; }
  .maintenant span { position: absolute; right: 100%; top: -9px; background: var(--rouge-fond); color: var(--creme); font-size: 10px; font-weight: 800;
    padding: 2px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; margin-right: 1px; }
  .maintenant i { position: absolute; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--rouge-fond); margin-left: -4px; }

  /* Blocs */
  .bloc { position: absolute; border-radius: 6px; background: var(--fond); border-left: 4px solid var(--c); color: var(--noir);
    box-shadow: 0 0 0 1px var(--papier); overflow: hidden; z-index: 1; }
  .bloc .b-ouvrir { position: absolute; inset: 0; border: 0; background: none; padding: 0; width: 100%; z-index: 1; }
  .bloc .b-texte { position: relative; display: block; padding: 3px 5px 2px 5px; font-size: 12px; line-height: 1.25; pointer-events: none; z-index: 2; }
  .bloc .b-texte b { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; }
  .bloc .b-texte small { font-size: 11px; color: #43475e; font-variant-numeric: tabular-nums; }   /* lisible sur toutes les teintes */
  .bloc.court .b-texte { display: flex; gap: 5px; white-space: nowrap; padding-top: 1px; }
  .bloc.court .b-texte b { flex: 0 1 auto; }
  .bloc.tache .b-texte { padding-left: 28px; }
  .bloc .case { position: absolute; left: 3px; top: 3px; z-index: 3; }
  .bloc.court .case { top: 50%; transform: translateY(-50%); }
  .bloc.fait .b-texte b { text-decoration: line-through; color: var(--gris); }
  .bloc.tache.fait { background: #f1ebe3; }
  .bloc.evenement { background: var(--c); color: var(--noir); }
  .bloc.evenement .b-texte small { color: inherit; }
  .bloc.choisi, .bloc.brouillon { touch-action: none; }
  .bloc.choisi { box-shadow: 0 0 0 2px var(--noir), 3px 3px 0 2px var(--noir); z-index: 4; overflow: visible; }
  .bloc.leve { box-shadow: 0 0 0 2px var(--noir), 6px 8px 0 2px rgba(10,15,38,.35); z-index: 6; opacity: .95; transition: none; }
  .bloc.brouillon { background: repeating-linear-gradient(-45deg, #fff 0 8px, #f3ece3 8px 16px); border: 2px dashed var(--noir); border-left-width: 2px; z-index: 5; overflow: visible; }
  .bloc.brouillon .b-texte b { color: var(--noir); }
  .semaine .bloc .b-texte b { overflow-wrap: break-word; text-overflow: clip; hyphens: auto; }
  /* Téléphone : colonnes étroites, titres seuls */
  @media (max-width: 600px) {
    .semaine .bloc .b-texte { font-size: 10px; padding: 2px 3px; }
    .semaine .bloc .b-texte small { display: none; }
    .semaine .bloc.etroit .b-texte b { white-space: nowrap; overflow-wrap: normal; }
    .semaine .bloc.etroit .b-texte { padding: 2px 1px 2px 2px; }
  }
  .semaine .bloc.tache .b-texte { padding-left: 3px; }
  .semaine .bloc.court .b-texte { padding-top: 0; }
  .poignee { position: absolute; z-index: 7; width: 44px; height: 30px; touch-action: none; }
  .poignee::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; border: 3px solid var(--noir); }
  .poignee.haut { right: -14px; top: -15px; cursor: ns-resize; }
  .poignee.bas { left: -14px; bottom: -15px; cursor: ns-resize; }
  .bord { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; z-index: 3; cursor: ns-resize; display: none; }
  @media (pointer: fine) { .bord { display: block; } }

  /* Case à cocher ronde */
  .case { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--noir); background: #fff; padding: 0; display: grid; place-items: center; flex: none; }
  .case svg { width: 13px; height: 13px; opacity: 0; }
  .case[aria-checked="true"] { background: var(--noir); }
  .case[aria-checked="true"] svg { opacity: 1; }
  .case::before { content: ""; position: absolute; inset: -9px; }
  .case { position: relative; }

  /* Vue Semaine */
  .sem-tete { flex: none; display: grid; grid-template-columns: var(--gouttiere) repeat(7, 1fr) 4px; border-bottom: 1px solid var(--ligne); padding-top: 4px; }
  .sem-tete .jour-b b { width: 28px; height: 28px; font-size: 14px; }
  .sem-journee { flex: none; display: grid; grid-template-columns: var(--gouttiere) repeat(7, 1fr) 4px; border-bottom: 1px solid var(--ligne); min-height: 8px; }
  .sem-journee > div { border-left: 1px solid var(--ligne); padding: 2px 1px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sem-journee > span { font-size: 9px; color: var(--gris); text-align: right; padding: 4px 4px 0 0; }
  .mini-puce { display: block; width: 100%; border: 0; border-radius: 4px; background: var(--fond); border-left: 3px solid var(--c); font-size: 10px; font-weight: 600;
    text-align: left; padding: 2px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--noir); }
  .mini-puce.fait { text-decoration: line-through; background: #f1ebe3; color: var(--gris); }

  /* Vue Mois */
  .mois { padding: 4px 6px 0; flex: none; }
  .mois-tete, .mois-grille { display: grid; grid-template-columns: repeat(7, 1fr); }
  .mois-tete span { text-align: center; font-size: 10px; font-weight: 700; color: var(--gris); text-transform: uppercase; padding: 4px 0; }
  .mois-grille button { border: 0; border-top: 1px solid var(--ligne); background: none; color: var(--noir); padding: 5px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; }
  .mois-grille button b { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .mois-grille button.autre b { color: var(--gris); font-weight: 400; }
  .mois-grille button.auj b { color: var(--rouge-fond); font-weight: 900; }
  .mois-grille button[aria-pressed="true"] b { background: var(--noir); color: var(--creme); }
  .mois-grille button.auj[aria-pressed="true"] b { background: var(--rouge-fond); color: var(--creme); }
  .points-jour { display: flex; gap: 3px; height: 6px; }
  .points-jour i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .mois-jour { border-top: 3px solid var(--noir); margin-top: 4px; }

  /* Listes (Mois et Liste à venir) */
  .titre-jour { position: sticky; top: 0; z-index: 2; margin: 0; padding: 10px 14px 6px; background: var(--papier); font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--ligne); display: flex; justify-content: space-between; gap: 8px; }
  .titre-jour.auj { color: var(--rouge-fond); }
  .titre-jour small { font-weight: 700; color: var(--gris); text-transform: none; letter-spacing: 0; }
  .ligne-occ { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 14px; border-bottom: 1px solid var(--ligne); min-height: 56px; }
  .ligne-occ .marque { width: 22px; display: grid; place-items: center; flex: none; }
  .ligne-occ .marque i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); border: 2px solid var(--noir); }
  .ligne-occ .ouvrir { flex: 1; min-width: 0; display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px 0; color: var(--noir); }
  .ligne-occ .heures { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; border-right: 3px solid var(--c); padding-right: 8px; }
  .ligne-occ .heures small { display: block; font-weight: 500; color: var(--gris); }
  .ligne-occ .quoi { min-width: 0; }
  .ligne-occ .quoi b { display: block; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ligne-occ .quoi small { display: block; font-size: 12px; color: var(--gris); margin-top: 1px; }
  .ligne-occ.fait .quoi b { text-decoration: line-through; color: var(--gris); }
  .vide { padding: 22px 18px; color: var(--gris); font-size: 14px; text-align: center; }
  .vide button { margin-top: 10px; }
  .bouton { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; background: var(--rouge-fond); color: var(--creme);
    border: 3px solid var(--noir); box-shadow: 3px 3px 0 var(--noir); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .bouton.clair { background: var(--creme); color: var(--noir); }
  .bouton:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--noir); }

  /* Bouton + */
  .plus { position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 8; width: 58px; height: 58px; border-radius: 50%;
    background: var(--rouge-fond); color: var(--creme); border: 3px solid var(--noir); box-shadow: 4px 4px 0 var(--noir); display: grid; place-items: center; padding: 0; }
  .plus svg { width: 26px; height: 26px; }
  .plus:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--noir); }
  .bas-espace { height: calc(env(safe-area-inset-bottom) + 84px); }

  /* Message bref */
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
    background: var(--noir); color: var(--creme); border: 2px solid var(--creme); padding: 10px 14px; font-size: 14px; font-weight: 700; max-width: calc(100% - 32px);
    transition: opacity .2s, transform .2s; z-index: 50; text-align: center; }
  .toast.visible { opacity: 1; transform: translateX(-50%); }

  /* ---------- Feuilles (formulaires) ---------- */
  dialog { border: 3px solid var(--noir); background: var(--papier); color: var(--noir); padding: 0; width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh;
    box-shadow: 0 -4px 0 var(--noir); }
  dialog::backdrop { background: rgba(10, 15, 38, .6); }
  dialog.feuille { margin: auto auto 0; border-bottom: 0; border-radius: 18px 18px 0 0; overflow: hidden; }
  dialog.feuille[open] { display: flex; flex-direction: column; animation: monte .22s ease-out; }
  @media (min-width: 600px) { dialog.feuille { margin: auto; border-bottom: 3px solid var(--noir); border-radius: 14px; box-shadow: 8px 8px 0 var(--noir); } }
  @keyframes monte { from { transform: translateY(40px); opacity: .4; } }
  dialog.question { max-width: 360px; margin: auto; border-radius: 14px; box-shadow: 6px 6px 0 var(--noir); padding: 18px; width: calc(100% - 32px); }
  dialog.question h2 { margin: 0 0 6px; font-size: 18px; font-weight: 900; }
  dialog.question p { margin: 0 0 14px; color: var(--gris); font-size: 14px; line-height: 1.4; }
  dialog.question .choix { display: grid; gap: 8px; }
  dialog.question .bouton { width: 100%; }
  .f-haut { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--ligne); }
  .f-haut h2 { margin: 0; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; text-align: center; }
  .lien { border: 0; background: none; color: var(--bleu-fond); font-weight: 700; font-size: 16px; padding: 10px 8px; justify-self: start; min-height: 44px; }
  .lien.fort { justify-self: end; color: var(--rouge-fond); font-weight: 900; }
  .f-corps { overflow-y: auto; padding: 14px 14px calc(env(safe-area-inset-bottom) + 18px); display: grid; gap: 14px; }
  .segment { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); border: 3px solid var(--noir); background: #fff; }
  .segment label { position: relative; text-align: center; padding: 10px 4px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; border-left: 2px solid var(--noir); cursor: pointer; }
  .segment label:first-child { border-left: 0; }
  .segment input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .segment label:has(input:checked) { background: var(--noir); color: var(--creme); }
  .segment label:has(input:focus-visible) { outline: 3px solid var(--bleu-fond); outline-offset: -5px; }
  .groupe { background: #fff; border: 2px solid var(--noir); border-radius: 10px; overflow: hidden; }
  .groupe > * + * { border-top: 1px solid var(--ligne); }
  .champ-titre { width: 100%; border: 2px solid var(--noir); border-radius: 10px; padding: 12px; font: inherit; font-size: 17px; font-weight: 700; background: #fff; color: var(--noir); }
  .rang { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 4px 12px; font-size: 16px; }
  .rang > span { font-weight: 600; }
  .rang input[type="date"], .rang input[type="time"], .rang select { font: inherit; font-size: 16px; font-weight: 700; border: 0; background: #f3ece3; color: var(--noir);
    border-radius: 7px; padding: 6px 8px; min-height: 36px; color-scheme: light; max-width: 62%; }
  .rang input:disabled { opacity: .4; }
  .rang.cache { display: none; }
  .interrupteur { position: relative; width: 52px; height: 32px; flex: none; }
  .interrupteur input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .interrupteur i { position: absolute; inset: 0; border-radius: 16px; background: #d8d1c8; border: 2px solid var(--noir); transition: background .15s; }
  .interrupteur i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--noir); transition: transform .15s; }
  .interrupteur input:checked + i { background: var(--rouge-fond); }
  .interrupteur input:checked + i::after { transform: translateX(20px); }
  .interrupteur input:focus-visible + i { outline: 3px solid var(--bleu-fond); outline-offset: 2px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); margin-bottom: 8px; padding: 0; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cats label { position: relative; display: flex; align-items: center; gap: 7px; padding: 8px 12px 8px 9px; border: 2px solid var(--noir); border-radius: 20px; background: #fff; font-weight: 700; font-size: 14px; cursor: pointer; min-height: 40px; }
  .cats label i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 2px solid var(--noir); }
  .cats input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .cats label:has(input:checked) { background: var(--noir); color: var(--creme); }
  .cats label:has(input:checked) i { border-color: var(--creme); }
  .cats label:has(input:focus-visible) { outline: 3px solid var(--bleu-fond); outline-offset: 2px; }
  .erreur { margin: 0; color: var(--rouge-fond); font-weight: 700; font-size: 14px; }
  .erreur:empty { display: none; }
  .supprimer { border: 2px solid var(--rouge-fond); background: #fff; color: var(--rouge-fond); font-weight: 800; font-size: 15px; border-radius: 10px; min-height: 48px; }
  .note { font-size: 13px; color: var(--gris); line-height: 1.45; margin: 0; }
  .r-cat { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px 12px; }
  .r-cat .r-nom { display: flex; gap: 8px; align-items: center; }
  .r-cat input[type="text"] { flex: 1; min-width: 0; width: 0; font: inherit; font-size: 16px; font-weight: 700; border: 0; background: #f3ece3; border-radius: 7px; padding: 8px 10px; color: var(--noir); }
  .r-cat .retirer { border: 0; background: none; color: var(--rouge-fond); font-weight: 800; font-size: 14px; padding: 8px 4px; min-height: 40px; }
  .nuancier { display: flex; gap: 6px; flex-wrap: wrap; }
  .nuancier label { position: relative; width: 32px; height: 32px; border-radius: 50%; background: var(--c); border: 2px solid var(--noir); cursor: pointer; }
  .nuancier input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .nuancier label:has(input:checked) { box-shadow: 0 0 0 3px var(--papier), 0 0 0 5px var(--noir); }
  .nuancier label:has(input:focus-visible) { outline: 3px solid var(--bleu-fond); outline-offset: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .version { text-align: center; font-size: 12px; color: var(--gris); margin: 0; }

  /* ---------- Renard ---------- */
  .fox { overflow: visible; }
  .fox .yeux { transform-box: fill-box; transform-origin: center; animation: cligne 9s infinite; }
  .fox.endormie .yeux { animation: none; }
  .fox .lueur { animation: pulse 2.6s ease-in-out infinite; }
  .fox .fox-reaction { transform-box: fill-box; transform-origin: 50% 100%; }
  .fox.saut .fox-reaction { animation: saut .7s cubic-bezier(.3, .7, .4, 1); }
  .grand-renard { display: flex; justify-content: center; align-items: center; height: 186px; }
  .grand-renard .fox { width: 180px; height: 180px; animation: respire 3.4s ease-in-out infinite; }
  .grand-renard .fox.endormie { animation-duration: 5s; }
  @keyframes respire { 50% { transform: translateY(-4px); } }
  @keyframes saut { 0% { transform: none; } 20% { transform: scale(1.06, .9); } 50% { transform: translateY(-18px) scale(.96, 1.05); } 78% { transform: scale(1.04, .95); } 100% { transform: none; } }
  @keyframes cligne { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ---------- Temps pour moi, points ---------- */
  .bloc.libre { background: repeating-linear-gradient(-45deg, #e3fbff 0 7px, #cdf5fc 7px 14px); }
  .bloc.libre .b-texte small { color: #1d5763; }
  .bloc.libre.grignote { box-shadow: inset 0 0 0 2px var(--rouge-fond); }
  .bloc.libre.grignote .b-texte small { color: #a51c29; }
  .gain { position: absolute; right: 4px; top: 3px; z-index: 2; font-size: 10px; font-weight: 900; background: var(--noir); color: var(--creme); padding: 1px 5px; border-radius: 4px; pointer-events: none; }
  .semaine .gain { display: none; }
  .ligne-occ .marque i.m-libre { border-radius: 50%; background: repeating-linear-gradient(-45deg, #e3fbff 0 3px, #1aa9c4 3px 5px); }
  .rappel { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; background: var(--or); border-bottom: 3px solid var(--noir); font-size: 13px; font-weight: 700; color: var(--noir); }
  .rappel span { flex: 1; line-height: 1.3; }
  .rappel .bouton { min-height: 36px; padding: 0 10px; font-size: 11px; box-shadow: 2px 2px 0 var(--noir); }
  .rappel .fermer { border: 0; background: none; color: var(--noir); width: 40px; height: 40px; font-size: 22px; line-height: 1; padding: 0; }

  /* ---------- Panneau Guts et bilan ---------- */
  .carte-guts { position: relative; background: var(--bleu-fond); color: var(--creme); border: 3px solid var(--noir); box-shadow: 5px 5px 0 var(--noir); padding: 14px 16px 16px; overflow: hidden; }
  .carte-guts::before { content: ""; position: absolute; right: -42px; top: -42px; width: 150px; height: 150px; background: var(--rouge); border-radius: 50%; border: 3px solid var(--noir); }
  .carte-guts > * { position: relative; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { background: var(--creme); color: var(--noir); border: 2px solid var(--noir); font-weight: 800; font-size: 12px; padding: 3px 8px; text-transform: uppercase; letter-spacing: .03em; }
  .carte-guts .phrase { font-weight: 800; font-size: 16px; line-height: 1.35; margin: 2px 0 0; text-align: center; }
  .barre { height: 20px; margin-top: 14px; background: var(--creme); border: 3px solid var(--noir); overflow: hidden; }
  .barre span { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--rouge) 0 8px, #ff6d7a 8px 16px); border-right: 3px solid var(--noir); }
  .barre span[style*="width:0%"] { border-right: 0; }
  .carte-guts .suite { font-size: 12px; font-weight: 700; margin: 6px 0 0; text-align: right; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #fff; border: 2px solid var(--noir); border-radius: 10px; padding: 10px 4px; text-align: center; }
  .stat b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat span { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--gris); margin-top: 2px; }
  .regles { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .regles li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; line-height: 1.4; }
  .regles .pts { flex: none; min-width: 44px; text-align: center; background: var(--noir); color: var(--creme); font-weight: 900; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
  .bilan-date { margin: 0; font-size: 13px; font-weight: 700; color: var(--gris); text-align: center; }
  #bilan .bouton { width: 100%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
(() => {
  'use strict';
  const CLE = 'guts-cal-v1';
  const VERSION = 16;

  // ---------- Réglages ----------
  const CONFIG = {
    heure: 56,            // px par heure dans la grille (= --H)
    pas: 15,              // minutes : les créneaux se calent au quart d'heure
    duree: 60,            // durée proposée pour une nouvelle plage
    ouverture: 7,         // heure affichée en haut de la grille à l'ouverture
    appuiLong: 450,       // ms : appui long sur l'écran tactile
    joursListe: 60,       // vue Liste : nombre de jours à venir
    // tache : tâche faite, prévue avant son début ; libre : temps pour moi resté libre jusqu'au bout
    points: { tache: 10, libre: 15, libresParJour: 2, libreMin: 30 },
    heures: { coucher: 22, lever: 6, finNuit: 5 },   // Guts dort de coucher à lever ; pas de bilan avant finNuit
    surcharge: 10 * 60,                                // au-delà (minutes prévues dans la journée), Guts est fatigué
    stades: [
      { id: 'renardeau',  nom: 'Renardeau',  seuil: 0,   echelle: 0.72 },
      { id: 'jeune',      nom: 'Jeune',      seuil: 80,  echelle: 0.86 },
      { id: 'adolescent', nom: 'Adolescent', seuil: 250, echelle: 0.96 },
      { id: 'adulte',     nom: 'Adulte',     seuil: 600, echelle: 1.06 }
    ]
  };
  const PALETTE = [
    { c: '#4f7cff', nom: 'Bleu' }, { c: '#ff4d5e', nom: 'Rouge' }, { c: '#5cc98a', nom: 'Vert' }, { c: '#ffc23d', nom: 'Jaune' },
    { c: '#9b7bff', nom: 'Violet' }, { c: '#34c6e0', nom: 'Cyan' }, { c: '#ff8a3d', nom: 'Orange' }, { c: '#8d99cc', nom: 'Gris' }
  ];
  const CATS = () => [
    { id: 'travail', nom: 'Travail', couleur: '#4f7cff' },
    { id: 'perso', nom: 'Perso', couleur: '#ff4d5e' },
    { id: 'sport', nom: 'Sport', couleur: '#5cc98a' },
    { id: 'social', nom: 'Social', couleur: '#ffc23d' }
  ];
  const REPET = { jour: 'Chaque jour', ouvres: 'En semaine', semaine: 'Chaque semaine', mois: 'Chaque mois' };
  const LIBRE = { c: '#1aa9c4', fond: '#d6f6fc', titre: 'Temps pour moi' };
  const H = CONFIG.heure;

/*@RENARD@*/

  // ---------- Données ----------
  // Élément : { id, type: 'tache' | 'evenement', titre, cat, date, debut, fin (minutes depuis minuit, null = journée entière),
  //             rep: null | { freq, jusqua }, exceptions: { date: true }, faits: { date: true }, creeLe: horodatage }
  // payes : { clé d'occurrence : { pts, jour, type, raison? } } — points versés (ou refusés, pts 0) ; gains : { jour : { taches, libre } }
  const vide = () => ({ elements: [], categories: CATS(), points: 0, gains: {}, payes: {}, bilanVu: null, vue: 'jour', derniereExport: null,
    depuis: null, rappelVu: null, importV14: false });
  let S;
  try { S = Object.assign(vide(), JSON.parse(localStorage.getItem(CLE)) || {}); }
  catch (e) { S = vide(); }
  function nettoyer() {
    if (!Array.isArray(S.elements)) S.elements = [];
    if (!Array.isArray(S.categories) || !S.categories.length) S.categories = CATS();
    ['gains', 'payes'].forEach(c => { if (!S[c] || typeof S[c] !== 'object' || Array.isArray(S[c])) S[c] = {}; });
    S.elements = S.elements.filter(el => el && el.id && typeof el.date === 'string');
    S.elements.forEach(el => {
      el.exceptions = el.exceptions || {}; el.faits = el.faits || {};
      if (!['tache', 'evenement', 'libre'].includes(el.type)) el.type = 'tache';
      if (el.type === 'libre' && el.debut == null) el.type = 'evenement';
      if (el.debut == null) { el.debut = null; el.fin = null; }
    });
    // Série qui ne tombe plus jamais : retirée
    S.elements = S.elements.filter(el => !el.rep || !el.rep.jusqua || el.rep.jusqua >= el.date);
  }
  nettoyer();
  let erreurStockage = false;
  const sauver = () => {
    nettoyer();
    // Journal et paiements : les quatre derniers mois suffisent
    const limite = decaler(aujourdhui(), -120);
    Object.keys(S.gains).forEach(k => { if (k < limite) delete S.gains[k]; });
    Object.keys(S.payes).forEach(c => { if (!S.payes[c] || (S.payes[c].jour || '') < limite) delete S.payes[c]; });
    try { localStorage.setItem(CLE, JSON.stringify(S)); erreurStockage = false; }
    catch (e) { erreurStockage = true; }
  };
  // Demande au navigateur de ne pas effacer les données (Safari, Chrome)
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* facultatif */ }

  // ---------- Dates et heures ----------
  const dk = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parse = k => { const [y, m, j] = k.split('-').map(Number); return new Date(y, m - 1, j); };
  const aujourdhui = () => dk(new Date());
  const decaler = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dk(d); };
  const ecart = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const indexJour = k => (parse(k).getDay() + 6) % 7;            // 0 = lundi
  const lundiDe = k => decaler(k, -indexJour(k));
  const moisPlus = (k, n) => { const d = parse(k); const j = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const fin = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(j, fin)); return dk(d); };
  const fmt = (k, o) => parse(k).toLocaleDateString('fr-FR', o);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const versMin = s => { if (!s) return null; const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const minNow = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const debutOcc = o => { const d = parse(o.k); return d.getTime() + (o.el.debut || 0) * 6e4; };   // horodatage du début
  const caler = m => Math.round(m / CONFIG.pas) * CONFIG.pas;
  const borne = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  const INITIALES = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

  // Couleur éclaircie (mélangée au blanc) pour le fond des tâches
  function teinte(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const m = v => Math.round(v * a + 255 * (1 - a));
    return `rgb(${m(r)}, ${m(g)}, ${m(b)})`;
  }
  const cat = id => S.categories.find(c => c.id === id) || S.categories[0] || { id: '', nom: '', couleur: '#8d99cc' };
  const styleCat = id => { const c = cat(id).couleur; return `--c:${c};--fond:${teinte(c, .26)}`; };
  const styleEl = el => el.type === 'libre' ? `--c:${LIBRE.c};--fond:${LIBRE.fond}` : styleCat(el.cat);
  const couleurEl = el => el.type === 'libre' ? LIBRE.c : cat(el.cat).couleur;

  // ---------- Occurrences ----------
  function tombe(el, k) {
    if (k < el.date) return false;
    if (!el.rep) return k === el.date;
    if (el.rep.jusqua && k > el.rep.jusqua) return false;
    if (el.exceptions[k]) return false;
    const d = parse(k), d0 = parse(el.date);
    switch (el.rep.freq) {
      case 'jour': return true;
      case 'ouvres': return d.getDay() >= 1 && d.getDay() <= 5;
      case 'semaine': return d.getDay() === d0.getDay();
      case 'mois': return d.getDate() === d0.getDate();
    }
    return false;
  }
  const occ = (el, k) => ({ el, k, cle: el.id + '|' + k, fait: !!el.faits[k] });
  const ordre = (a, b) => (a.el.debut == null ? -1 : a.el.debut) - (b.el.debut == null ? -1 : b.el.debut)
    || (a.el.fin || 0) - (b.el.fin || 0) || a.el.titre.localeCompare(b.el.titre, 'fr');
  const duJour = k => S.elements.filter(el => tombe(el, k)).map(el => occ(el, k)).sort(ordre);
  function trouver(cle) {
    const i = cle.lastIndexOf('|');
    const el = S.elements.find(e => e.id === cle.slice(0, i));
    const k = cle.slice(i + 1);
    return el && tombe(el, k) ? occ(el, k) : null;
  }
  const copie = el => JSON.parse(JSON.stringify(el));

  // Déplace l'état d'une occurrence (fait, points) quand elle change de clé
  function transferer(ancienne, nouvelle) {
    if (ancienne === nouvelle) return;
    if (S.payes[ancienne]) { S.payes[nouvelle] = S.payes[ancienne]; delete S.payes[ancienne]; }
  }
  // Entrées datées d'un objet { date: … } à partir de « depuis », décalées de « delta » jours, retirées de la source
  function prendreDepuis(obj, depuis, delta) {
    const res = {};
    Object.keys(obj).forEach(k => { if (k >= depuis) { res[delta ? decaler(k, delta) : k] = obj[k]; delete obj[k]; } });
    return res;
  }

  // Modifie une occurrence. champs : valeurs voulues pour cette occurrence (date, debut, fin, titre, type, cat, rep).
  // portee : 'une' (cette fois seulement) ou 'suivantes' (celle-ci et les suivantes). Renvoie la nouvelle clé.
  function appliquer(o, champs, portee) {
    const el = o.el;
    const final = Object.assign({}, { date: o.k }, champs);
    if (!el.rep) {
      const fait = !!el.faits[o.k];
      Object.assign(el, final);
      el.faits = fait ? { [el.date]: true } : {};
      if (!el.rep) el.exceptions = {};
      transferer(o.cle, el.id + '|' + el.date);
      return el.id + '|' + el.date;
    }
    if (portee === 'une') {
      const fait = !!el.faits[o.k];
      el.exceptions[o.k] = true;
      delete el.faits[o.k];
      const n = Object.assign(copie(el), final, { id: uid(), rep: null, exceptions: {}, faits: {}, serie: el.id });
      if (fait) n.faits[n.date] = true;
      S.elements.push(n);
      transferer(o.cle, n.id + '|' + n.date);
      return n.id + '|' + n.date;
    }
    // Celle-ci et les suivantes
    const delta = ecart(o.k, final.date);
    if (o.k === el.date) {
      const faits = prendreDepuis(el.faits, o.k, delta), exc = prendreDepuis(el.exceptions, o.k, delta);
      Object.assign(el, final);
      el.faits = faits; el.exceptions = exc;
      return el.id + '|' + el.date;
    }
    const n = Object.assign(copie(el), final, { id: uid(), faits: prendreDepuis(el.faits, o.k, delta), exceptions: prendreDepuis(el.exceptions, o.k, delta) });
    el.rep = Object.assign({}, el.rep, { jusqua: decaler(o.k, -1) });
    Object.keys(S.payes).forEach(c => { if (c.startsWith(el.id + '|') && c.slice(el.id.length + 1) >= o.k) transferer(c, n.id + '|' + decaler(c.slice(el.id.length + 1), delta)); });
    S.elements.push(n);
    return n.id + '|' + n.date;
  }

  function supprimerOcc(o, portee) {
    const el = o.el;
    if (!el.rep || (portee === 'suivantes' && o.k === el.date)) {
      S.elements = S.elements.filter(e => e !== el);
    } else if (portee === 'une') {
      el.exceptions[o.k] = true;
      delete el.faits[o.k];
    } else {
      el.rep = Object.assign({}, el.rep, { jusqua: decaler(o.k, -1) });
      prendreDepuis(el.faits, o.k, 0);
      prendreDepuis(el.exceptions, o.k, 0);
    }
  }

  // ---------- État de l'écran (non enregistré) ----------
  const U = {
    vue: ['jour', 'semaine', 'mois', 'liste'].includes(S.vue) ? S.vue : 'jour',
    date: aujourdhui(),
    selection: null,     // clé de l'occurrence choisie (poignées visibles)
    brouillon: null,     // { k, debut, fin } : nouvelle plage en cours
    defile: {},          // position de défilement par vue
    edition: null,       // { o?, modele }
    avaler: 0            // après un geste : le clic qui suit est ignoré
  };

  // ---------- Petits morceaux ----------
  const ICONE = {
    coche: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>',
    reglages: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="10" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>',
    gauche: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    droite: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const plage = el => el.debut == null ? 'Journée entière' : `${hhmm(el.debut)} – ${hhmm(el.fin)}`;
  const nomType = el => ({ tache: 'Tâche', evenement: 'Événement', libre: 'Pour moi' }[el.type]);
  const description = o => `${nomType(o.el)} : ${o.el.titre}, ${o.el.debut == null ? 'journée entière' : 'de ' + hhmm(o.el.debut) + ' à ' + hhmm(o.el.fin)}`
    + (o.el.type === 'libre' ? `, ${ETAT_LIBRE[etatLibre(o)]}` : `, ${cat(o.el.cat).nom}`)
    + `${o.el.rep ? ', ' + REPET[o.el.rep.freq].toLowerCase() : ''}${o.el.type === 'tache' && o.fait ? ', faite' : ''}${S.payes[o.cle] && S.payes[o.cle].pts ? ', +' + S.payes[o.cle].pts + ' points' : ''}`;
  const caseTache = o => `<button type="button" class="case" role="checkbox" aria-checked="${o.fait}" data-cocher="${o.cle}"
      aria-label="${esc(o.el.titre)} : ${o.fait ? 'faite' : 'à faire'}" data-focus="c${o.cle}">${ICONE.coche}</button>`;

  const stadeDe = pts => CONFIG.stades.reduce((a, s) => (pts >= s.seuil ? s : a), CONFIG.stades[0]);
  const stade = () => stadeDe(S.points);
  const suivant = () => CONFIG.stades.find(s => s.seuil > S.points) || null;

  // ---------- Points ----------
  // Tout gain ou retrait passe par ici : le total et le journal du jour restent d'accord.
  function gagner(source, pts, k) {
    const avant = stade();
    S.points = Math.max(0, S.points + pts);
    const g = (S.gains[k] = S.gains[k] || { taches: 0, libre: 0 });
    g[source] = (g[source] || 0) + pts;
    if (pts > 0) {
      U.reaction = true;
      const apres = stade();
      if (apres.id !== avant.id) U.grandi = apres;
    }
  }
  const finOcc = o => parse(o.k).getTime() + (o.el.fin == null ? 1440 : o.el.fin) * 6e4;
  const prevue = o => (o.el.creeLe || 0) < debutOcc(o);             // planifiée avant son début
  function payer(o) {
    const type = o.el.type === 'libre' ? 'libre' : 'tache';
    const pts = CONFIG.points[type];
    S.payes[o.cle] = { pts, jour: o.k, type };
    gagner(type === 'libre' ? 'libre' : 'taches', pts, o.k);
    return pts;
  }
  // Tâches et événements qui empiètent sur un temps pour moi
  const grignoteurs = o => duJour(o.k).filter(x => x.el.type !== 'libre' && x.el.debut != null && x.el.debut < o.el.fin && x.el.fin > o.el.debut);
  const libresPayes = k => Object.values(S.payes).filter(p => p.type === 'libre' && p.jour === k && p.pts > 0).length;
  const ETAT_LIBRE = { paye: 'gardé', grignote: 'grignoté', tard: 'ajouté après son début', court: 'moins de 30 min', plafond: 'déjà 2 ce jour-là', 'en-cours': 'en cours', protege: 'protégé' };
  function etatLibre(o) {
    const p = S.payes[o.cle];
    if (p) return p.pts > 0 ? 'paye' : (p.raison || 'grignote');
    if (grignoteurs(o).length) return 'grignote';
    if (!prevue(o)) return 'tard';
    if (o.el.fin - o.el.debut < CONFIG.points.libreMin) return 'court';
    const now = Date.now();
    return now >= debutOcc(o) && now < finOcc(o) ? 'en-cours' : 'protege';
  }
  // Verse ce qui est dû : tâches cochées en avance dont l'heure est venue, temps pour moi arrivés au bout.
  function crediter() {
    const now = Date.now(), auj = aujourdhui();
    let change = false;
    for (let i = -14; i <= 0; i++) {
      const k = decaler(auj, i);
      duJour(k).forEach(o => {
        if (S.payes[o.cle]) return;
        if (o.el.type === 'tache' && o.fait && prevue(o) && debutOcc(o) <= now) { payer(o); change = true; }
        else if (o.el.type === 'libre' && finOcc(o) <= now) {
          let raison = null;
          if (!prevue(o)) raison = 'tard';
          else if (grignoteurs(o).length) raison = 'grignote';
          else if (o.el.fin - o.el.debut < CONFIG.points.libreMin) raison = 'court';
          else if (libresPayes(k) >= CONFIG.points.libresParJour) raison = 'plafond';
          if (raison) S.payes[o.cle] = { pts: 0, jour: k, type: 'libre', raison };
          else payer(o);
          change = true;
        }
      });
    }
    if (change) sauver();
    return change;
  }
  // Cocher ou décocher une tâche, avec ses points. Renvoie le message à afficher.
  function basculer(o) {
    if (o.fait) {
      delete o.el.faits[o.k];
      o.fait = false;
      const p = S.payes[o.cle];
      if (p && p.pts) { gagner('taches', -p.pts, p.jour); delete S.payes[o.cle]; return `Décochée : −${p.pts} pts.`; }
      return 'Décochée.';
    }
    o.el.faits[o.k] = true;
    o.fait = true;
    if (!prevue(o)) return 'Bien joué ! Pas de points : elle a été ajoutée après son début.';
    if (debutOcc(o) > Date.now()) {
      const quand = o.k === aujourdhui() && o.el.debut != null ? 'à ' + hhmm(o.el.debut) : 'le ' + fmt(o.k, { weekday: 'long', day: 'numeric', month: 'long' });
      return `Fait en avance : +${CONFIG.points.tache} pts ${quand}.`;
    }
    return `+${payer(o)} pts`;
  }

  // Minutes occupées par les tâches et événements (les chevauchements comptent une fois)
  function minutesPrevues(k) {
    const iv = duJour(k).filter(o => o.el.type !== 'libre' && o.el.debut != null).map(o => [o.el.debut, o.el.fin]).sort((a, b) => a[0] - b[0]);
    let total = 0, d = -1, f = -1;
    iv.forEach(([a, b]) => { if (a > f) { total += Math.max(0, f - d); d = a; f = b; } else f = Math.max(f, b); });
    return total + Math.max(0, f - d);
  }
  const duree = m => `${Math.floor(m / 60)} h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') : ''}`;
  function humeur() {
    const h = new Date().getHours();
    if (h >= CONFIG.heures.coucher || h < CONFIG.heures.lever) return 'endormie';
    const auj = aujourdhui(), occs = duJour(auj), m = minNow();
    if (occs.some(o => o.el.type === 'libre' && o.el.debut <= m && m < o.el.fin && !grignoteurs(o).length)) return 'joyeuse';
    const t = occs.filter(o => o.el.type === 'tache');
    if (t.length && t.every(o => o.fait)) return 'joyeuse';
    if (minutesPrevues(auj) > CONFIG.surcharge) return 'fatiguee';
    return t.length ? 'determinee' : 'curieuse';
  }
  function phraseGuts(hum) {
    const auj = aujourdhui(), occs = duJour(auj), m = minNow();
    const reste = occs.filter(o => o.el.type === 'tache' && !o.fait).length;
    if (hum === 'endormie') return 'Chut… Guts dort. Demain se prépare tout seul.';
    if (hum === 'fatiguee') return `Grosse journée : ${duree(minutesPrevues(auj))} prévues. Garde un moment pour toi.`;
    if (hum === 'joyeuse') return occs.some(o => o.el.type === 'libre' && o.el.debut <= m && m < o.el.fin) ? 'Temps pour toi en cours. Profite, Guts veille.' : 'Tout est fait. Le reste de la journée t\'appartient.';
    if (hum === 'determinee') return `Encore ${reste} tâche${reste > 1 ? 's' : ''} aujourd'hui. Une à la fois.`;
    return 'Rien de prévu ? Réserve un moment pour toi.';
  }
  // Le renard, avec son petit saut quand on vient de gagner des points
  function dessinGuts(hum) {
    const svg = renard(stade().id, hum);
    return U.reaction ? svg.replace('class="fox ', 'class="fox saut ') : svg;
  }

  // ---------- En-tête ----------
  function titre() {
    if (U.vue === 'liste') return { petit: 'Les prochains jours', grand: 'À venir' };
    const d = parse(U.date);
    return { petit: String(d.getFullYear()), grand: cap(d.toLocaleDateString('fr-FR', { month: 'long' })) };
  }
  function renderHaut() {
    const t = titre();
    const st = stade();
    const surAuj = U.vue === 'liste' || (U.vue === 'jour' && U.date === aujourdhui())
      || (U.vue === 'semaine' && lundiDe(U.date) === lundiDe(aujourdhui())) || (U.vue === 'mois' && U.date.slice(0, 7) === aujourdhui().slice(0, 7) && U.date === aujourdhui());
    $('#haut').innerHTML = `
      <div class="ligne1">
        <button type="button" class="guts-mini" data-action="guts" aria-label="Guts, ${st.nom}, ${S.points} points" data-focus="guts">${dessinGuts(humeur())}<span aria-hidden="true"><b${U.reaction ? ' class="monte"' : ''}>${S.points}</b><small>pts</small></span></button>
        <h1 aria-live="polite"><small>${esc(t.petit)}</small>${esc(t.grand)}</h1>
        ${U.vue === 'liste' ? '' : `<button type="button" class="rond" data-nav="-1" aria-label="${libNav(-1)}" data-focus="nav-1">${ICONE.gauche}</button>
        <button type="button" class="rond" data-nav="1" aria-label="${libNav(1)}" data-focus="nav1">${ICONE.droite}</button>`}
        <button type="button" class="rond" data-action="reglages" aria-label="Réglages" data-focus="reglages">${ICONE.reglages}</button>
      </div>
      <div class="ligne2">
        <div class="vues" role="tablist" aria-label="Vue du calendrier">
          ${[['jour', 'Jour'], ['semaine', 'Semaine'], ['mois', 'Mois'], ['liste', 'Liste']].map(([v, n]) =>
            `<button type="button" role="tab" aria-selected="${U.vue === v}" data-vue="${v}" data-focus="vue-${v}">${n}</button>`).join('')}
        </div>
        <button type="button" class="pilule" data-action="aujourdhui" data-focus="auj" ${surAuj ? 'disabled' : ''}>Aujourd'hui</button>
      </div>`;
  }
  const libNav = s => ({ jour: s < 0 ? 'Jour précédent' : 'Jour suivant', semaine: s < 0 ? 'Semaine précédente' : 'Semaine suivante', mois: s < 0 ? 'Mois précédent' : 'Mois suivant' }[U.vue] || '');

  // ---------- Grille horaire (Jour et Semaine) ----------
  // Répartit les plages qui se chevauchent en colonnes côte à côte
  function disposer(liste) {
    const items = liste.filter(o => o.el.debut != null).map(o => ({ o, d: o.el.debut, f: Math.max(o.el.fin, o.el.debut + 20) }))
      .sort((a, b) => a.d - b.d || b.f - a.f);
    const res = [];
    let groupe = [], finGroupe = -1;
    const fermer = () => { const n = Math.max(...groupe.map(g => g.col)) + 1; groupe.forEach(g => { g.n = n; res.push(g); }); groupe = []; };
    items.forEach(it => {
      if (groupe.length && it.d >= finGroupe) fermer();
      const fins = [];
      groupe.forEach(g => { fins[g.col] = Math.max(fins[g.col] || 0, g.f); });
      let c = 0;
      while (fins[c] != null && fins[c] > it.d) c++;
      it.col = c;
      groupe.push(it);
      finGroupe = Math.max(finGroupe, it.f);
    });
    if (groupe.length) fermer();
    return res;
  }

  function bloc(g) {
    const o = g.o, el = o.el;
    const haut = el.debut / 60 * H, hauteur = Math.max((el.fin - el.debut) / 60 * H, 20);
    const court = hauteur < 38;
    const choisi = U.selection === o.cle;
    const avecCase = el.type === 'tache' && U.vue === 'jour';
    const etat = el.type === 'libre' ? etatLibre(o) : null;
    const paye = S.payes[o.cle] && S.payes[o.cle].pts;
    return `<div class="bloc ${el.type}${etat === 'grignote' ? ' grignote' : ''}${o.fait ? ' fait' : ''}${court ? ' court' : ''}${choisi ? ' choisi' : ''}${g.n > 1 && U.vue === 'semaine' ? ' etroit' : ''}" data-cle="${o.cle}"
        style="top:${haut}px;height:${hauteur}px;left:calc(${g.col / g.n * 100}% + 2px);width:calc(${100 / g.n}% - 4px);${styleEl(el)}">
      <button type="button" class="b-ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}"></button>
      ${avecCase ? caseTache(o) : ''}
      <span class="b-texte" aria-hidden="true"><b>${U.vue === 'semaine' && o.fait ? '✓ ' : ''}${esc(el.titre)}</b><small>${hhmm(el.debut)}${court ? '' : ' – ' + hhmm(el.fin)}${etat ? ' · ' + ETAT_LIBRE[etat] : ''}</small></span>
      ${paye ? `<span class="gain" aria-hidden="true">+${paye}</span>` : ''}
      <span class="bord" data-bord="bas" aria-hidden="true"></span>
      ${choisi ? '<span class="poignee haut" data-bord="haut" aria-hidden="true"></span><span class="poignee bas" data-bord="bas" aria-hidden="true"></span>' : ''}
    </div>`;
  }
  function blocBrouillon(b) {
    const hauteur = Math.max((b.fin - b.debut) / 60 * H, 20);
    return `<div class="bloc brouillon${hauteur < 38 ? ' court' : ''}" data-brouillon="1" style="top:${b.debut / 60 * H}px;height:${hauteur}px;left:2px;width:calc(100% - 4px)">
      <button type="button" class="b-ouvrir" data-action="remplir" aria-label="Nouvelle plage de ${hhmm(b.debut)} à ${hhmm(b.fin)} : toucher pour la remplir" data-focus="brouillon"></button>
      <span class="b-texte" aria-hidden="true"><b>Nouvelle</b><small>${hhmm(b.debut)} – ${hhmm(b.fin)}</small></span>
      <span class="poignee haut" data-bord="haut" aria-hidden="true"></span><span class="poignee bas" data-bord="bas" aria-hidden="true"></span>
    </div>`;
  }

  function grille(jours) {
    const auj = aujourdhui();
    let h = '';
    const mn = jours.includes(auj) ? minNow() : -99;
    // L'étiquette de l'heure s'efface quand la ligne « maintenant » passe dessus
    for (let i = 1; i < 24; i++) h += `${Math.abs(i * 60 - mn) < 13 ? '' : `<div class="heure" style="top:${i * H}px">${hhmm(i * 60)}</div>`}<div class="trait-h" style="top:${i * H}px"></div>`;
    const cols = jours.map(k => {
      const occs = duJour(k);
      const blocs = disposer(occs).map(bloc).join('');
      const br = U.brouillon && U.brouillon.k === k ? blocBrouillon(U.brouillon) : '';
      return `<div class="colonne${k === auj ? ' auj' : ''}" data-jour="${k}">${blocs}${br}</div>`;
    }).join('');
    const iAuj = jours.indexOf(auj);
    const m = minNow();
    const ligne = iAuj < 0 ? '' : `<div class="maintenant" style="top:${m / 60 * H}px"><span>${hhmm(m)}</span>${jours.length > 1 ? `<i style="left:calc((100% - 4px) * ${(iAuj + .5) / jours.length})"></i>` : ''}</div>`;
    return `<div class="grille">${h}<div class="colonnes" style="--n:${jours.length}" role="group" aria-label="Grille horaire">${cols}</div>${ligne}</div><div class="bas-espace"></div>`;
  }

  function bandeSemaine(k, choix) {
    const l = lundiDe(k), auj = aujourdhui();
    return Array.from({ length: 7 }, (_, i) => {
      const d = decaler(l, i);
      const n = duJour(d).length;
      return `<button type="button" class="jour-b${d === auj ? ' auj' : ''}" data-aller="${d}" aria-pressed="${d === choix}" data-focus="j${d}"
        aria-label="${cap(fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }))}${d === auj ? ", aujourd'hui" : ''}${n ? ', ' + n + ' élément' + (n > 1 ? 's' : '') : ''}">
        <span aria-hidden="true">${INITIALES[i]}</span><b aria-hidden="true">${parse(d).getDate()}</b><i class="${n ? 'plein' : ''}" aria-hidden="true"></i></button>`;
    }).join('');
  }

  function puce(o) {
    return `<div class="puce${o.fait ? ' fait' : ''}" style="${styleEl(o.el)}">
      ${o.el.type === 'tache' ? caseTache(o) : ''}
      <button type="button" class="ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}">${esc(o.el.titre)}</button></div>`;
  }

  function vueJour() {
    const k = U.date, occs = duJour(k);
    const entieres = occs.filter(o => o.el.debut == null);
    const taches = occs.filter(o => o.el.type === 'tache');
    const faites = taches.filter(o => o.fait).length;
    return `
      <div class="bande">
        <button type="button" class="fleche" data-saut="-7" aria-label="Semaine précédente" data-focus="s-7">${ICONE.gauche}</button>
        ${bandeSemaine(k, k)}
        <button type="button" class="fleche" data-saut="7" aria-label="Semaine suivante" data-focus="s7">${ICONE.droite}</button>
      </div>
      <div class="jour-titre"><span>${cap(fmt(k, { weekday: 'long', day: 'numeric', month: 'long' }))}</span>
        ${taches.length ? `<span class="compte">Tâches : ${faites} / ${taches.length}</span>` : ''}</div>
      ${entieres.length ? `<div class="journee">${entieres.map(puce).join('')}</div>` : ''}
      <div class="defile" data-defile="jour">${grille([k])}</div>
      ${boutonPlus()}`;
  }

  function vueSemaine() {
    const l = lundiDe(U.date), auj = aujourdhui();
    const jours = Array.from({ length: 7 }, (_, i) => decaler(l, i));
    const entieres = jours.map(k => duJour(k).filter(o => o.el.debut == null));
    const aEntieres = entieres.some(e => e.length);
    return `
      <div class="sem-tete"><span></span>
        ${jours.map((k, i) => `<button type="button" class="jour-b${k === auj ? ' auj' : ''}" data-ouvrir-jour="${k}" data-focus="sj${k}"
            aria-label="${cap(fmt(k, { weekday: 'long', day: 'numeric', month: 'long' }))} : voir la journée">
          <span aria-hidden="true">${INITIALES[i]}</span><b aria-hidden="true">${parse(k).getDate()}</b></button>`).join('')}<span></span>
      </div>
      ${aEntieres ? `<div class="sem-journee"><span>jour</span>${entieres.map(e => `<div>${e.map(o =>
        `<button type="button" class="mini-puce${o.fait ? ' fait' : ''}" style="${styleEl(o.el)}" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}">${esc(o.el.titre)}</button>`).join('')}</div>`).join('')}<span></span></div>` : ''}
      <div class="defile semaine" data-defile="semaine">${grille(jours)}</div>
      ${boutonPlus()}`;
  }

  // ---------- Listes ----------
  function ligneOcc(o) {
    const el = o.el;
    const heures = el.debut == null ? '<span class="heures">Journée</span>' : `<span class="heures">${hhmm(el.debut)}<small>${hhmm(el.fin)}</small></span>`;
    const p = S.payes[o.cle];
    const details = (el.type === 'libre' ? ['Pour moi', ETAT_LIBRE[etatLibre(o)]] : [cat(el.cat).nom, el.type === 'evenement' ? 'Événement' : ''])
      .concat([el.rep ? REPET[el.rep.freq] : '', p && p.pts && el.type === 'tache' ? '+' + p.pts + ' pts' : '']).filter(Boolean).join(' · ');
    return `<div class="ligne-occ${o.fait ? ' fait' : ''}" style="${styleEl(el)}">
      <span class="marque">${el.type === 'tache' ? caseTache(o) : `<i aria-hidden="true"${el.type === 'libre' ? ' class="m-libre"' : ''}></i>`}</span>
      <button type="button" class="ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}">${heures}
        <span class="quoi"><b>${esc(el.titre)}</b><small>${esc(details)}</small></span></button>
    </div>`;
  }
  const nomJour = k => {
    const auj = aujourdhui();
    const base = fmt(k, { weekday: 'long', day: 'numeric', month: 'long' });
    return k === auj ? "Aujourd'hui · " + base : k === decaler(auj, 1) ? 'Demain · ' + base : base;
  };

  function vueMois() {
    const k = U.date, auj = aujourdhui();
    const premier = k.slice(0, 8) + '01';
    const depart = lundiDe(premier);
    const cases = [];
    for (let i = 0; i < 42; i++) {
      const d = decaler(depart, i);
      if (i === 35 && d.slice(0, 7) !== k.slice(0, 7)) break;      // 5 semaines suffisent
      const occs = duJour(d);
      const couleurs = [...new Set(occs.map(o => couleurEl(o.el)))].slice(0, 3);
      cases.push(`<button type="button" class="${d.slice(0, 7) !== k.slice(0, 7) ? 'autre' : ''}${d === auj ? ' auj' : ''}" data-choisir="${d}" aria-pressed="${d === k}" data-focus="m${d}"
          aria-label="${cap(fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }))}${d === auj ? ", aujourd'hui" : ''}${occs.length ? ', ' + occs.length + ' élément' + (occs.length > 1 ? 's' : '') : ''}">
        <b aria-hidden="true">${parse(d).getDate()}</b><span class="points-jour" aria-hidden="true">${couleurs.map(c => `<i style="--c:${c}"></i>`).join('')}</span></button>`);
    }
    const occs = duJour(k);
    return `<div class="defile" data-defile="mois">
      <div class="mois">
        <div class="mois-tete" aria-hidden="true">${INITIALES.map(l => `<span>${l}</span>`).join('')}</div>
        <div class="mois-grille">${cases.join('')}</div>
      </div>
      <div class="mois-jour">
        <h2 class="titre-jour${k === auj ? ' auj' : ''}"><span>${esc(nomJour(k))}</span><button type="button" class="lien" style="font-size:13px;min-height:0;padding:0" data-ouvrir-jour="${k}" data-focus="voirjour">Voir la journée</button></h2>
        ${occs.length ? occs.map(ligneOcc).join('') : `<p class="vide">Rien de prévu.</p>`}
      </div>
      <div class="bas-espace"></div>
    </div>${boutonPlus()}`;
  }

  function vueListe() {
    const auj = aujourdhui();
    let h = '', total = 0;
    for (let i = 0; i < CONFIG.joursListe; i++) {
      const k = decaler(auj, i);
      const occs = duJour(k);
      if (!occs.length && i > 0) continue;
      total += occs.length;
      const t = occs.filter(o => o.el.type === 'tache');
      h += `<section aria-label="${esc(nomJour(k))}"><h2 class="titre-jour${k === auj ? ' auj' : ''}"><span>${esc(nomJour(k))}</span>${t.length ? `<small>${t.filter(o => o.fait).length} / ${t.length}</small>` : ''}</h2>
        ${occs.length ? occs.map(ligneOcc).join('') : '<p class="vide">Rien de prévu aujourd\'hui.</p>'}</section>`;
    }
    if (!total) h += `<div class="vide"><p>Rien de prévu pour les ${CONFIG.joursListe} prochains jours.</p><button type="button" class="bouton" data-action="ajouter" data-focus="ajouter-vide">Ajouter</button></div>`;
    return `<div class="defile" data-defile="liste">${h}<div class="bas-espace"></div></div>${boutonPlus()}`;
  }

  const boutonPlus = () => `<button type="button" class="plus" data-action="ajouter" aria-label="Ajouter une tâche ou un événement" data-focus="plus">${ICONE.plus}</button>`;

  // ---------- Rendu ----------
  function signatureFocus() {
    const a = document.activeElement;
    return a && a.dataset && a.dataset.focus ? a.dataset.focus : null;
  }
  function render(focus) {
    const f = focus || signatureFocus();
    const ancien = $('#vue .defile');
    if (ancien) U.defile[ancien.dataset.defile] = ancien.scrollTop;
    if (U.recentrer) { U.defile = {}; U.recentrer = false; }       // revenir à l'heure actuelle
    if (U.haut) { delete U.defile.mois; U.haut = false; }          // nouveau mois : en haut
    renderHaut();
    $('#vue').innerHTML = rappel() + { jour: vueJour, semaine: vueSemaine, mois: vueMois, liste: vueListe }[U.vue]();
    U.reaction = false;
    const d = $('#vue .defile');
    if (d) {
      const v = d.dataset.defile;
      if (U.defile[v] != null) d.scrollTop = U.defile[v];
      else if (v === 'jour' || v === 'semaine') {
        const sur = v === 'jour' ? U.date === aujourdhui() : lundiDe(U.date) === lundiDe(aujourdhui());
        // Aujourd'hui : l'heure pleine d'avant, moins une heure ; sinon l'heure d'ouverture
        d.scrollTop = Math.max(0, (sur ? Math.min(Math.floor(minNow() / 60) * 60 - 60, 16 * 60) : CONFIG.ouverture * 60) / 60 * H);
      }
    }
    if (f) { const c = document.querySelector(`[data-focus="${CSS.escape(f)}"]`); if (c) c.focus({ preventScroll: true }); }
  }

  let minuteurToast;
  function dire(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('visible');
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => t.classList.remove('visible'), 2600);
  }

  // ---------- Navigation ----------
  function changerVue(v) {
    U.vue = v; S.vue = v; U.selection = null; U.brouillon = null;
    sauver(); render();
  }
  function naviguer(sens) {
    U.selection = null; U.brouillon = null;
    if (U.vue === 'jour') U.date = decaler(U.date, sens);
    else if (U.vue === 'semaine') U.date = decaler(U.date, 7 * sens);
    else if (U.vue === 'mois') { U.date = moisPlus(U.date, sens); U.haut = true; }
    render();
  }
  function allerA(k, vue) {
    U.date = k; U.selection = null; U.brouillon = null;
    if (vue && vue !== U.vue) { U.vue = vue; S.vue = vue; sauver(); }
    render();
  }

  // ---------- Questions (remplace confirm) ----------
  function demander(titreQ, texte, options) {
    return new Promise(resoudre => {
      const d = $('#question');
      $('#q-titre').textContent = titreQ;
      $('#q-texte').textContent = texte;
      $('#q-choix').innerHTML = options.map((o, i) => `<button type="button" class="bouton${o.clair ? ' clair' : ''}" data-q="${i}">${esc(o.texte)}</button>`).join('');
      let rendu = null;
      const fin = () => { d.removeEventListener('close', fin); resoudre(rendu); };
      d.addEventListener('close', fin);
      $('#q-choix').onclick = e => { const b = e.target.closest('[data-q]'); if (!b) return; rendu = options[+b.dataset.q].valeur; d.close(); };
      d.showModal();
    });
  }
  const demanderPortee = (action) => demander('Élément répété', `${action} seulement cette fois, ou celle-ci et toutes les suivantes ?`, [
    { texte: 'Cette fois seulement', valeur: 'une' },
    { texte: 'Celle-ci et les suivantes', valeur: 'suivantes' },
    { texte: 'Annuler', valeur: null, clair: true }
  ]);

  // ---------- Cocher ----------
  function cocher(cle) {
    const o = trouver(cle);
    if (!o || o.el.type !== 'tache') return;
    const msg = basculer(o);
    sauver();
    render();
    dire(msg);
    grandir();
  }
  // Nouveau stade : on le dit
  function grandir() {
    if (!U.grandi) return;
    dire(`Guts grandit : ${U.grandi.nom} !`);
    U.grandi = null;
  }
  // Une tâche ou un événement posé sur un temps pour moi : on prévient
  function avertir(cle) {
    const o = trouver(cle);
    if (!o || o.el.type === 'libre' || o.el.debut == null || finOcc(o) <= Date.now()) return false;
    const l = duJour(o.k).find(x => x.el.type === 'libre' && x.el.debut < o.el.fin && x.el.fin > o.el.debut && !S.payes[x.cle]);
    if (!l) return false;
    dire(`Attention : ça empiète sur « ${l.el.titre} » (${hhmm(l.el.debut)} – ${hhmm(l.el.fin)}).`);
    return true;
  }

  // ---------- Éditeur ----------
  const ED = $('#editeur'), FORM = $('#form-ed');
  const champ = n => FORM.elements.namedItem(n);
  function ouvrirEditeur(o, modele) {
    U.edition = { o: o || null };
    const el = o ? o.el : null;
    const m = el ? { type: el.type, titre: el.titre, date: o.k, debut: el.debut, fin: el.fin, rep: el.rep, cat: el.cat, fait: o.fait }
      : Object.assign({ type: 'tache', titre: '', date: U.date, debut: 9 * 60, fin: 10 * 60, rep: null, cat: S.categories[0].id, fait: false }, modele);
    U.edition.depart = m;
    U.edition.duree = m.debut == null ? CONFIG.duree : m.fin - m.debut;
    FORM.reset();
    champ('type').value = m.type;
    champ('titre').value = m.titre;
    champ('journee').checked = m.debut == null;
    champ('date').value = m.date;
    champ('debut').value = hhmm(m.debut == null ? 9 * 60 : m.debut);
    champ('fin').value = hhmm(m.fin == null ? 10 * 60 : m.fin % 1440);
    champ('rep').value = m.rep ? m.rep.freq : '';
    champ('jusqua').value = m.rep && m.rep.jusqua ? m.rep.jusqua : '';
    $('#ed-cats').innerHTML = S.categories.map(c => `<label style="--c:${c.couleur}"><input type="radio" name="cat" value="${esc(c.id)}"${c.id === (cat(m.cat).id) ? ' checked' : ''}><i aria-hidden="true"></i>${esc(c.nom)}</label>`).join('');
    champ('fait').checked = !!m.fait;
    $('#ed-erreur').textContent = '';
    $('#ed-ok').textContent = o ? 'OK' : 'Ajouter';
    $('#ed-supprimer').hidden = !o;
    majEditeur();
    ED.showModal();
    if (!o) setTimeout(() => champ('titre').focus(), 60);
  }
  function majEditeur() {
    const journee = champ('journee').checked;
    champ('debut').disabled = champ('fin').disabled = journee;
    document.querySelectorAll('#editeur .horaire').forEach(r => r.classList.toggle('cache', journee));
    const rep = !!champ('rep').value;
    $('#ed-jusqua').classList.toggle('cache', !rep);
    $('#ed-jusqua-note').hidden = !rep;
    const type = champ('type').value;
    const libre = type === 'libre';
    $('#ed-fait').hidden = !(type === 'tache' && U.edition && U.edition.o);
    // Un temps pour moi a toujours des heures et pas de catégorie
    $('#ed-journee').classList.toggle('cache', libre);
    if (libre && journee) { champ('journee').checked = false; return majEditeur(); }
    $('#ed-cat-zone').hidden = libre;
    champ('titre').placeholder = libre ? LIBRE.titre : 'Titre';
    const nouveau = !(U.edition && U.edition.o);
    $('#ed-titre').textContent = nouveau ? { tache: 'Nouvelle tâche', evenement: 'Nouvel événement', libre: 'Temps pour moi' }[type] : nomType({ type });
    $('#ed-regle').textContent = {
      tache: `Rapporte ${CONFIG.points.tache} pts une fois faite, si elle est prévue avant son début.`,
      evenement: 'Un rendez-vous, un cours… Il ne se coche pas.',
      libre: `Rapporte ${CONFIG.points.libre} pts si rien d'autre n'est prévu sur ce créneau jusqu'à la fin (${CONFIG.points.libreMin} min au moins, ${CONFIG.points.libresParJour} par jour).`
    }[type];
  }
  FORM.addEventListener('input', e => {
    // Changer le début garde la durée, comme l'app Calendrier ; changer la fin règle la durée
    const n = e.target.name;
    if (n === 'debut' || n === 'fin') {
      const d = versMin(champ('debut').value), f0 = versMin(champ('fin').value);
      if (n === 'debut' && d != null && U.edition.duree > 0) champ('fin').value = hhmm(Math.min(d + U.edition.duree, 1440) % 1440);
      else if (n === 'fin' && d != null && f0 != null) { const f = f0 === 0 ? 1440 : f0; if (f > d) U.edition.duree = f - d; }
    }
    majEditeur();
  });
  FORM.addEventListener('change', majEditeur);

  function lireFormulaire() {
    const libre = champ('type').value === 'libre';
    const titre = champ('titre').value.trim() || (libre ? LIBRE.titre : '');
    if (!titre) return { erreur: 'Donne un titre.', champ: champ('titre') };
    if (!champ('date').value) return { erreur: 'Choisis une date.', champ: champ('date') };
    const journee = champ('journee').checked && !libre;
    let debut = null, fin = null;
    if (!journee) {
      debut = versMin(champ('debut').value); fin = versMin(champ('fin').value);
      if (debut == null || fin == null) return { erreur: 'Indique le début et la fin.', champ: champ('debut') };
      if (fin === 0 && debut > 0) fin = 1440;              // « 00:00 » en fin = minuit
      if (fin <= debut) return { erreur: 'La fin doit être après le début.', champ: champ('fin') };
    }
    const freq = champ('rep').value;
    const jusqua = freq && champ('jusqua').value ? champ('jusqua').value : null;
    if (jusqua && jusqua < champ('date').value) return { erreur: "« Jusqu'au » doit venir après la date.", champ: champ('jusqua') };
    const c = FORM.querySelector('input[name="cat"]:checked');
    const type = ['evenement', 'libre'].includes(champ('type').value) ? champ('type').value : 'tache';
    return { champs: { type, titre, date: champ('date').value, debut, fin, rep: freq ? { freq, jusqua } : null, cat: c ? c.value : S.categories[0].id }, fait: champ('fait').checked };
  }
  const memeRep = (a, b) => (!a && !b) || (a && b && a.freq === b.freq && (a.jusqua || null) === (b.jusqua || null));

  FORM.addEventListener('submit', async e => {
    e.preventDefault();
    const r = lireFormulaire();
    if (r.erreur) { $('#ed-erreur').textContent = r.erreur; r.champ.focus(); return; }
    const o = U.edition.o;
    let cle;
    if (!o) {
      const el = Object.assign({ id: uid(), exceptions: {}, faits: {}, creeLe: Date.now() }, r.champs);
      S.elements.push(el);
      cle = el.id + '|' + el.date;
      const n = trouver(cle);
      dire(el.type !== 'evenement' && n && !prevue(n) ? (el.type === 'tache' ? 'Tâche ajoutée. Déjà commencée : elle ne rapportera pas de points.' : 'Ajouté. Déjà commencé : pas de points cette fois.')
        : { tache: 'Tâche ajoutée.', evenement: 'Événement ajouté.', libre: 'Temps pour moi protégé.' }[el.type]);
    } else {
      let portee = 'une';
      if (o.el.rep) {
        if (!memeRep(o.el.rep, r.champs.rep)) portee = 'suivantes';
        else {
          const dep = U.edition.depart;
          const change = ['type', 'titre', 'date', 'debut', 'fin', 'cat'].some(c => dep[c] !== r.champs[c]);
          if (!change) { sauver(); ED.close(); render(); return; }
          portee = await demanderPortee('Modifier');
          if (!portee) return;
        }
      }
      const champs = Object.assign({}, r.champs);
      if (portee === 'une' && o.el.rep) delete champs.rep;
      cle = appliquer(o, champs, portee);
      // « Faite » dans le formulaire : appliquée à l'occurrence finale, avec ses points
      const n = trouver(cle);
      if (n && n.el.type === 'tache' && n.fait !== r.fait) dire(basculer(n));
    }
    avertir(cle);
    sauver();
    ED.close();
    U.brouillon = null;
    U.selection = null;
    const k = cle.slice(cle.lastIndexOf('|') + 1);
    if (U.vue !== 'liste' && k !== U.date && (U.vue === 'jour' || (U.vue === 'semaine' && lundiDe(k) !== lundiDe(U.date)) || (U.vue === 'mois' && k.slice(0, 7) !== U.date.slice(0, 7)))) U.date = k;
    else if (U.vue === 'mois') U.date = k;
    render('o' + cle);
    grandir();
  });

  ED.addEventListener('click', async e => {
    const b = e.target.closest('[data-ed]');
    if (!b) return;
    if (b.dataset.ed === 'annuler') { ED.close(); return; }
    if (b.dataset.ed === 'supprimer') {
      const o = U.edition.o;
      let portee = 'une';
      if (o.el.rep) { portee = await demanderPortee('Supprimer'); if (!portee) return; }
      supprimerOcc(o, portee);
      sauver();
      ED.close();
      U.selection = null;
      dire({ tache: 'Tâche supprimée.', evenement: 'Événement supprimé.', libre: 'Temps pour moi supprimé.' }[o.el.type]);
      render('plus');
    }
  });
  ED.addEventListener('close', () => {
    U.edition = null;
    if (U.brouillon) { U.brouillon = null; render(); }
  });

  // ---------- Réglages ----------
  const RG = $('#reglages');
  function renderReglages() {
    const der = S.derniereExport ? new Date(S.derniereExport).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : null;
    $('#r-corps').innerHTML = `
      <fieldset><legend>Catégories</legend>
        <div class="groupe">
          ${S.categories.map((c, i) => `<div class="r-cat" style="--c:${c.couleur}">
            <div class="r-nom"><label class="masque" for="rc-${i}">Nom de la catégorie ${i + 1}</label>
              <input type="text" id="rc-${i}" value="${esc(c.nom)}" data-rc-nom="${esc(c.id)}" maxlength="24" autocomplete="off">
              ${S.categories.length > 1 ? `<button type="button" class="retirer" data-rc-retirer="${esc(c.id)}" aria-label="Retirer la catégorie ${esc(c.nom)}">Retirer</button>` : ''}</div>
            <div class="nuancier" role="radiogroup" aria-label="Couleur de ${esc(c.nom)}">${PALETTE.map(p => `<label style="--c:${p.c}"><input type="radio" name="rc-col-${esc(c.id)}" value="${p.c}" data-rc-couleur="${esc(c.id)}"${p.c === c.couleur ? ' checked' : ''} aria-label="${p.nom}"></label>`).join('')}</div>
          </div>`).join('')}
        </div>
        <div class="actions" style="margin-top:10px">${S.categories.length < 10 ? '<button type="button" class="bouton clair" data-r="ajouter-cat">Ajouter une catégorie</button>' : ''}</div>
      </fieldset>
      <fieldset><legend>Sauvegarde</legend>
        <p class="note">Tes données restent sur cet appareil. Exporte-les de temps en temps vers Fichiers ou iCloud Drive : c'est ce qui te permet de les retrouver si tu changes de téléphone ou supprimes l'app.</p>
        <p class="note" style="margin-top:6px"><b>${der ? 'Dernière sauvegarde : ' + der + '.' : 'Aucune sauvegarde pour l\'instant.'}</b></p>
        <div class="actions" style="margin-top:10px">
          <button type="button" class="bouton" data-r="exporter">Sauvegarder</button>
          <button type="button" class="bouton clair" data-r="importer">Restaurer</button>
        </div>
      </fieldset>
      <p class="version">Guts v${VERSION}</p>`;
  }
  RG.addEventListener('input', e => {
    const n = e.target.dataset.rcNom;
    if (n != null) { const c = S.categories.find(x => x.id === n); if (c) { c.nom = e.target.value.trim() || c.nom; sauver(); renderHaut(); } }
  });
  RG.addEventListener('change', e => {
    const id = e.target.dataset.rcCouleur;
    if (id != null) { const c = S.categories.find(x => x.id === id); if (c) { c.couleur = e.target.value; sauver(); const r = e.target.closest('.r-cat'); if (r) r.style.setProperty('--c', c.couleur); } }
  });
  RG.addEventListener('click', async e => {
    const b = e.target.closest('[data-r], [data-rc-retirer]');
    if (!b) return;
    if (b.dataset.rcRetirer) {
      const c = cat(b.dataset.rcRetirer);
      const n = S.elements.filter(el => el.cat === c.id).length;
      const ok = await demander('Retirer « ' + c.nom + ' » ?', n ? `${n} élément${n > 1 ? 's passeront' : ' passera'} dans « ${S.categories.find(x => x.id !== c.id).nom} ».` : 'Aucun élément ne l\'utilise.',
        [{ texte: 'Retirer', valeur: true }, { texte: 'Annuler', valeur: false, clair: true }]);
      if (!ok) return;
      S.categories = S.categories.filter(x => x.id !== c.id);
      S.elements.forEach(el => { if (el.cat === c.id) el.cat = S.categories[0].id; });
      sauver(); renderReglages();
      return;
    }
    const a = b.dataset.r;
    if (a === 'fermer') { RG.close(); return; }
    if (a === 'ajouter-cat') {
      const libre = PALETTE.find(p => !S.categories.some(c => c.couleur === p.c)) || PALETTE[7];
      S.categories.push({ id: uid(), nom: 'Nouvelle', couleur: libre.c });
      sauver(); renderReglages();
      const champs = RG.querySelectorAll('[data-rc-nom]');
      const dernier = champs[champs.length - 1];
      if (dernier) { dernier.focus(); dernier.select(); }
      return;
    }
    if (a === 'exporter') { await exporter(); renderReglages(); return; }
    if (a === 'importer') $('#fichier-import').click();
  });

  // ---------- Sauvegarde dans un fichier ----------
  const contenuSauvegarde = () => JSON.stringify({ app: 'guts', version: VERSION, exporteLe: new Date().toISOString(), donnees: S });
  async function exporter() {
    const nom = `guts-${aujourdhui()}.json`;
    const blob = new Blob([contenuSauvegarde()], { type: 'application/json' });
    const tactile = window.matchMedia('(pointer: coarse)').matches;
    let fait = false;
    if (tactile && navigator.canShare) {
      const f = new File([blob], nom, { type: 'application/json' });
      if (navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f] }); fait = true; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
    }
    if (!fait) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
