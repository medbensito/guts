    sauver();
    dire('Sauvegarde créée : ' + nom);
  }
  $('#fichier-import').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';

    let x;
    try { x = JSON.parse(await f.text()); } catch (err) { dire("Ce fichier n'est pas une sauvegarde Guts."); return; }
    const d = x && x.app === 'guts' ? x.donnees : x;
    if (d && d.taches && typeof d.taches === 'object' && !Array.isArray(d.elements)) { await importerV14(d); return; }
    if (!d || !Array.isArray(d.elements)) { dire("Ce fichier n'est pas une sauvegarde du calendrier Guts."); return; }
    const ok = await demander('Restaurer cette sauvegarde ?', 'Elle remplacera tout ce qui est sur cet appareil.', [{ texte: 'Restaurer', valeur: true }, { texte: 'Annuler', valeur: false, clair: true }]);
    if (!ok) return;
    S = Object.assign(vide(), d);
    if (!S.depuis) S.depuis = aujourdhui();
    sauver();
    U.vue = S.vue || 'jour';
    renderReglages();
    render();
    dire('Sauvegarde restaurée.');
  });

  // ---------- Gestes sur la grille ----------
  // Souris : glisser sur un vide dessine une plage ; glisser une plage la déplace ; son bord bas la redimensionne.
  // Tactile : appui long sur un vide puis glisser dessine ; appui long sur une plage la soulève ; les poignées la redimensionnent.
  // Un toucher simple sur un vide pose une « Nouvelle » plage d'une heure, ajustable, à toucher pour la remplir.
  let G = null;
  const actif = () => G && ['creer', 'deplacer', 'redim'].includes(G.mode);
  function sous(e) {
    const r = G.cols.getBoundingClientRect();
    const n = G.cols.children.length;
    const i = borne(Math.floor((e.clientX - r.left) / (r.width / n)), 0, n - 1);
    return { min: (e.clientY - r.top) / H * 60, k: G.cols.children[i].dataset.jour, col: G.cols.children[i] };
  }
  function cible(blocEl) {
    if (blocEl.dataset.brouillon) return Object.assign({ brouillon: true }, U.brouillon);
    const o = trouver(blocEl.dataset.cle);
    return o ? { o, k: o.k, debut: o.el.debut, fin: o.el.fin } : null;
  }
  function demarrer(mode) {
    G.mode = mode;
    clearTimeout(G.minuteur);
    try { G.cols.setPointerCapture(G.id); } catch (e) { /* déjà capturé */ }
    if (navigator.vibrate && G.tactile) { try { navigator.vibrate(8); } catch (e) { /* facultatif */ } }
    if (mode === 'creer') {
      const p = sous(G.depart);
      G.k = p.k;
      G.m0 = borne(Math.floor(p.min / CONFIG.pas) * CONFIG.pas, 0, 1440 - CONFIG.pas);
      G.vue = document.createElement('div');
      G.vue.className = 'bloc brouillon leve';
      G.vue.style.cssText = 'left:2px;width:calc(100% - 4px)';
      G.vue.innerHTML = '<span class="b-texte"><b>Nouvelle</b><small></small></span>';
      p.col.appendChild(G.vue);
      G.min0 = p.min;
      G.debut = G.m0; G.fin = Math.min(G.m0 + CONFIG.duree, 1440);
      majVue();
      return;
    }
    G.t = cible(G.blocEl);
    if (!G.t) { G.mode = 'libre'; return; }
    G.debut = G.t.debut; G.fin = G.t.fin; G.k = G.t.k;
    G.min0 = sous(G.depart).min;
    G.vue = G.blocEl;
    G.vue.classList.add('leve');
    if (mode === 'deplacer') { G.vue.style.left = '2px'; G.vue.style.width = 'calc(100% - 4px)'; }
  }
  function majVue() {
    const v = G.vue;
    v.style.top = G.debut / 60 * H + 'px';
    const h = Math.max((G.fin - G.debut) / 60 * H, 20);
    v.style.height = h + 'px';
    v.classList.toggle('court', h < 38);
    const s = v.querySelector('.b-texte small');
    if (s) s.textContent = `${hhmm(G.debut)} – ${hhmm(G.fin)}`;
  }
  function suivre(e, sansBord) {
    const p = sous(e);
    if (G.mode === 'creer') {
      // Tant qu'on n'a pas bougé d'un quart d'heure, la plage garde la durée par défaut
      if (!G.bouge && Math.abs(p.min - G.min0) < CONFIG.pas) { G.debut = G.m0; G.fin = Math.min(G.m0 + CONFIG.duree, 1440); }
      else {
        G.bouge = true;
        const m = borne(caler(p.min), 0, 1440);
        if (m >= G.m0 + CONFIG.pas) { G.debut = G.m0; G.fin = m; }
        else if (m <= G.m0) { G.debut = m; G.fin = G.m0 + CONFIG.pas; }
        else { G.debut = G.m0; G.fin = G.m0 + CONFIG.pas; }
      }
    } else if (G.mode === 'deplacer') {
      const duree = G.t.fin - G.t.debut;
      G.debut = borne(caler(G.t.debut + p.min - G.min0), 0, 1440 - duree);
      G.fin = G.debut + duree;
      if (p.k !== G.k) { G.k = p.k; p.col.appendChild(G.vue); }
    } else if (G.mode === 'redim') {
      const m = borne(caler(p.min), 0, 1440);
      if (G.bord === 'haut') G.debut = Math.min(m, G.t.fin - CONFIG.pas);
      else G.fin = Math.max(m, G.t.debut + CONFIG.pas);

    if (!sansBord) defilerBord(e);
  }
  // Défilement automatique quand on tire près du haut ou du bas
  let rafBord = null;
  function defilerBord(e) {
    const d = G.cols.closest('.defile');
    const r = d.getBoundingClientRect();
    const vitesse = e.clientY < r.top + 40 ? -8 : e.clientY > r.bottom - 40 ? 8 : 0;
    G.dernier = e;
    if (!vitesse) { cancelAnimationFrame(rafBord); rafBord = null; return; }
    if (rafBord) return;
    const pas = () => {
      if (!actif()) { rafBord = null; return; }
      const r2 = d.getBoundingClientRect();
      const v = G.dernier.clientY < r2.top + 40 ? -8 : G.dernier.clientY > r2.bottom - 40 ? 8 : 0;
      if (!v) { rafBord = null; return; }
      d.scrollTop += v;
      suivre(G.dernier, true);
      rafBord = requestAnimationFrame(pas);
    };
    rafBord = requestAnimationFrame(pas);
  }

  async function terminer() {
    const g = G;
    G = null;
    cancelAnimationFrame(rafBord); rafBord = null;
    U.avaler = Date.now();
    if (g.mode === 'creer') {
      g.vue.remove();
      U.brouillon = { k: g.k, debut: g.debut, fin: g.fin };
      U.selection = null;
      ouvrirEditeur(null, { date: g.k, debut: g.debut, fin: g.fin });
      render();
      return;
    }
    const t = g.t;
    const change = g.debut !== t.debut || g.fin !== t.fin || g.k !== t.k;
    if (t.brouillon) {
      U.brouillon = { k: g.k, debut: g.debut, fin: g.fin };
      render();
      return;
    }
    if (!change) {
      if (g.tactile) U.selection = t.o.cle;      // appui long sans bouger : la plage reste choisie, poignées visibles
      render();
      return;
    }
    let portee = 'une';
    if (t.o.el.rep) { portee = await demanderPortee('Déplacer'); if (!portee) { render(); return; } }
    const cle = appliquer(t.o, { date: g.k, debut: g.debut, fin: g.fin }, portee);
    sauver();
    U.selection = g.tactile ? cle : null;
    render();
    if (!avertir(cle)) dire(`${t.o.el.titre} : ${hhmm(g.debut)} – ${hhmm(g.fin)}`);
  }

  const VUE = $('#vue');
  VUE.addEventListener('pointerdown', e => {
    if (G || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('.case')) return;
    const tactile = e.pointerType !== 'mouse';
    const cols = e.target.closest('.colonnes');
    if (!cols) {   // ailleurs dans la feuille : seul le balayage horizontal compte
      G = { id: e.pointerId, depart: e, x0: e.clientX, y0: e.clientY, mode: 'attente', libreSeul: true, tactile };
      return;
    }
    const poignee = e.target.closest('[data-bord]');
    const blocEl = e.target.closest('.bloc');
    G = { id: e.pointerId, cols, depart: e, x0: e.clientX, y0: e.clientY, tactile, blocEl, mode: 'attente' };
    // Plage déjà choisie (ou nouvelle plage) : on peut la tirer tout de suite, sans appui long
    G.direct = !!(blocEl && (blocEl.classList.contains('choisi') || blocEl.dataset.brouillon));
    if (poignee && blocEl && (poignee.classList.contains('poignee') || !tactile)) {
      G.bord = poignee.dataset.bord;
      demarrer('redim');
      e.preventDefault();
      return;
    }
    if (tactile && !G.direct) G.minuteur = setTimeout(() => { if (G && G.mode === 'attente') demarrer(blocEl ? 'deplacer' : 'creer'); }, CONFIG.appuiLong);
  });
  window.addEventListener('pointermove', e => {
    if (!G || e.pointerId !== G.id) return;
    const dist = Math.hypot(e.clientX - G.x0, e.clientY - G.y0);
    if (G.mode === 'attente') {
      if (G.direct && dist > 5) demarrer('deplacer');
      else if (G.libreSeul || G.tactile) { if (dist > 10) { clearTimeout(G.minuteur); G.mode = 'libre'; } return; }
      else if (dist > 5) demarrer(G.blocEl ? 'deplacer' : 'creer');

    }

  });
  window.addEventListener('pointerup', e => {
    if (!G || e.pointerId !== G.id) return;

    // Balayage horizontal : jour, semaine ou mois voisin
    const dx = e.clientX - G.x0, dy = e.clientY - G.y0;
    const g = G; G = null;
    if (g.tactile && g.mode === 'libre' && Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy) && U.vue !== 'liste') {

  window.addEventListener('pointercancel', e => {

  // ---------- Clics ----------
  document.addEventListener('click', e => {

    const b = e.target.closest('button, .colonne');
    if (!b) return;
    const d = b.dataset;
    if (d.vue) return changerVue(d.vue);
    if (d.nav) return naviguer(+d.nav);
    if (d.saut) { U.date = decaler(U.date, +d.saut); U.selection = null; U.brouillon = null; return render(); }
    if (d.aller) return allerA(d.aller);
    if (d.choisir) { U.date = d.choisir; return render(); }
    if (d.ouvrirJour) return allerA(d.ouvrirJour, 'jour');
    if (d.cocher) return cocher(d.cocher);
    if (d.ouvrir) {
      const o = trouver(d.ouvrir);
      if (!o) return;
      if (U.selection && U.selection !== o.cle) { U.selection = null; }
      U.brouillon = null;
      return ouvrirEditeur(o);
    }
    if (d.action === 'remplir' && U.brouillon) return ouvrirEditeur(null, { date: U.brouillon.k, debut: U.brouillon.debut, fin: U.brouillon.fin });
    if (d.action === 'ajouter') {
      const auj = aujourdhui();
      const k = U.vue === 'liste' ? auj : U.date;
      const debut = k === auj ? Math.min(Math.ceil((minNow() + 1) / 60) * 60, 23 * 60) : 9 * 60;

  // ---------- Panneau Guts ----------
  const GD = $('#guts');
  function ouvrirGuts() {
    const st = stade(), sv = suivant(), hum = humeur(), auj = aujourdhui();
    const pct = sv ? Math.round((S.points - st.seuil) / (sv.seuil - st.seuil) * 100) : 100;
    const occs = duJour(auj);
    const t = occs.filter(o => o.el.type === 'tache');
    const l = occs.filter(o => o.el.type === 'libre');
    const g = S.gains[auj] || {};
    const ptsJour = (g.taches || 0) + (g.libre || 0);
    $('#g-corps').innerHTML = `
      <div class="carte-guts">
        <div class="badges"><span class="badge">${st.nom}</span><span class="badge">${S.points} pts</span></div>
        <div class="grand-renard">${renard(st.id, hum)}</div>
        <p class="phrase">${esc(phraseGuts(hum))}</p>
        <div class="barre" role="progressbar" aria-label="${sv ? 'Progression vers ' + sv.nom : 'Guts est adulte'}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>

  // ---------- Bilan du matin ----------
  const BD = $('#bilan');
  function bilanDe(k) {
    const occs = duJour(k);
    const t = occs.filter(o => o.el.type === 'tache');
    const l = occs.filter(o => o.el.type === 'libre');
    const g = S.gains[k] || {};
    return { taches: t.length, faites: t.filter(o => o.fait).length, libres: l.length,
      gardes: l.filter(o => S.payes[o.cle] && S.payes[o.cle].pts > 0).length, points: (g.taches || 0) + (g.libre || 0) };
  }
  function phraseBilan(b) {
    const p = [];
    if (b.taches && b.faites === b.taches) p.push(b.taches > 1 ? 'Toutes tes tâches étaient faites.' : 'Ta tâche était faite.');
    else if (b.faites) p.push(`${b.faites} sur ${b.taches} : c'est déjà bien. Le reste peut attendre, ou partir.`);
    else if (b.taches) p.push("Rien de coché hier. Aujourd'hui est une nouvelle page.");
    if (b.gardes) p.push(b.gardes > 1 ? 'Et tu as gardé du temps pour toi, deux fois.' : 'Et tu as gardé du temps pour toi.');
    else if (b.libres) p.push("Ton temps pour toi a été grignoté. On le protège mieux aujourd'hui ?");

  // ---------- Rappel de sauvegarde ----------
  // Tous les 7 jours sans sauvegarde (à partir du 3e jour d'utilisation) ; « plus tard » le cache 3 jours.
  function rappel() {
    if (!S.elements.length || U.vue === undefined) return '';
    const auj = aujourdhui();
    const der = S.derniereExport ? dk(new Date(S.derniereExport)) : null;
    if (der ? ecart(der, auj) < 7 : ecart(S.depuis || auj, auj) < 3) return '';
    if (S.rappelVu && ecart(S.rappelVu, auj) < 3) return '';
    const n = der ? ecart(der, auj) : 0;
    return `<div class="rappel" role="region" aria-label="Rappel de sauvegarde"><span>${der ? `Dernière sauvegarde il y a ${n} jours.` : 'Tes données ne sont que sur ce téléphone.'} Pense à en garder une copie.</span>
      <button type="button" class="bouton clair" data-action="sauvegarder" data-focus="sauvegarder">Sauvegarder</button>
      <button type="button" class="fermer" data-action="plus-tard" aria-label="Plus tard" data-focus="plus-tard">×</button></div>`;
  }

  // ---------- Reprise de l'ancienne version (rituel du soir, v8 à v14) ----------
  async function importerV14(d) {
    if (S.importV14) { dire("L'ancienne version a déjà été reprise."); return; }
    const auj = aujourdhui();
    const taches = [];
    Object.keys(d.taches).filter(k => /^\d{4}-\d\d-\d\d$/.test(k) && k >= auj).sort()
      .forEach(k => (Array.isArray(d.taches[k]) ? d.taches[k] : []).forEach(t => { if (t && !t.fait && t.texte) taches.push({ k, t }); }));
    const pts = Math.max(0, Math.round(Number(d.points) || 0));
    const ok = await demander("Reprendre l'ancienne version ?",
      `${pts} points (Guts ${stadeDe(S.points + pts).nom.toLowerCase()}) et ${taches.length} tâche${taches.length > 1 ? 's' : ''} à venir, ajoutés à ton calendrier.`,
      [{ texte: 'Reprendre', valeur: true }, { texte: 'Annuler', valeur: false, clair: true }]);
    if (!ok) return;
    const c = (S.categories.find(x => x.id === 'perso') || S.categories[0]).id;
    taches.forEach(({ k, t }) => S.elements.push({ id: uid(), type: 'tache', titre: String(t.texte).slice(0, 120), cat: c, date: k, debut: null, fin: null, rep: null,
      exceptions: {}, faits: {}, creeLe: /^\d{4}-\d\d-\d\d$/.test(t.creeLe || '') ? parse(t.creeLe).getTime() : parse(k).getTime() - 864e5 }));
    S.points += pts;
    S.importV14 = true;
    sauver();
    renderReglages();
    render();
    dire(`Ancienne version reprise : ${pts} points, ${taches.length} tâche${taches.length > 1 ? 's' : ''}.`);
  }

  // ---------- Le temps passe ----------
  let dernierJour = aujourdhui(), derniereMinute = minNow();
  function rafraichir() {
    const auj = aujourdhui();
    const libre = !G && !document.querySelector('dialog[open]');
    if (auj !== dernierJour) {
      if (U.date === dernierJour) U.date = auj;
      dernierJour = auj;
      crediter();
      if (libre) { render(); montrerBilan(); }
      return;
    }
    const m = minNow();
    if (m === derniereMinute) return;
    derniereMinute = m;
    // Points dus (tâche cochée en avance, temps pour moi terminé) et humeur de Guts
    const paye = crediter();
    const hum = humeur();
    if (libre && (paye || hum !== U.humeur)) { U.humeur = hum; render(); grandir(); return; }
    if (libre) montrerBilan();                 // première minute après finNuit, ou retour sur l'app
    const l = $('#vue .maintenant');
    if (l) { l.style.top = m / 60 * H + 'px'; const s = l.querySelector('span'); if (s) s.textContent = hhmm(m); }
  }
  setInterval(rafraichir, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rafraichir(); });

  // Hors ligne : service worker, seulement quand la page est servie par un site (pas en fichier local)
  if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sans mode hors ligne, l'app marche quand même */ });
  }

  if (!S.depuis) { S.depuis = aujourdhui(); sauver(); }
  crediter();
  U.reaction = false; U.grandi = null;
  U.humeur = humeur();
  render();
  montrerBilan();
  if (erreurStockage) dire("Attention : les données n'ont pas pu être enregistrées sur cet appareil.");
})();
</script>
</body>
</html>
