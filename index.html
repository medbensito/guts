    if (document.querySelector('dialog[open]')) return;

    const t = e.target;
    if (t.closest && (t.closest('input, select, textarea, [role="tablist"]'))) return;
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && U.vue !== 'liste' && !e.altKey && !e.metaKey && !e.ctrlKey) {

      naviguer(e.key === 'ArrowLeft' ? -1 : 1);

  // ---------- Feuille d'une tâche à caser ----------
  const CD = $('#caser'), FC = $('#form-caser');

  // ---------- Bilan du matin ----------
  const BD = $('#bilan');
  function bilanDe(k) {
    const occs = duJour(k);

    const l = occs.filter(o => o.el.type === 'libre');

  function phraseBilan(b) {
    const p = [];
    if (b.taches && b.faites === b.taches) p.push(b.taches > 1 ? 'Toutes tes tâches étaient faites.' : 'Ta tâche était faite.');

    if (b.gardes) p.push(b.gardes > 1 ? 'Et tu as gardé du temps pour toi, deux fois.' : 'Et tu as gardé du temps pour toi.');
    else if (b.libres) p.push("Ton temps pour toi a été grignoté. On le protège mieux aujourd'hui ?");
    return p.join(' ') || 'Une journée calme.';
  }
  function montrerBilan() {
    const auj = aujourdhui();

    if (indexJour(auj) === 0 && S.bilanSemaineVu !== auj) {

      return true;
    }
    const k = decaler(auj, -1), b = bilanDe(k);
    S.bilanVu = auj;
    sauver();
    if (!b.taches && !b.libres && !b.points) return false;    // rien à raconter
    const content = b.taches && b.faites === b.taches || b.gardes;
    $('#b-corps').innerHTML = `
      <p class="bilan-date">${esc(cap(fmt(k, { weekday: 'long', day: 'numeric', month: 'long' })))}</p>

  BD.addEventListener('click', e => { if (e.target.closest('[data-b="ok"]')) BD.close(); });

  // ---------- Pas faites : décider de chaque tâche non cochée des 7 derniers jours ----------
  function enAttente() {
    const auj = aujourdhui(), res = [];
    for (let i = 7; i >= 1; i--) duJour(decaler(auj, -i)).forEach(o => { if (o.el.type === 'tache' && !o.fait) res.push(o); });
    return res;
  }
  // À proposer ce matin ?
  const retardDu = () => S.retardVu !== aujourdhui() && new Date().getHours() >= CONFIG.heures.finNuit && enAttente().length > 0;
  function montrerRetard() {
    if (!retardDu() || document.querySelector('dialog[open]')) return false;
    S.retardVu = aujourdhui();
    sauver();
    ouvrirRetard();
    return true;
  }
  // Où la refaire : même heure aujourd'hui si elle est encore à venir, sinon le prochain créneau libre
  function cibleRefaire(o) {
    const auj = aujourdhui();
    if (o.el.debut == null) return { k: auj, debut: null };
    if (o.el.debut >= minNow() + 5) return { k: auj, debut: o.el.debut };
    const c = prochainCreneau(o.el.fin - o.el.debut);
    return c || { k: decaler(auj, 1), debut: o.el.debut };
  }
  const nomCourt = k => k === aujourdhui() ? "Aujourd'hui" : k === decaler(aujourdhui(), 1) ? 'Demain' : k === decaler(aujourdhui(), -1) ? 'Hier' : cap(fmt(k, { weekday: 'long', day: 'numeric' }));
  const RT = $('#retard');
  function ouvrirRetard(focus, msg) {
    $('#rt-msg').textContent = msg || '';
    const liste = enAttente();
    $('#rt-corps').innerHTML = liste.length ? `
      <p class="note">Ces tâches n'ont pas été cochées. Pour chacune : la refaire, la remettre à caser, ou la laisser partir, sans regret. Coche-la si tu l'avais faite. Ce que tu ne décides pas reste ici.</p>
      ${liste.map(o => {
        const c = cibleRefaire(o);
        const ou = `${nomCourt(c.k)}${c.debut != null ? ' ' + hhmm(c.debut) : ''}`;
        return `<div class="rt-ligne" style="${styleEl(o.el)}">
          <div class="rt-haut">
            <button type="button" class="case" role="checkbox" aria-checked="false" data-rt="faite" data-cle="${o.cle}" aria-label="${esc(o.el.titre)} : je l'ai faite">${ICONE.coche}</button>

          </div>

            <button type="button" class="bouton" data-rt="refaire" data-cle="${o.cle}" aria-label="Refaire « ${esc(o.el.titre)} » : ${esc(ou)}">${esc(ou)}</button>
            <button type="button" class="bouton clair" data-rt="caser" data-cle="${o.cle}" aria-label="Mettre « ${esc(o.el.titre)} » à caser">À caser</button>
            <button type="button" class="lien-discret" data-rt="lacher" data-cle="${o.cle}" aria-label="Laisser partir « ${esc(o.el.titre)} »">Laisser partir</button>
          </div>

      }).join('')}` : `
      <div class="rt-fini"><div class="grand-renard">${renard(stade().id, 'joyeuse')}</div><p>Tout est décidé. Place à aujourd'hui.</p></div>`;

    const cible = focus && RT.querySelector(focus) || (liste.length ? RT.querySelector('[data-rt="refaire"]') : RT.querySelector('[data-rt="fermer"]'));

  // Une décision, depuis la feuille : renvoie le message
  function decider(action, o) {

    if (action === 'faite') return basculer(o);
    if (action === 'refaire') {
      const c = cibleRefaire(o);
      const champs = o.el.debut == null ? { date: c.k } : { date: c.k, debut: c.debut, fin: Math.min(c.debut + o.el.fin - o.el.debut, 1440) };
      const cle = appliquer(o, champs, 'une');
      return `« ${t} » : ${quand(c.k, champs.debut != null ? champs.debut : 0, champs.fin != null ? champs.fin : 0).replace(/, 00:00 – 00:00$/, ', journée')}.` + (avertirTexte(cle) ? ' ' + avertirTexte(cle) : '');
    }
    if (action === 'caser') {
      ajouterACaser(t, { cat: o.el.cat, duree: o.el.debut == null ? CONFIG.duree : o.el.fin - o.el.debut });
      supprimerOcc(o, 'une');
      return `« ${t} » remise à caser.`;
    }
    if (action === 'lacher') {
      supprimerOcc(o, 'une');
      S.lachees.unshift({ titre: t, date: o.k, lacheeLe: aujourdhui() });

    return '';
  }
  // Texte d'avertissement si la tâche replacée empiète sur un temps pour moi
  function avertirTexte(cle) {

    const l = duJour(o.k).find(x => x.el.type === 'libre' && x.el.debut < o.el.fin && x.el.fin > o.el.debut && !S.payes[x.cle]);

  // ---------- Bilan de la semaine ----------
  // Semaine du lundi L. Les tâches comptent jusqu'à aujourd'hui ; les temps pour moi, une fois terminés ;
  // les heures prévues, sur toute la semaine (tâches et événements avec un horaire, et temps pour moi à part).
  function bilanSemaine(L) {
    const auj = aujourdhui(), now = Date.now();
    const b = { L, enCours: L === lundiDe(auj), taches: 0, faites: 0, libres: 0, gardes: 0, minGardees: 0, points: 0, parCat: {}, minLibres: 0, jours: [] };
    for (let i = 0; i < 7; i++) {
      const k = decaler(L, i), occs = duJour(k), passe = k <= auj;
      const t = occs.filter(o => o.el.type === 'tache');
      if (passe) { b.taches += t.length; b.faites += t.filter(o => o.fait).length; }
      occs.filter(o => o.el.type === 'libre').forEach(o => {
        b.minLibres += o.el.fin - o.el.debut;
        if (finOcc(o) > now) return;
        b.libres++;
        const p = S.payes[o.cle];
        if (p && p.pts > 0) { b.gardes++; b.minGardees += o.el.fin - o.el.debut; }
      });
      occs.filter(o => o.el.type !== 'libre' && o.el.debut != null).forEach(o => { b.parCat[o.el.cat] = (b.parCat[o.el.cat] || 0) + o.el.fin - o.el.debut; });
      const g = S.gains[k] || {};
      b.points += (g.taches || 0) + (g.libre || 0);
      b.jours.push({ k, minutes: minutesPrevues(k), taches: t.length, faites: t.filter(o => o.fait).length, avenir: !passe });
    }
    return b;
  }
  const semaineVide = b => !b.taches && !b.libres && !b.points && !b.minLibres && !Object.keys(b.parCat).length;
  const pointsSemaine = L => Array.from({ length: 7 }, (_, i) => S.gains[decaler(L, i)] || {}).reduce((a, g) => a + (g.taches || 0) + (g.libre || 0), 0);
  function phraseSemaine(b) {
    if (semaineVide(b)) return 'Une semaine sans rien de prévu. Ça arrive, et c\'est bien aussi.';
    const p = [];
    if (b.taches) {
      const t = b.faites / b.taches;
      if (b.faites === b.taches) p.push(`Tu as tenu tout ce que tu avais prévu : ${b.taches} tâche${b.taches > 1 ? 's' : ''}.`);
      else if (t >= .8) p.push(`Tu as tenu presque tout : ${b.faites} tâches sur ${b.taches}.`);
      else if (t >= .5) p.push(`Tu as tenu l'essentiel : ${b.faites} tâche${b.faites > 1 ? 's' : ''} sur ${b.taches}.`);
      else p.push(`${b.faites} tâche${b.faites > 1 ? 's' : ''} sur ${b.taches} : la semaine était peut-être trop pleine.`);
    }
    if (b.gardes) p.push(`Et tu as gardé ${duree(b.minGardees)} pour toi.`);
    else if (b.libres) p.push('Ton temps pour toi a été grignoté : protège-le mieux la semaine prochaine.');
    else if (!b.enCours) p.push('Pas de temps pour toi cette semaine : réserves-en un pour la prochaine ?');
    return p.join(' ');
  }
  const SM = $('#semaine');
  function ouvrirSemaine(L) {
    U.semaine = L;
    const b = bilanSemaine(L), auj = aujourdhui();
    const avant = pointsSemaine(decaler(L, -7));
    const charges = b.jours.filter(j => j.minutes > CONFIG.surcharge);
    const pire = b.jours.reduce((a, j) => (j.minutes > a.minutes ? j : a), b.jours[0]);
    const hum = charges.length >= 2 ? 'fatiguee' : (b.taches && b.faites / b.taches >= .8) || b.gardes ? 'joyeuse' : 'curieuse';
    const fin = decaler(L, 6);
    const jourMois = (k, mois) => { const d = parse(k).getDate(); return (d === 1 ? '1er' : String(d)) + (mois ? ' ' + fmt(k, { month: 'long' }) : ''); };
    const periode = `Du ${jourMois(L, parse(L).getMonth() !== parse(fin).getMonth())} au ${jourMois(fin, true)}`;
    // Heures par catégorie, la plus grosse en haut ; « Pour moi » à part
    const lignes = Object.entries(b.parCat).map(([c, m]) => ({ nom: cat(c).nom, c: cat(c).couleur, m }));
    if (b.minLibres) lignes.push({ nom: 'Pour moi', c: LIBRE.c, m: b.minLibres });
    lignes.sort((x, y) => y.m - x.m || x.nom.localeCompare(y.nom, 'fr'));
    const maxH = Math.max(1, ...lignes.map(l => l.m));
    const totalH = Object.values(b.parCat).reduce((a, m) => a + m, 0);
    // Colonnes jour par jour
    const maxJ = Math.max(4 * 60, ...b.jours.map(j => j.minutes));
    const hauteur = m => Math.round(m / maxJ * 100);
    const HAUT_COL = 112;   // px pour la plus haute barre : 150 de cadre − 16 de marge − 17 pour l'étiquette au-dessus − un peu d'air
    const seuilVisible = maxJ >= CONFIG.surcharge * .8;
    const ecart = b.points - avant;
    const faits = [];
    if (pire.minutes) faits.push(`Journée la plus chargée : ${fmt(pire.k, { weekday: 'long', day: 'numeric' })}, ${duree(pire.minutes)}.`);

    const lachees = S.lachees.filter(x => x.date >= L && x.date <= fin).length;
    if (lachees) faits.push(`${lachees} tâche${lachees > 1 ? 's' : ''} laissée${lachees > 1 ? 's' : ''} partir sans regret.`);
    if (b.libres) faits.push(`Temps pour moi : ${b.gardes} gardé${b.gardes > 1 ? 's' : ''}${b.libres - b.gardes ? `, ${b.libres - b.gardes} grignoté${b.libres - b.gardes > 1 ? 's' : ''} ou sans points` : ''}.`);
    $('#sm-corps').innerHTML = `
      <div class="sm-nav">
        <button type="button" class="sm-fleche" data-sm="prec" aria-label="Semaine précédente">${ICONE.gauche}</button>
        <p><b>${esc(periode)}</b><small>${b.enCours ? 'Semaine en cours' : L === decaler(lundiDe(auj), -7) ? 'Semaine dernière' : 'Semaine ' + numeroSemaine(L)}</small></p>

      <div class="carte-guts basse">

      </div>
      <div class="stats semaine-stats">
        <div class="stat"><b>${b.faites}/${b.taches}</b><span>tâches tenues</span>${b.enCours ? '<span class="ecart">jusqu\'à aujourd\'hui</span>' : ''}</div>
        <div class="stat"><b>${b.gardes}/${b.libres}</b><span>temps pour moi</span><span class="ecart">${b.minGardees ? duree(b.minGardees) + ' gardées' : 'gardés'}</span></div>
        <div class="stat"><b>+${b.points}</b><span>points</span><span class="ecart">${ecart === 0 ? 'comme la semaine d\'avant' : `${ecart > 0 ? '▲ +' : '▼ −'}${Math.abs(ecart)} vs semaine d'avant`}</span></div>
      </div>
      ${lignes.length ? `<section class="graphe" aria-labelledby="sm-h1">
        <h3 id="sm-h1">Heures prévues <span>${duree(totalH)}${b.minLibres ? ' + ' + duree(b.minLibres) + ' pour toi' : ''}</span></h3>
        ${lignes.map(l => `<div class="h-ligne" title="${esc(l.nom)} : ${duree(l.m)}">
          <span class="h-nom">${esc(l.nom)}</span>
          <span class="h-piste" aria-hidden="true"><i style="--c:${l.c};width:${Math.max(2, l.m / maxH * 100)}%"></i></span>
          <span class="h-val">${duree(l.m)}</span></div>`).join('')}
        <p class="legende">Tâches et rendez-vous avec un horaire, par catégorie.</p>
      </section>` : ''}
      <section class="graphe" aria-labelledby="sm-h2">
        <h3 id="sm-h2">Jour par jour</h3>
        <div class="jours-graphe" aria-hidden="true">
          ${seuilVisible ? `<div class="seuil" style="bottom:${hauteur(CONFIG.surcharge) / 100 * HAUT_COL}px"><span>${duree(CONFIG.surcharge)}</span></div>` : ''}
          ${b.jours.map(j => `<div class="cj${j.minutes > CONFIG.surcharge ? ' charge' : ''}${j.avenir ? ' avenir' : ''}" title="${esc(cap(fmt(j.k, { weekday: 'long', day: 'numeric' })))} : ${duree(j.minutes)} prévues, ${j.faites}/${j.taches} tâches">
            ${j.minutes ? `<span class="cj-val">${duree(j.minutes).replace(' 00', '')}</span>` : ''}<span class="cj-barre" style="height:${hauteur(j.minutes) / 100 * HAUT_COL}px"></span></div>`).join('')}
        </div>
        <div class="jours-bas" aria-hidden="true">${b.jours.map((j, i) => `<div><b${j.k === auj ? ' class="auj"' : ''}>${INITIALES[i]}</b><small>${j.taches ? j.faites + '/' + j.taches : '–'}</small></div>`).join('')}</div>
        <p class="legende">Hauteur : heures prévues. Sous chaque jour : tâches faites / prévues.${charges.length ? ` ▲ : plus de ${duree(CONFIG.surcharge)}.` : ''}${b.enCours ? ' Plus clair : à venir.' : ''}</p>
        <table class="masque"><caption>Jour par jour</caption><thead><tr><th scope="col">Jour</th><th scope="col">Heures prévues</th><th scope="col">Tâches faites</th></tr></thead>
          <tbody>${b.jours.map(j => `<tr><th scope="row">${esc(cap(fmt(j.k, { weekday: 'long', day: 'numeric' })))}</th><td>${duree(j.minutes)}</td><td>${j.faites} sur ${j.taches}</td></tr>`).join('')}</tbody></table>
      </section>
      ${faits.length ? `<ul class="faits-semaine">${faits.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}`;
    if (!SM.open) SM.showModal();

  // Numéro de semaine ISO
  function numeroSemaine(k) {
    const [y, m, j] = k.split('-').map(Number);

    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));          // jeudi de la même semaine

  }

  // ---------- Rappel de sauvegarde ----------
  // Tous les 7 jours sans sauvegarde (à partir du 3e jour d'utilisation) ; « plus tard » le cache 3 jours.
  function rappel() {
    if (!S.elements.length || U.vue === undefined) return '';
    const auj = aujourdhui();
    const der = S.derniereExport ? dk(new Date(S.derniereExport)) : null;
    if (der ? ecart(der, auj) < 7 : ecart(S.depuis || auj, auj) < 3) return '';
    if (S.rappelVu && ecart(S.rappelVu, auj) < 3) return '';
    const n = der ? ecart(der, auj) : 0;
    return `<div class="rappel" role="region" aria-label="Rappel de sauvegarde"><span>${der ? `Dernière sauvegarde il y a ${n} jours.` : 'Tes données ne sont que sur ce téléphone.'} Pense à en garder une copie.</span>
      <button type="button" class="bouton clair" data-action="sauvegarder" data-focus="sauvegarder">Sauvegarder</button>

  }

  // ---------- Reprise de l'ancienne version (rituel du soir, v8 à v14) ----------
  async function importerV14(d) {
    if (S.importV14) { dire("L'ancienne version a déjà été reprise."); return; }
    const auj = aujourdhui();
    const taches = [];
    Object.keys(d.taches).filter(k => /^\d{4}-\d\d-\d\d$/.test(k) && k >= auj).sort()
      .forEach(k => (Array.isArray(d.taches[k]) ? d.taches[k] : []).forEach(t => { if (t && !t.fait && t.texte) taches.push({ k, t }); }));
    const pts = Math.max(0, Math.round(Number(d.points) || 0));
    const ok = await demander("Reprendre l'ancienne version ?",
      `${pts} points (Guts ${stadeDe(S.points + pts).nom.toLowerCase()}) et ${taches.length} tâche${taches.length > 1 ? 's' : ''} à venir, ajoutés à ton calendrier.`,
      [{ texte: 'Reprendre', valeur: true }, { texte: 'Annuler', valeur: false, clair: true }]);
    if (!ok) return;
    const c = (S.categories.find(x => x.id === 'perso') || S.categories[0]).id;
    taches.forEach(({ k, t }) => S.elements.push({ id: uid(), type: 'tache', titre: String(t.texte).slice(0, 120), cat: c, date: k, debut: null, fin: null, rep: null,
      exceptions: {}, faits: {}, creeLe: /^\d{4}-\d\d-\d\d$/.test(t.creeLe || '') ? parse(t.creeLe).getTime() : parse(k).getTime() - 864e5 }));
    S.points += pts;
    S.importV14 = true;
    sauver();
    renderReglages();
    render();
    dire(`Ancienne version reprise : ${pts} points, ${taches.length} tâche${taches.length > 1 ? 's' : ''}.`);
  }

  // ---------- Rappels (notifications) ----------
  // L'app calcule ses rappels des 14 prochains jours et les confie au service de rappels (rappels/ : un Worker Cloudflare),
  // qui les envoie à l'heure par Web Push. L'adresse du service est publiée par le déploiement dans rappels.json.
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const installee = () => navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const pushPossible = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const versOctets = c => { const b = atob(c.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((c.length + 3) % 4)); return Uint8Array.from(b, x => x.charCodeAt(0)); };
  async function serviceRappels() {
    if (RAP.service !== undefined) return RAP.service;
    try {
      const r = await fetch('rappels.json', { cache: 'no-store' });
      const d = r.ok ? await r.json() : null;
      RAP.service = d && /^https?:\/\//.test(d.url || '') ? d.url.replace(/\/+$/, '') : null;
    } catch (e) { RAP.service = S.rappels.service || null; }   // hors ligne : la dernière adresse connue
    if (RAP.service && RAP.service !== S.rappels.service) { S.rappels.service = RAP.service; ecrire(); }
    return RAP.service;
  }
  async function cleVapid() {
    if (RAP.cle) return RAP.cle;
    const url = await serviceRappels();
    if (!url) return null;
    try { RAP.cle = (await (await fetch(url + '/cle')).json()).cle; } catch (e) { return null; }
    return RAP.cle;
  }
  // Réglages ouverts : on cherche le service et sa clé d'avance, pour que « Activer » enchaîne sans attente
  async function preparerRappels() {
    if (!pushPossible()) return;
    await serviceRappels();
    await cleVapid();
    majRappelsUI();
  }
  const enTete = () => ({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.rappels.jeton });

  async function activerRappels() {
    let perm;
    try { perm = await Notification.requestPermission(); } catch (e) { perm = 'denied'; }
    if (perm !== 'granted') { S.rappels.erreur = 'refuse'; ecrire(); majRappelsUI(); return; }
    try {
      const cle = RAP.cle || await cleVapid();
      if (!cle) throw new Error('service');
      const reg = await navigator.serviceWorker.ready;
      const abo = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: versOctets(cle) });
      const r = await fetch(RAP.service + '/abonner', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ abonnement: abo.toJSON() }) });
      if (!r.ok) throw new Error('abonner');
      Object.assign(S.rappels, { jeton: (await r.json()).jeton, actif: true, erreur: null, signature: null });
      ecrire();
      await synchroniser(true);
      majRappelsUI('Rappels activés. Essaie « Envoyer un essai ».', '[data-rap="essai"]');
    } catch (e) {
      S.rappels.erreur = 'reseau'; ecrire(); majRappelsUI();
    }
  }
  // L'abonnement du téléphone, recréé s'il a disparu (iOS en perd parfois).
  // neuf : le service push l'a refusé (410) : on le jette et on en demande un autre.
  async function abonnementActuel(neuf) {
    try {
      const reg = await navigator.serviceWorker.ready;
      let abo = await reg.pushManager.getSubscription();
      if (abo && neuf) { try { await abo.unsubscribe(); } catch (e) { /* déjà mort */ } abo = null; }
      if (!abo && Notification.permission === 'granted') {
        const cle = await cleVapid();
        if (cle) abo = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: versOctets(cle) });
      }
      return abo ? abo.toJSON() : null;
    } catch (e) { return null; }
  }
  async function reinscrire() {
    const abo = await abonnementActuel();
    if (!abo) { S.rappels.erreur = 'perdu'; ecrire(); return false; }
    const r = await fetch(RAP.service + '/abonner', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ abonnement: abo }) });
    if (!r.ok) return false;
    S.rappels.jeton = (await r.json()).jeton;
    ecrire();
    return true;
  }

  // Ce que Guts dira, et quand
  const tachesPasFaitesAvant = k => {
    let n = 0;
    for (let i = 1; i <= 7; i++) n += duJour(decaler(k, -i)).filter(o => o.el.type === 'tache' && !o.fait).length;
    return n;
  };
  function texteMatin(k) {
    const auj = aujourdhui(), occs = duJour(k);
    const t = occs.filter(o => o.el.type === 'tache' && !o.fait).length, ev = occs.filter(o => o.el.type === 'evenement').length;
    const parts = [];
    if (t) parts.push(`${t} tâche${t > 1 ? 's' : ''} aujourd'hui`);
    if (ev) parts.push(`${ev} rendez-vous`);
    if (k <= decaler(auj, 1)) { const p = tachesPasFaitesAvant(k); if (p) parts.push(`${p} pas faite${p > 1 ? 's' : ''} à décider`); }   // connu seulement pour aujourd'hui et demain
    if (indexJour(k) === 0) parts.push('le bilan de la semaine t\'attend');
    return parts.length ? cap(parts.join(' · ')) + '.' : '';
  }
  function calculerRappels() {
    const R = S.rappels, auj = aujourdhui(), debutJour = parse(auj).getTime(), res = [];
    for (let i = 0; i < CONFIG.rappels.horizon; i++) {
      const k = decaler(auj, i), occs = duJour(k);
      if (R.avant) occs.forEach(o => {
        if (o.el.type === 'libre' || o.el.debut == null || (o.el.type === 'tache' && o.fait)) return;
        const at = debutOcc(o) - R.delai * 6e4;
        if (at >= debutJour) res.push({ at, titre: o.el.titre, corps: `${R.delai >= 60 ? 'Dans 1 h' : 'Dans ' + R.delai + ' min'} · ${hhmm(o.el.debut)} – ${hhmm(o.el.fin)} · ${cat(o.el.cat).nom}`, tag: o.cle });
      });
      if (R.matin) {
        const at = parse(k).getTime() + R.heureMatin * 6e4, c = at >= debutJour && texteMatin(k);
        if (c) res.push({ at, titre: 'Bonjour !', corps: c, tag: 'matin-' + k });
      }
    }
    if (R.sauvegarde && S.elements.length) {
      const der = S.derniereExport ? dk(new Date(S.derniereExport)) : (S.depuis || auj);
      let k = decaler(der, 7);
      if (k <= auj) k = minNow() < CONFIG.rappels.heureSauvegarde ? auj : decaler(auj, 1);
      for (; k < decaler(auj, CONFIG.rappels.horizon); k = decaler(k, 7)) {
        res.push({ at: parse(k).getTime() + CONFIG.rappels.heureSauvegarde * 6e4, titre: 'Pense à sauvegarder Guts',
          corps: `${S.derniereExport ? `Ta dernière sauvegarde date de ${ecart(der, k)} jours.` : 'Tes données ne sont que sur ce téléphone.'} Réglages › Sauvegarder.`, tag: 'sauvegarde-' + k });
      }
    }
    return res.sort((a, b) => a.at - b.at || a.tag.localeCompare(b.tag));
  }
  const empreinte = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = (h * 33 + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + t.length; };

  function planifierSynchro() {
    if (!S.rappels || !S.rappels.actif) return;
    clearTimeout(RAP.minuteur);
    RAP.minuteur = setTimeout(() => synchroniser(), 2500);
  }
  // Envoie la liste au service si elle a changé (ou toutes les 12 h, pour que le service sache que l'app vit)
  async function synchroniser(forcer) {
    const R = S.rappels;
    if (!R.actif || !R.jeton || RAP.enCours) return;
    const url = await serviceRappels();
    if (!url) return;
    const liste = calculerRappels();
    const sig = empreinte(JSON.stringify(liste));
    if (!forcer && sig === R.signature && R.majLe && Date.now() - R.majLe < 12 * 3600e3) return;
    RAP.enCours = true;
    try {
      const corps = { rappels: liste };
      if (RAP.reabonner) corps.abonnement = RAP.reabonner;
      const r = await fetch(url + '/rappels', { method: 'PUT', headers: enTete(), body: JSON.stringify(corps) });
      if (r.status === 401) { RAP.enCours = false; if (await reinscrire()) return synchroniser(true); return; }
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (d.expire && !RAP.reabonner) {                   // le téléphone a perdu son abonnement : on en refait un
        RAP.reabonner = await abonnementActuel(true);
        RAP.enCours = false;
        if (RAP.reabonner) return synchroniser(true);
        R.erreur = 'perdu'; ecrire(); return;
      }
      RAP.reabonner = null;
      Object.assign(R, { signature: sig, majLe: Date.now(), erreur: null, nombre: liste.filter(x => x.at > Date.now()).length });
      ecrire();
    } catch (e) {
      R.erreur = 'reseau'; ecrire();
    } finally {
      RAP.enCours = false;
      majRappelsUI();
    }
  }
  async function essaiRappels() {
    majRappelsUI('Envoi de l\'essai…', '[data-rap="essai"]');
    try {
      await synchroniser(true);
      const d = await (await fetch(RAP.service + '/essai', { method: 'POST', headers: enTete() })).json();
      majRappelsUI(d.ok ? 'Essai envoyé : regarde ton téléphone.' : 'L\'essai n\'est pas passé. Coupe puis réactive les rappels.', '[data-rap="essai"]');
    } catch (e) { majRappelsUI('Le service de rappels ne répond pas.', '[data-rap="essai"]'); }
  }
  async function couperRappels() {
    const R = S.rappels;
    try { if (R.jeton && RAP.service) await fetch(RAP.service + '/abonner', { method: 'DELETE', headers: enTete() }); } catch (e) { /* le service oubliera ce client de lui-même */ }
    try { const abo = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (abo) await abo.unsubscribe(); } catch (e) { /* rien à défaire */ }
    Object.assign(R, { actif: false, jeton: null, signature: null, majLe: null, erreur: null });
    ecrire();
    majRappelsUI('Rappels coupés.', '[data-rap="activer"]');
  }

  function statutRappels() {
    const R = S.rappels;
    if (R.erreur === 'reseau') return 'Dernière mise à jour impossible : le service de rappels ne répond pas. Guts réessaiera.';
    if (R.erreur === 'perdu') return 'Le téléphone a perdu l\'autorisation. Coupe puis réactive les rappels.';
    if (!R.majLe) return 'Rappels actifs.';
    return `Rappels actifs · ${R.nombre || 0} à venir · mis à jour à ${new Date(R.majLe).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}.`;
  }
  function htmlRappels(msg) {
    const R = S.rappels;
    let h = '<legend>Rappels</legend>';
    if (!pushPossible() || (IOS && !installee())) {
      return h + `<p class="note">${IOS && !installee() ? "Pour recevoir des rappels, ouvre Guts depuis son icône sur l'écran d'accueil (dans Safari : Partager › Sur l'écran d'accueil)." : 'Ce navigateur ne peut pas recevoir de rappels.'}</p>`;
    }
    if (RAP.service === null) return h + '<p class="note">Le service de rappels n\'est pas encore en place.</p>';
    if (!R.actif) {
      const texte = R.erreur === 'refuse' ? 'Les notifications sont bloquées pour Guts. Autorise-les dans Réglages de l\'iPhone › Notifications › Guts, puis réessaie.'
        : R.erreur === 'reseau' ? 'Le service de rappels ne répond pas. Vérifie ta connexion et réessaie.'
        : 'Guts te prévient avant tes tâches et rendez-vous, le matin, et quand il est temps de sauvegarder.';
      return h + `<p class="note">${msg || texte}</p><div class="actions"><button type="button" class="bouton" data-rap="activer"${RAP.service === undefined ? ' disabled' : ''}>Activer les rappels</button></div>`;
    }
    const heures = []; for (let m = 6 * 60; m <= 10 * 60; m += 30) heures.push(m);
    return h + `<div class="groupe">
        <label class="rang"><span>Avant tâches et rendez-vous</span><span class="interrupteur"><input type="checkbox" role="switch" data-rap-opt="avant"${R.avant ? ' checked' : ''}><i></i></span></label>
        ${R.avant ? `<label class="rang"><span>Combien avant</span><select data-rap-opt="delai">${[5, 10, 15, 30, 60].map(m => `<option value="${m}"${m === R.delai ? ' selected' : ''}>${m === 60 ? '1 h' : m + ' min'}</option>`).join('')}</select></label>` : ''}
        <label class="rang"><span>Le matin</span><span class="interrupteur"><input type="checkbox" role="switch" data-rap-opt="matin"${R.matin ? ' checked' : ''}><i></i></span></label>
        ${R.matin ? `<label class="rang"><span>À quelle heure</span><select data-rap-opt="heureMatin">${heures.map(m => `<option value="${m}"${m === R.heureMatin ? ' selected' : ''}>${hhmm(m)}</option>`).join('')}</select></label>` : ''}
        <label class="rang"><span>Sauvegarde (chaque semaine)</span><span class="interrupteur"><input type="checkbox" role="switch" data-rap-opt="sauvegarde"${R.sauvegarde ? ' checked' : ''}><i></i></span></label>
      </div>
      <p class="note" role="status" style="margin-top:8px">${esc(msg || statutRappels())}</p>
      <div class="actions" style="margin-top:8px"><button type="button" class="bouton clair" data-rap="essai">Envoyer un essai</button>
        <button type="button" class="lien fort" data-rap="couper" style="justify-self:auto">Couper les rappels</button></div>`;
  }
  // Redessine seulement la rubrique Rappels (le reste des Réglages et le focus ne bougent pas)
  function majRappelsUI(msg, focus) {
    const f = document.getElementById('r-rappels');
    if (!f || !RG.open) return;
    const actif = document.activeElement && f.contains(document.activeElement) ? (document.activeElement.dataset.rap ? `[data-rap="${document.activeElement.dataset.rap}"]` : document.activeElement.dataset.rapOpt ? `[data-rap-opt="${document.activeElement.dataset.rapOpt}"]` : null) : null;
    f.innerHTML = htmlRappels(msg);
    const cible = (focus && f.querySelector(focus)) || (actif && f.querySelector(actif));
    if (cible && (focus || actif)) cible.focus();
  }

  // ---------- Thème clair ou sombre ----------
  const SOMBRE = window.matchMedia('(prefers-color-scheme: dark)');
  function appliquerTheme() {
    const t = ['clair', 'sombre'].includes(S.theme) ? S.theme : (SOMBRE.matches ? 'sombre' : 'clair');
    document.documentElement.dataset.theme = t;
  }
  try { SOMBRE.addEventListener('change', appliquerTheme); } catch (e) { SOMBRE.addListener && SOMBRE.addListener(appliquerTheme); }

  // ---------- Le temps passe ----------
  let dernierJour = aujourdhui(), derniereMinute = minNow();
  function rafraichir() {
    const auj = aujourdhui();
    const libre = !G && !document.querySelector('dialog[open]');
    if (auj !== dernierJour) {
      if (U.date === dernierJour) U.date = auj;
      dernierJour = auj;
      crediter();
      if (libre) { render(); if (!montrerBilan()) montrerRetard(); }
      return;
    }
    const m = minNow();
    if (m === derniereMinute) return;
    derniereMinute = m;
    // Points dus (tâche cochée en avance, temps pour moi terminé) et humeur de Guts
    const paye = crediter();
    const hum = humeur();
    if (libre && (paye || hum !== U.humeur)) { U.humeur = hum; render(); grandir(); return; }
    if (libre && !montrerBilan()) montrerRetard();   // première minute après finNuit, ou retour sur l'app
    const l = $('#vue .maintenant');
    if (l) { l.style.top = m / 60 * H + 'px'; const s = l.querySelector('span'); if (s) s.textContent = hhmm(m); }
  }
  setInterval(rafraichir, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { rafraichir(); synchroniser(); } });

  // Hors ligne : service worker, seulement quand la page est servie par un site (pas en fichier local)
  if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sans mode hors ligne, l'app marche quand même */ });
  }

  appliquerTheme();
  if (!S.depuis) { S.depuis = aujourdhui(); sauver(); }
  crediter();
  U.reaction = false; U.grandi = null;
  U.humeur = humeur();
  render();
  if (!montrerBilan()) montrerRetard();
  synchroniser();
  if (erreurStockage) dire("Attention : les données n'ont pas pu être enregistrées sur cet appareil.");
})();
</script>
</body>
</html>
