<script>
(() => {
  'use strict';
  const CLE = 'guts-cal-v1';
  const VERSION = 21;

  // ---------- Réglages ----------
  const CONFIG = {
    heure: 56,            // px par heure dans la grille (= --H)
    pas: 15,              // minutes : les créneaux se calent au quart d'heure
    duree: 60,            // durée proposée pour une nouvelle plage
    ouverture: 7,         // heure affichée en haut de la grille à l'ouverture
    appuiLong: 450,       // ms : appui long sur l'écran tactile
    joursListe: 60,       // vue Liste : nombre de jours à venir
    // tache : tâche faite, prévue avant son début ; libre : temps pour moi resté libre jusqu'au bout
    points: { tache: 10, libre: 15, libresParJour: 2, libreMin: 30 },
    heures: { coucher: 22, lever: 6, finNuit: 5 },   // Guts dort de coucher à lever ; pas de bilan avant finNuit
    surcharge: 10 * 60,                                // au-delà (minutes prévues dans la journée), Guts est fatigué
    creneaux: { debut: 8 * 60, fin: 21 * 60 },         // « prochain créneau libre » : cherché entre ces heures
    durees: [15, 30, 45, 60, 90, 120, 180],            // durées proposées pour une tâche à caser
    rappels: { horizon: 14, heureSauvegarde: 19 * 60 }, // jours envoyés d'avance au service ; heure du rappel de sauvegarde
    stades: [
      { id: 'renardeau',  nom: 'Renardeau',  seuil: 0,   echelle: 0.72 },
      { id: 'jeune',      nom: 'Jeune',      seuil: 80,  echelle: 0.86 },
      { id: 'adolescent', nom: 'Adolescent', seuil: 250, echelle: 0.96 },
      { id: 'adulte',     nom: 'Adulte',     seuil: 600, echelle: 1.06 }
    ]
  };
  const PALETTE = [
    { c: '#4f7cff', nom: 'Bleu' }, { c: '#ff4d5e', nom: 'Rouge' }, { c: '#5cc98a', nom: 'Vert' }, { c: '#ffc23d', nom: 'Jaune' },
    { c: '#9b7bff', nom: 'Violet' }, { c: '#34c6e0', nom: 'Cyan' }, { c: '#ff8a3d', nom: 'Orange' }, { c: '#8d99cc', nom: 'Gris' }
  ];
  const CATS = () => [
    { id: 'travail', nom: 'Travail', couleur: '#4f7cff' },
    { id: 'perso', nom: 'Perso', couleur: '#ff4d5e' },
    { id: 'sport', nom: 'Sport', couleur: '#5cc98a' },
    { id: 'social', nom: 'Social', couleur: '#ffc23d' }
  ];
  const REPET = { jour: 'Chaque jour', ouvres: 'En semaine', semaine: 'Chaque semaine', mois: 'Chaque mois' };
  const LIBRE = { c: '#1aa9c4', fond: '#d6f6fc', titre: 'Temps pour moi' };
  const H = CONFIG.heure;

  // ---------- Renard : aplats, contour nuit, d'après les planches de référence ----------
  // Le stade règle le nombre de queues et les proportions (tête, yeux, oreilles).
  // L'humeur règle le visage, et la pose : assis, ou couché et enroulé pour « endormie ».
  const R = {
    fourrure: '#2a62e0', ombre: '#2543c9', creme: '#fff4ea', nuit: '#0a0f26',
    cyan: '#7ef0ff', iris: '#4f7cff', rouge: '#ff4d5e', rose: '#ff8c97'
  };
  const FORME = {
    renardeau:  { queues: 1, queue: 0.78, tete: 1.14, oeil: 1.12, oreille: 0.92 },
    jeune:      { queues: 2, queue: 0.86, tete: 1.06, oeil: 1.05, oreille: 0.98 },
    adolescent: { queues: 3, queue: 0.94, tete: 1.0,  oeil: 1.0,  oreille: 1.04 },
    adulte:     { queues: 3, queue: 1.06, tete: 0.94, oeil: 0.94, oreille: 1.1 }
  };
  // Formes de base (repère 200 × 200, sol à y = 192, cou en 100,126)
  const F = {
    queue: 'M -13 2 C -32 -18 -38 -54 -22 -80 C -15 -92 -6 -100 4 -106 C 1 -94 7 -84 15 -74 C 28 -56 27 -24 13 2 Z',
    boutQueue: 'M -44 -64 L -30 -60 L -22 -70 L -12 -62 L -2 -73 L 7 -64 L 17 -74 L 44 -66 L 44 -130 L -44 -130 Z',
    crane: 'M 54 88 C 54 64 68 49 86 46 L 91 36 L 98 44 L 105 33 L 111 46 C 132 50 146 66 146 88 L 158 95 L 147 100 L 155 110 L 139 111 C 129 123 115 128 100 128 C 85 128 71 123 61 111 L 45 110 L 53 100 L 42 95 Z',
    masque: 'M 30 150 L 30 104 Q 60 96 79 106 Q 91 113 100 104 Q 109 113 121 106 Q 140 96 170 104 L 170 150 Z',
    marque: 'M 100.5 48 C 93 53 91 60 94.5 65.5 C 96.5 68.5 99.5 71 101 76 C 103 71 108.5 67.5 108.5 62 C 108.5 57 102.5 55.5 100.5 59.5 C 99.5 61.5 101 63.5 103.5 63 C 102 66.5 97.5 65 96.8 61 C 96 56.5 98 52 100.5 48 Z',
    oreilles: [
      { d: 'M 62 80 C 54 58 50 34 52 9 C 71 18 87 36 95 58 Z', dedans: 'M 68 70 C 64 56 62 44 62 32 C 72 39 80 49 86 60 Z', bout: 'M 30 40 L 92 22 L 92 -10 L 30 -10 Z', x: 70 },
      { d: 'M 138 80 C 146 58 150 34 148 9 C 129 18 113 36 105 58 Z', dedans: 'M 132 70 C 136 56 138 44 138 32 C 128 39 120 49 114 60 Z', bout: 'M 170 40 L 108 22 L 108 -10 L 170 -10 Z', x: 130 }
    ],
    torse: 'M 74 190 C 68 160 76 130 100 126 C 124 130 132 160 126 190 Z',
    pattes: ['M 82.5 148 L 82.5 186 Q 82.5 192 90.5 192 Q 98.5 192 98.5 186 L 98.5 148 Z',
             'M 101.5 148 L 101.5 186 Q 101.5 192 109.5 192 Q 117.5 192 117.5 186 L 117.5 148 Z'],
    chaussettes: 'M 70 200 L 70 176 L 82 176 L 86 170 L 90 176 L 94 171 L 98 177 L 102 177 L 106 171 L 110 176 L 114 170 L 118 176 L 130 176 L 130 200 Z',
    plastron: 'M 69 128 Q 100 116 131 128 L 132 141 L 125 149 L 121 144 L 115 157 L 108 151 L 100 167 L 92 151 L 85 157 L 79 144 L 75 149 L 68 141 Z',
    couche: 'M 40 191 C 32 162 60 138 100 137 C 142 136 168 162 162 191 Z',
    enroulee: 'M 42 176 C 44 196 118 200 158 191 C 170 188 178 179 183 166 C 174 173 162 176 150 175 C 116 173 80 178 58 168 C 52 166 46 170 42 176 Z',
    boutEnroulee: 'M 150 158 L 157 167 L 150 174 L 158 181 L 151 189 L 158 198 L 200 200 L 200 150 Z'
  };
  let numRenard = 0;

  const trait = w => `stroke="${R.nuit}" stroke-width="${w.toFixed(2)}" stroke-linejoin="round" stroke-linecap="round"`;
  const lueur = (d, w) => `<path class="lueur" d="${d}" fill="none" stroke="${R.cyan}" stroke-width="${w.toFixed(2)}" stroke-linecap="round"/>`;
  // Forme pleine + détails découpés à l'intérieur + contour par-dessus
  const piece = (id, d, details, w) => `
    <path id="${id}" d="${d}" fill="${R.fourrure}"/>
    <clipPath id="${id}c"><use href="#${id}"/></clipPath>
    <g clip-path="url(#${id}c)">${details}</g>
    <path d="${d}" fill="none" ${trait(w)}/>`;

  // Queue, pointe en haut, base en (0,0) puis tournée en place. Forme commune définie dans <defs>.
  function queue(u, x, y, angle, taille, sw) {
    return `<g transform="translate(${x} ${y}) rotate(${angle}) scale(${taille})">
      <use href="#${u}q" fill="${R.fourrure}"/>
      <g clip-path="url(#${u}qc)">
        <path d="${F.boutQueue}" fill="${R.creme}"/>
        <path d="M -44 8 L 44 8 L 44 -6 Q 0 0 -44 -10 Z" fill="${R.ombre}"/>
      </g>
      ${lueur('M -16 -22 C -6 -30 -5 -40 -14 -50', 4 / taille)}
      <use href="#${u}q" fill="none" ${trait(sw / taille)}/>
    </g>`;
  }

  // Œil ouvert : contour nuit, iris bleu, croissant cyan, pupille, reflets, cils côté extérieur.
  const oeil = (cx, cy, cote, k) => `<g transform="translate(${cx} ${cy}) scale(${k})">
      <ellipse rx="11.5" ry="13" fill="${R.nuit}"/>
      <ellipse cy="1" rx="8.6" ry="10.2" fill="${R.iris}"/>
      <ellipse cy="6.5" rx="5.6" ry="3.2" fill="${R.cyan}"/>
      <ellipse cy="-0.5" rx="4.6" ry="6.2" fill="${R.nuit}"/>
      <circle cx="${3.4 * cote}" cy="-5" r="3.3" fill="#fff"/>
      <circle cx="${-3.4 * cote}" cy="5" r="1.5" fill="#fff"/>
      <path d="M ${-10 * cote} -6 L ${-16 * cote} -10 M ${-11 * cote} -1 L ${-16.5 * cote} -2" fill="none" stroke="${R.nuit}" stroke-width="3" stroke-linecap="round"/>
    </g>`;

  function visage(humeur, f, sw) {
    const ouverts = `<g class="yeux">${oeil(80, 94, 1, f.oeil)}${oeil(120, 94, -1, f.oeil)}</g>`;
    const nez = `<path d="M 95 108 Q 100 106 105 108 Q 103 113 100 114 Q 97 113 95 108 Z" fill="${R.nuit}"/>`;
    const bouche = `<path d="M 92 118 Q 96 122 100 118 Q 104 122 108 118" fill="none" ${trait(sw * 0.75)}/>`;
    if (humeur === 'joyeuse') return `
      <path d="M 69 97 Q 80 84 91 97 M 109 97 Q 120 84 131 97" fill="none" ${trait(sw * 1.15)}/>
      <ellipse cx="68" cy="107" rx="6.5" ry="3.4" fill="${R.rose}"/><ellipse cx="132" cy="107" rx="6.5" ry="3.4" fill="${R.rose}"/>
      ${nez}
      <path d="M 90 117 Q 100 133 110 117 Q 100 120 90 117 Z" fill="${R.nuit}" ${trait(sw * 0.6)}/>
      <path d="M 94.5 123.5 Q 100 120.5 105.5 123.5 Q 100 129.5 94.5 123.5 Z" fill="${R.rouge}"/>`;
    if (humeur === 'endormie') return `
      <path d="M 69 95 Q 80 104 91 95 M 109 95 Q 120 104 131 95" fill="none" ${trait(sw * 1.15)}/>
      ${nez}${bouche}`;
    if (humeur === 'determinee') return `
      ${ouverts}
      <path d="M 62 72 L 98 72 L 98 93 L 66 84 Z M 138 72 L 102 72 L 102 93 L 134 84 Z" fill="${R.fourrure}"/>
      <path d="M 66 84 L 95 92 M 134 84 L 105 92" fill="none" ${trait(sw * 1.1)}/>
      ${nez}${bouche}`;
    if (humeur === 'fatiguee') return `
      ${ouverts}
      <path d="M 64 79 L 97 79 L 97 95 Q 80.5 100 64 95 Z M 103 79 L 136 79 L 136 95 Q 119.5 100 103 95 Z" fill="${R.fourrure}"/>
      <path d="M 67 95 Q 80.5 100 94 95 M 106 95 Q 119.5 100 133 95" fill="none" ${trait(sw * 1.05)}/>
      ${nez}
      <path d="M 92 120 Q 96 117 100 120 Q 104 123 108 120" fill="none" ${trait(sw * 0.75)}/>
      <path d="M 146 62 Q 153 74 146 79 Q 139 74 146 62 Z" fill="${R.cyan}" ${trait(sw * 0.6)}/>`;
    // curieuse
    return `${ouverts}${nez}<ellipse cx="100" cy="120" rx="3" ry="3.4" fill="${R.nuit}"/>`;
  }

  // Tête : oreilles, crâne, masque crème, marques, visage. Attachée au cou (100, 126).
  function tete(u, humeur, f, sw) {
    const oreilles = F.oreilles.map((o, i) => `
      <g transform="translate(${o.x} 70) scale(1 ${f.oreille}) translate(${-o.x} -70)">
        ${piece(u + 'o' + i, o.d, `<path d="${o.bout}" fill="${R.nuit}"/><path d="${o.dedans}" fill="${R.creme}"/>`, sw)}
      </g>`).join('');
    return `${oreilles}
      ${piece(u + 't', F.crane, `<path d="${F.masque}" fill="${R.creme}"/>`, sw)}
      <ellipse cx="78" cy="73" rx="5.5" ry="2.6" transform="rotate(-18 78 73)" fill="${R.creme}"/>
      <ellipse cx="122" cy="73" rx="5.5" ry="2.6" transform="rotate(18 122 73)" fill="${R.creme}"/>
      <path class="lueur" d="${F.marque}" fill="${R.cyan}"/>
      ${visage(humeur, f, sw)}`;
  }

  function renard(stade = 'renardeau', humeur = 'curieuse') {
    const st = CONFIG.stades.find(s => s.id === stade) || CONFIG.stades[0];
    const f = FORME[st.id] || FORME.adolescent;
    const u = 'gr' + (++numRenard) + '-';       // identifiants uniques dans la page
    const sw = 4 / st.echelle;                   // contour constant quel que soit le stade
    const texte = (x, y, taille, t) => `<text x="${x}" y="${y}" font-size="${taille}" font-weight="900" fill="${R.cyan}" stroke="${R.nuit}" stroke-width="3.5" paint-order="stroke">${t}</text>`;
    let corps;

    if (humeur === 'endormie') {
      // Couché, enroulé dans une queue ; les autres queues dépassent derrière le dos.
      const arriere = { 1: [], 2: [-38], 3: [-58, -28] }[f.queues] || [];
      const k = f.tete * 0.78;
      corps = `
        ${arriere.map(a => queue(u, 60, 176, a, f.queue, sw)).join('')}
        <path d="${F.couche}" fill="${R.fourrure}" ${trait(sw)}/>
        <ellipse cx="72" cy="168" rx="28" ry="21" fill="${R.fourrure}" ${trait(sw)}/>
        ${lueur('M 56 168 C 60 158 70 154 80 156', 4)}
        ${piece(u + 'e', F.enroulee, `<path d="${F.boutEnroulee}" fill="${R.creme}"/>`, sw)}
        ${lueur('M 92 187 C 102 183 112 184 120 189', 4)}
        <g transform="translate(128 182) rotate(4) scale(${k}) translate(-100 -126)">${tete(u, 'endormie', f, sw / k)}</g>
        ${texte(160, 78, 20, 'z')}${texte(174, 60, 15, 'z')}`;
    } else {
      const angles = { 1: [-50], 2: [-62, -30], 3: [-70, -45, -20] }[f.queues] || [-50];
      const decal = { 1: 4, 2: 7, 3: 10 }[f.queues] || 6;   // recentre : les queues partent à gauche
      const pencher = humeur === 'curieuse' ? -8 : 0;
      const pattes = F.pattes.map((d, i) => piece(u + 'p' + i, d,
        `<path d="${F.chaussettes}" fill="${R.creme}"/><rect x="70" y="185" width="60" height="20" fill="${R.nuit}"/>`, sw)).join('');
      corps = `<g transform="translate(${decal} 0)">
        ${angles.map(a => queue(u, 82, 178, a, f.queue, sw)).join('')}
        <ellipse cx="72" cy="172" rx="24" ry="19" fill="${R.fourrure}" ${trait(sw)}/>
        <ellipse cx="128" cy="172" rx="24" ry="19" fill="${R.fourrure}" ${trait(sw)}/>
        ${lueur('M 54 170 C 58 162 66 159 72 160', 4)}
        <path d="${F.torse}" fill="${R.fourrure}" ${trait(sw)}/>
        ${pattes}
        <path d="${F.plastron}" fill="${R.creme}" ${trait(sw)}/>
        <g transform="translate(100 126) rotate(${pencher}) scale(${f.tete}) translate(-100 -126)">${tete(u, humeur, f, sw / f.tete)}</g>
        ${humeur === 'curieuse' ? texte(150, 40, 28, '?') : ''}
      </g>`;
    }

    return `<svg class="fox ${humeur}" viewBox="0 0 200 200" role="img" aria-label="Guts, ${st.nom}">
      <defs><path id="${u}q" d="${F.queue}"/><clipPath id="${u}qc"><use href="#${u}q"/></clipPath></defs>
      <g class="fox-reaction"><g transform="translate(100 192) scale(${st.echelle}) translate(-100 -192)">${corps}</g></g>
    </svg>`;
  }

  // ---------- Données ----------
  // Élément : { id, type: 'tache' | 'evenement', titre, cat, date, debut, fin (minutes depuis minuit, null = journée entière),
  //             rep: null | { freq, jusqua }, exceptions: { date: true }, faits: { date: true }, creeLe: horodatage }
  // payes : { clé d'occurrence : { pts, jour, type, raison? } } — points versés (ou refusés, pts 0) ; gains : { jour : { taches, libre } }
  // Notifications : jeton auprès du service, choix de l'utilisateur, empreinte de la dernière liste envoyée
  function rappelsVides() {
    return { actif: false, jeton: null, service: null, avant: true, delai: 30, matin: true, heureMatin: 8 * 60, sauvegarde: true, signature: null, majLe: null, erreur: null };
  }
  const vide = () => ({ elements: [], categories: CATS(), points: 0, gains: {}, payes: {}, bilanVu: null, vue: 'jour', derniereExport: null,
    depuis: null, rappelVu: null, importV14: false,
    acaser: [],             // tâches sans créneau : { id, titre, cat, duree, ajouteLe }
    theme: 'auto',          // 'auto' (suit l'iPhone), 'clair' ou 'sombre'
    bilanSemaineVu: null,   // lundi où le bilan de la semaine passée a été montré
    lachees: [],            // tâches laissées partir : { titre, date, lacheeLe }
    retardVu: null,         // jour où les tâches pas faites ont été proposées
    rappels: null });       // notifications : voir rappelsVides()
  let S;
  try { S = Object.assign(vide(), JSON.parse(localStorage.getItem(CLE)) || {}); }
  catch (e) { S = vide(); }
  function nettoyer() {
    if (!Array.isArray(S.elements)) S.elements = [];
    if (!Array.isArray(S.acaser)) S.acaser = [];
    if (!Array.isArray(S.lachees)) S.lachees = [];
    S.rappels = Object.assign(rappelsVides(), S.rappels && typeof S.rappels === 'object' ? S.rappels : {});
    if (S.lachees.length > 300) S.lachees.length = 300;
    S.acaser = S.acaser.filter(x => x && x.id && x.titre);
    S.acaser.forEach(x => { x.duree = Math.max(15, Math.min(24 * 60, Math.round(Number(x.duree) || 60))); });
    if (!Array.isArray(S.categories) || !S.categories.length) S.categories = CATS();
    ['gains', 'payes'].forEach(c => { if (!S[c] || typeof S[c] !== 'object' || Array.isArray(S[c])) S[c] = {}; });
    S.elements = S.elements.filter(el => el && el.id && typeof el.date === 'string');
    S.elements.forEach(el => {
      el.exceptions = el.exceptions || {}; el.faits = el.faits || {};
      if (!['tache', 'evenement', 'libre'].includes(el.type)) el.type = 'tache';
      if (el.type === 'libre' && el.debut == null) el.type = 'evenement';
      if (el.debut == null) { el.debut = null; el.fin = null; }
    });
    // Série qui ne tombe plus jamais : retirée
    S.elements = S.elements.filter(el => !el.rep || !el.rep.jusqua || el.rep.jusqua >= el.date);
  }
  nettoyer();
  let erreurStockage = false;
  // Enregistre, puis prévient le service de rappels si la liste des rappels a changé
  const sauver = () => { ecrire(); planifierSynchro(); };
  const ecrire = () => {
    nettoyer();
    // Journal et paiements : les quatre derniers mois suffisent
    const limite = decaler(aujourdhui(), -120);
    Object.keys(S.gains).forEach(k => { if (k < limite) delete S.gains[k]; });
    Object.keys(S.payes).forEach(c => { if (!S.payes[c] || (S.payes[c].jour || '') < limite) delete S.payes[c]; });
    try { localStorage.setItem(CLE, JSON.stringify(S)); erreurStockage = false; }
    catch (e) { erreurStockage = true; }
  };
  // Demande au navigateur de ne pas effacer les données (Safari, Chrome)
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* facultatif */ }

  // ---------- Dates et heures ----------
  const dk = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parse = k => { const [y, m, j] = k.split('-').map(Number); return new Date(y, m - 1, j); };
  const aujourdhui = () => dk(new Date());
  const decaler = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dk(d); };
  const ecart = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const indexJour = k => (parse(k).getDay() + 6) % 7;            // 0 = lundi
  const lundiDe = k => decaler(k, -indexJour(k));
  const moisPlus = (k, n) => { const d = parse(k); const j = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const fin = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(j, fin)); return dk(d); };
  const fmt = (k, o) => parse(k).toLocaleDateString('fr-FR', o);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const versMin = s => { if (!s) return null; const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const minNow = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const debutOcc = o => { const d = parse(o.k); return d.getTime() + (o.el.debut || 0) * 6e4; };   // horodatage du début
  const caler = m => Math.round(m / CONFIG.pas) * CONFIG.pas;
  const borne = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  const INITIALES = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

  // Couleur éclaircie (mélangée au blanc) pour le fond des tâches
  function teinte(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const m = v => Math.round(v * a + 255 * (1 - a));
    return `rgb(${m(r)}, ${m(g)}, ${m(b)})`;
  }
  const cat = id => S.categories.find(c => c.id === id) || S.categories[0] || { id: '', nom: '', couleur: '#8d99cc' };
  // Même couleur mélangée à la feuille sombre, pour le thème sombre
  function teinteSombre(hex, a) {
    const n = parseInt(hex.slice(1), 16), f = [0x12, 0x1a, 0x3c];
    const m = (v, i) => Math.round(v * a + f[i] * (1 - a));
    return `rgb(${m(n >> 16, 0)}, ${m((n >> 8) & 255, 1)}, ${m(n & 255, 2)})`;
  }
  const styleCat = id => { const c = cat(id).couleur; return `--c:${c};--fond:${teinte(c, .26)};--fond-s:${teinteSombre(c, .36)}`; };
  const styleEl = el => el.type === 'libre' ? `--c:${LIBRE.c};--fond:${LIBRE.fond};--fond-s:#14394a` : styleCat(el.cat);
  const couleurEl = el => el.type === 'libre' ? LIBRE.c : cat(el.cat).couleur;

  // ---------- Occurrences ----------
  function tombe(el, k) {
    if (k < el.date) return false;
    if (!el.rep) return k === el.date;
    if (el.rep.jusqua && k > el.rep.jusqua) return false;
    if (el.exceptions[k]) return false;
    const d = parse(k), d0 = parse(el.date);
    switch (el.rep.freq) {
      case 'jour': return true;
      case 'ouvres': return d.getDay() >= 1 && d.getDay() <= 5;
      case 'semaine': return d.getDay() === d0.getDay();
      case 'mois': return d.getDate() === d0.getDate();
    }
    return false;
  }
  const occ = (el, k) => ({ el, k, cle: el.id + '|' + k, fait: !!el.faits[k] });
  const ordre = (a, b) => (a.el.debut == null ? -1 : a.el.debut) - (b.el.debut == null ? -1 : b.el.debut)
    || (a.el.fin || 0) - (b.el.fin || 0) || a.el.titre.localeCompare(b.el.titre, 'fr');
  const duJour = k => S.elements.filter(el => tombe(el, k)).map(el => occ(el, k)).sort(ordre);
  function trouver(cle) {
    const i = cle.lastIndexOf('|');
    const el = S.elements.find(e => e.id === cle.slice(0, i));
    const k = cle.slice(i + 1);
    return el && tombe(el, k) ? occ(el, k) : null;
  }
  const copie = el => JSON.parse(JSON.stringify(el));

  // Déplace l'état d'une occurrence (fait, points) quand elle change de clé
  function transferer(ancienne, nouvelle) {
    if (ancienne === nouvelle) return;
    if (S.payes[ancienne]) { S.payes[nouvelle] = S.payes[ancienne]; delete S.payes[ancienne]; }
  }
  // Entrées datées d'un objet { date: … } à partir de « depuis », décalées de « delta » jours, retirées de la source
  function prendreDepuis(obj, depuis, delta) {
    const res = {};
    Object.keys(obj).forEach(k => { if (k >= depuis) { res[delta ? decaler(k, delta) : k] = obj[k]; delete obj[k]; } });
    return res;
  }

  // Modifie une occurrence. champs : valeurs voulues pour cette occurrence (date, debut, fin, titre, type, cat, rep).
  // portee : 'une' (cette fois seulement) ou 'suivantes' (celle-ci et les suivantes). Renvoie la nouvelle clé.
  function appliquer(o, champs, portee) {
    const el = o.el;
    const final = Object.assign({}, { date: o.k }, champs);
    if (!el.rep) {
      const fait = !!el.faits[o.k];
      Object.assign(el, final);
      el.faits = fait ? { [el.date]: true } : {};
      if (!el.rep) el.exceptions = {};
      transferer(o.cle, el.id + '|' + el.date);
      return el.id + '|' + el.date;
    }
    if (portee === 'une') {
      const fait = !!el.faits[o.k];
      el.exceptions[o.k] = true;
      delete el.faits[o.k];
      const n = Object.assign(copie(el), final, { id: uid(), rep: null, exceptions: {}, faits: {}, serie: el.id });
      if (fait) n.faits[n.date] = true;
      S.elements.push(n);
      transferer(o.cle, n.id + '|' + n.date);
      return n.id + '|' + n.date;
    }
    // Celle-ci et les suivantes
    const delta = ecart(o.k, final.date);
    if (o.k === el.date) {
      const faits = prendreDepuis(el.faits, o.k, delta), exc = prendreDepuis(el.exceptions, o.k, delta);
      Object.assign(el, final);
      el.faits = faits; el.exceptions = exc;
      return el.id + '|' + el.date;
    }
    const n = Object.assign(copie(el), final, { id: uid(), faits: prendreDepuis(el.faits, o.k, delta), exceptions: prendreDepuis(el.exceptions, o.k, delta) });
    el.rep = Object.assign({}, el.rep, { jusqua: decaler(o.k, -1) });
    Object.keys(S.payes).forEach(c => { if (c.startsWith(el.id + '|') && c.slice(el.id.length + 1) >= o.k) transferer(c, n.id + '|' + decaler(c.slice(el.id.length + 1), delta)); });
    S.elements.push(n);
    return n.id + '|' + n.date;
  }

  function supprimerOcc(o, portee) {
    const el = o.el;
    if (!el.rep || (portee === 'suivantes' && o.k === el.date)) {
      S.elements = S.elements.filter(e => e !== el);
    } else if (portee === 'une') {
      el.exceptions[o.k] = true;
      delete el.faits[o.k];
    } else {
      el.rep = Object.assign({}, el.rep, { jusqua: decaler(o.k, -1) });
      prendreDepuis(el.faits, o.k, 0);
      prendreDepuis(el.exceptions, o.k, 0);
    }
  }

  // Service de rappels : adresse (undefined = pas encore cherchée, null = pas en place), clé publique, minuterie
  const RAP = { service: undefined, cle: null, minuteur: null, enCours: false, reabonner: null };

  // ---------- État de l'écran (non enregistré) ----------
  const U = {
    vue: ['jour', 'semaine', 'mois', 'liste'].includes(S.vue) ? S.vue : 'jour',
    date: aujourdhui(),
    selection: null,     // clé de l'occurrence choisie (poignées visibles)
    brouillon: null,     // { k, debut, fin } : nouvelle plage en cours
    defile: {},          // position de défilement par vue
    edition: null,       // { o?, modele }
    avaler: 0            // après un geste : le clic qui suit est ignoré
  };

  // ---------- Petits morceaux ----------
  const ICONE = {
    coche: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>',
    reglages: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="10" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>',
    gauche: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    droite: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const plage = el => el.debut == null ? 'Journée entière' : `${hhmm(el.debut)} – ${hhmm(el.fin)}`;
  const nomType = el => ({ tache: 'Tâche', evenement: 'Événement', libre: 'Pour moi' }[el.type]);
  const description = o => `${nomType(o.el)} : ${o.el.titre}, ${o.el.debut == null ? 'journée entière' : 'de ' + hhmm(o.el.debut) + ' à ' + hhmm(o.el.fin)}`
    + (o.el.type === 'libre' ? `, ${ETAT_LIBRE[etatLibre(o)]}` : `, ${cat(o.el.cat).nom}`)
    + `${o.el.rep ? ', ' + REPET[o.el.rep.freq].toLowerCase() : ''}${o.el.type === 'tache' && o.fait ? ', faite' : ''}${S.payes[o.cle] && S.payes[o.cle].pts ? ', +' + S.payes[o.cle].pts + ' points' : ''}`;
  const caseTache = o => `<button type="button" class="case" role="checkbox" aria-checked="${o.fait}" data-cocher="${o.cle}"
      aria-label="${esc(o.el.titre)} : ${o.fait ? 'faite' : 'à faire'}" data-focus="c${o.cle}">${ICONE.coche}</button>`;

  const stadeDe = pts => CONFIG.stades.reduce((a, s) => (pts >= s.seuil ? s : a), CONFIG.stades[0]);
  const stade = () => stadeDe(S.points);
  const suivant = () => CONFIG.stades.find(s => s.seuil > S.points) || null;

  // ---------- Points ----------
  // Tout gain ou retrait passe par ici : le total et le journal du jour restent d'accord.
  function gagner(source, pts, k) {
    const avant = stade();
    S.points = Math.max(0, S.points + pts);
    const g = (S.gains[k] = S.gains[k] || { taches: 0, libre: 0 });
    g[source] = (g[source] || 0) + pts;
    if (pts > 0) {
      U.reaction = true;
      const apres = stade();
      if (apres.id !== avant.id) U.grandi = apres;
    }
  }
  const finOcc = o => parse(o.k).getTime() + (o.el.fin == null ? 1440 : o.el.fin) * 6e4;
  const prevue = o => (o.el.creeLe || 0) < debutOcc(o);             // planifiée avant son début
  function payer(o) {
    const type = o.el.type === 'libre' ? 'libre' : 'tache';
    const pts = CONFIG.points[type];
    S.payes[o.cle] = { pts, jour: o.k, type };
    gagner(type === 'libre' ? 'libre' : 'taches', pts, o.k);
    return pts;
  }
  // Tâches et événements qui empiètent sur un temps pour moi
  const grignoteurs = o => duJour(o.k).filter(x => x.el.type !== 'libre' && x.el.debut != null && x.el.debut < o.el.fin && x.el.fin > o.el.debut);
  const libresPayes = k => Object.values(S.payes).filter(p => p.type === 'libre' && p.jour === k && p.pts > 0).length;
  const ETAT_LIBRE = { paye: 'gardé', grignote: 'grignoté', tard: 'ajouté après son début', court: 'moins de 30 min', plafond: 'déjà 2 ce jour-là', 'en-cours': 'en cours', protege: 'protégé' };
  function etatLibre(o) {
    const p = S.payes[o.cle];
    if (p) return p.pts > 0 ? 'paye' : (p.raison || 'grignote');
    if (grignoteurs(o).length) return 'grignote';
    if (!prevue(o)) return 'tard';
    if (o.el.fin - o.el.debut < CONFIG.points.libreMin) return 'court';
    const now = Date.now();
    return now >= debutOcc(o) && now < finOcc(o) ? 'en-cours' : 'protege';
  }
  // Verse ce qui est dû : tâches cochées en avance dont l'heure est venue, temps pour moi arrivés au bout.
  function crediter() {
    const now = Date.now(), auj = aujourdhui();
    let change = false;
    for (let i = -14; i <= 0; i++) {
      const k = decaler(auj, i);
      duJour(k).forEach(o => {
        if (S.payes[o.cle]) return;
        if (o.el.type === 'tache' && o.fait && prevue(o) && debutOcc(o) <= now) { payer(o); change = true; }
        else if (o.el.type === 'libre' && finOcc(o) <= now) {
          let raison = null;
          if (!prevue(o)) raison = 'tard';
          else if (grignoteurs(o).length) raison = 'grignote';
          else if (o.el.fin - o.el.debut < CONFIG.points.libreMin) raison = 'court';
          else if (libresPayes(k) >= CONFIG.points.libresParJour) raison = 'plafond';
          if (raison) S.payes[o.cle] = { pts: 0, jour: k, type: 'libre', raison };
          else payer(o);
          change = true;
        }
      });
    }
    if (change) sauver();
    return change;
  }
  // Cocher ou décocher une tâche, avec ses points. Renvoie le message à afficher.
  function basculer(o) {
    if (o.fait) {
      delete o.el.faits[o.k];
      o.fait = false;
      const p = S.payes[o.cle];
      if (p && p.pts) { gagner('taches', -p.pts, p.jour); delete S.payes[o.cle]; return `Décochée : −${p.pts} pts.`; }
      return 'Décochée.';
    }
    o.el.faits[o.k] = true;
    o.fait = true;
    if (!prevue(o)) return 'Bien joué ! Pas de points : elle a été ajoutée après son début.';
    if (debutOcc(o) > Date.now()) {
      const quand = o.k === aujourdhui() && o.el.debut != null ? 'à ' + hhmm(o.el.debut) : 'le ' + fmt(o.k, { weekday: 'long', day: 'numeric', month: 'long' });
      return `Fait en avance : +${CONFIG.points.tache} pts ${quand}.`;
    }
    return `+${payer(o)} pts`;
  }

  // Minutes occupées par les tâches et événements (les chevauchements comptent une fois)
  function minutesPrevues(k) {
    const iv = duJour(k).filter(o => o.el.type !== 'libre' && o.el.debut != null).map(o => [o.el.debut, o.el.fin]).sort((a, b) => a[0] - b[0]);
    let total = 0, d = -1, f = -1;
    iv.forEach(([a, b]) => { if (a > f) { total += Math.max(0, f - d); d = a; f = b; } else f = Math.max(f, b); });
    return total + Math.max(0, f - d);
  }
  const duree = m => `${Math.floor(m / 60)} h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') : ''}`;
  function humeur() {
    const h = new Date().getHours();
    if (h >= CONFIG.heures.coucher || h < CONFIG.heures.lever) return 'endormie';
    const auj = aujourdhui(), occs = duJour(auj), m = minNow();
    if (occs.some(o => o.el.type === 'libre' && o.el.debut <= m && m < o.el.fin && !grignoteurs(o).length)) return 'joyeuse';
    const t = occs.filter(o => o.el.type === 'tache');
    if (t.length && t.every(o => o.fait)) return 'joyeuse';
    if (minutesPrevues(auj) > CONFIG.surcharge) return 'fatiguee';
    return t.length ? 'determinee' : 'curieuse';
  }
  function phraseGuts(hum) {
    const auj = aujourdhui(), occs = duJour(auj), m = minNow();
    const reste = occs.filter(o => o.el.type === 'tache' && !o.fait).length;
    if (hum === 'endormie') return 'Chut… Guts dort. Demain se prépare tout seul.';
    if (hum === 'fatiguee') return `Grosse journée : ${duree(minutesPrevues(auj))} prévues. Garde un moment pour toi.`;
    if (hum === 'joyeuse') return occs.some(o => o.el.type === 'libre' && o.el.debut <= m && m < o.el.fin) ? 'Temps pour toi en cours. Profite, Guts veille.' : 'Tout est fait. Le reste de la journée t\'appartient.';
    if (hum === 'determinee') return `Encore ${reste} tâche${reste > 1 ? 's' : ''} aujourd'hui. Une à la fois.`;
    return 'Rien de prévu ? Réserve un moment pour toi.';
  }
  // Le renard, avec son petit saut quand on vient de gagner des points
  function dessinGuts(hum) {
    const svg = renard(stade().id, hum);
    return U.reaction ? svg.replace('class="fox ', 'class="fox saut ') : svg;
  }

  // ---------- En-tête ----------
  function titre() {
    if (U.vue === 'liste') return { petit: 'Les prochains jours', grand: 'À venir' };
    const d = parse(U.date);
    return { petit: String(d.getFullYear()), grand: cap(d.toLocaleDateString('fr-FR', { month: 'long' })) };
  }
  function renderHaut() {
    const t = titre();
    const st = stade();
    const surAuj = U.vue === 'liste' || (U.vue === 'jour' && U.date === aujourdhui())
      || (U.vue === 'semaine' && lundiDe(U.date) === lundiDe(aujourdhui())) || (U.vue === 'mois' && U.date.slice(0, 7) === aujourdhui().slice(0, 7) && U.date === aujourdhui());
    $('#haut').innerHTML = `
      <div class="ligne1">
        <button type="button" class="guts-mini" data-action="guts" aria-label="Guts, ${st.nom}, ${S.points} points" data-focus="guts">${dessinGuts(humeur())}<span aria-hidden="true"><b${U.reaction ? ' class="monte"' : ''}>${S.points}</b><small>pts</small></span></button>
        <h1 aria-live="polite"><small>${esc(t.petit)}</small>${esc(t.grand)}</h1>
        ${U.vue === 'liste' ? '' : `<button type="button" class="rond" data-nav="-1" aria-label="${libNav(-1)}" data-focus="nav-1">${ICONE.gauche}</button>
        <button type="button" class="rond" data-nav="1" aria-label="${libNav(1)}" data-focus="nav1">${ICONE.droite}</button>`}
        <button type="button" class="rond" data-action="reglages" aria-label="Réglages" data-focus="reglages">${ICONE.reglages}</button>
      </div>
      <div class="ligne2">
        <div class="vues" role="tablist" aria-label="Vue du calendrier">
          ${[['jour', 'Jour'], ['semaine', 'Semaine'], ['mois', 'Mois'], ['liste', 'Liste']].map(([v, n]) =>
            `<button type="button" role="tab" aria-selected="${U.vue === v}" data-vue="${v}" data-focus="vue-${v}">${n}</button>`).join('')}
        </div>
        <button type="button" class="pilule" data-action="aujourdhui" data-focus="auj" ${surAuj ? 'disabled' : ''}>Aujourd'hui</button>
      </div>`;
  }
  const libNav = s => ({ jour: s < 0 ? 'Jour précédent' : 'Jour suivant', semaine: s < 0 ? 'Semaine précédente' : 'Semaine suivante', mois: s < 0 ? 'Mois précédent' : 'Mois suivant' }[U.vue] || '');

  // ---------- Grille horaire (Jour et Semaine) ----------
  // Répartit les plages qui se chevauchent en colonnes côte à côte
  function disposer(liste) {
    const items = liste.filter(o => o.el.debut != null).map(o => ({ o, d: o.el.debut, f: Math.max(o.el.fin, o.el.debut + 20) }))
      .sort((a, b) => a.d - b.d || b.f - a.f);
    const res = [];
    let groupe = [], finGroupe = -1;
    const fermer = () => { const n = Math.max(...groupe.map(g => g.col)) + 1; groupe.forEach(g => { g.n = n; res.push(g); }); groupe = []; };
    items.forEach(it => {
      if (groupe.length && it.d >= finGroupe) fermer();
      const fins = [];
      groupe.forEach(g => { fins[g.col] = Math.max(fins[g.col] || 0, g.f); });
      let c = 0;
      while (fins[c] != null && fins[c] > it.d) c++;
      it.col = c;
      groupe.push(it);
      finGroupe = Math.max(finGroupe, it.f);
    });
    if (groupe.length) fermer();
    return res;
  }

  function bloc(g) {
    const o = g.o, el = o.el;
    const haut = el.debut / 60 * H, hauteur = Math.max((el.fin - el.debut) / 60 * H, 20);
    const court = hauteur < 38;
    const choisi = U.selection === o.cle;
    const avecCase = el.type === 'tache' && U.vue === 'jour';
    const etat = el.type === 'libre' ? etatLibre(o) : null;
    const paye = S.payes[o.cle] && S.payes[o.cle].pts;
    return `<div class="bloc ${el.type}${etat === 'grignote' ? ' grignote' : ''}${o.fait ? ' fait' : ''}${court ? ' court' : ''}${choisi ? ' choisi' : ''}${g.n > 1 && U.vue === 'semaine' ? ' etroit' : ''}" data-cle="${o.cle}"
        style="top:${haut}px;height:${hauteur}px;left:calc(${g.col / g.n * 100}% + 2px);width:calc(${100 / g.n}% - 4px);${styleEl(el)}">
      <button type="button" class="b-ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}"></button>
      ${avecCase ? caseTache(o) : ''}
      <span class="b-texte" aria-hidden="true"><b>${U.vue === 'semaine' && o.fait ? '✓ ' : ''}${esc(el.titre)}</b><small>${hhmm(el.debut)}${court ? '' : ' – ' + hhmm(el.fin)}${etat ? ' · ' + ETAT_LIBRE[etat] : ''}</small></span>
      ${paye ? `<span class="gain" aria-hidden="true">+${paye}</span>` : ''}
      <span class="bord" data-bord="bas" aria-hidden="true"></span>
      ${choisi ? '<span class="poignee haut" data-bord="haut" aria-hidden="true"></span><span class="poignee bas" data-bord="bas" aria-hidden="true"></span>' : ''}
    </div>`;
  }
  function blocBrouillon(b) {
    const hauteur = Math.max((b.fin - b.debut) / 60 * H, 20);
    return `<div class="bloc brouillon${hauteur < 38 ? ' court' : ''}" data-brouillon="1" style="top:${b.debut / 60 * H}px;height:${hauteur}px;left:2px;width:calc(100% - 4px)">
      <button type="button" class="b-ouvrir" data-action="remplir" aria-label="Nouvelle plage de ${hhmm(b.debut)} à ${hhmm(b.fin)} : toucher pour la remplir" data-focus="brouillon"></button>
      <span class="b-texte" aria-hidden="true"><b>Nouvelle</b><small>${hhmm(b.debut)} – ${hhmm(b.fin)}</small></span>
      <span class="poignee haut" data-bord="haut" aria-hidden="true"></span><span class="poignee bas" data-bord="bas" aria-hidden="true"></span>
    </div>`;
  }

  function grille(jours) {
    const auj = aujourdhui();
    let h = '';
    const mn = jours.includes(auj) ? minNow() : -99;
    // L'étiquette de l'heure s'efface quand la ligne « maintenant » passe dessus
    for (let i = 1; i < 24; i++) h += `${Math.abs(i * 60 - mn) < 13 ? '' : `<div class="heure" style="top:${i * H}px">${hhmm(i * 60)}</div>`}<div class="trait-h" style="top:${i * H}px"></div>`;
    const cols = jours.map(k => {
      const occs = duJour(k);
      const blocs = disposer(occs).map(bloc).join('');
      const br = U.brouillon && U.brouillon.k === k ? blocBrouillon(U.brouillon) : '';
      return `<div class="colonne${k === auj ? ' auj' : ''}" data-jour="${k}">${blocs}${br}</div>`;
    }).join('');
    const iAuj = jours.indexOf(auj);
    const m = minNow();
    const ligne = iAuj < 0 ? '' : `<div class="maintenant" style="top:${m / 60 * H}px"><span>${hhmm(m)}</span>${jours.length > 1 ? `<i style="left:calc((100% - 4px) * ${(iAuj + .5) / jours.length})"></i>` : ''}</div>`;
    return `<div class="grille">${h}<div class="colonnes" style="--n:${jours.length}" role="group" aria-label="Grille horaire">${cols}</div>${ligne}</div><div class="bas-espace"></div>`;
  }

  function bandeSemaine(k, choix) {
    const l = lundiDe(k), auj = aujourdhui();
    return Array.from({ length: 7 }, (_, i) => {
      const d = decaler(l, i);
      const n = duJour(d).length;
      return `<button type="button" class="jour-b${d === auj ? ' auj' : ''}" data-aller="${d}" aria-pressed="${d === choix}" data-focus="j${d}"
        aria-label="${cap(fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }))}${d === auj ? ", aujourd'hui" : ''}${n ? ', ' + n + ' élément' + (n > 1 ? 's' : '') : ''}">
        <span aria-hidden="true">${INITIALES[i]}</span><b aria-hidden="true">${parse(d).getDate()}</b><i class="${n ? 'plein' : ''}" aria-hidden="true"></i></button>`;
    }).join('');
  }

  function puce(o) {
    return `<div class="puce${o.fait ? ' fait' : ''}" style="${styleEl(o.el)}">
      ${o.el.type === 'tache' ? caseTache(o) : ''}
      <button type="button" class="ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}">${esc(o.el.titre)}</button></div>`;
  }

  function vueJour() {
    const k = U.date, occs = duJour(k);
    const entieres = occs.filter(o => o.el.debut == null);
    const taches = occs.filter(o => o.el.type === 'tache');
    const faites = taches.filter(o => o.fait).length;
    return `
      <div class="bande">
        <button type="button" class="fleche" data-saut="-7" aria-label="Semaine précédente" data-focus="s-7">${ICONE.gauche}</button>
        ${bandeSemaine(k, k)}
        <button type="button" class="fleche" data-saut="7" aria-label="Semaine suivante" data-focus="s7">${ICONE.droite}</button>
      </div>
      <div class="jour-titre"><span>${cap(fmt(k, { weekday: 'long', day: 'numeric', month: 'long' }))}</span>
        ${taches.length ? `<span class="compte">Tâches : ${faites} / ${taches.length}</span>` : ''}</div>
      ${entieres.length ? `<div class="journee">${entieres.map(puce).join('')}</div>` : ''}
      <div class="defile" data-defile="jour">${grille([k])}</div>
      ${tiroir()}`;
  }

  function vueSemaine() {
    const l = lundiDe(U.date), auj = aujourdhui();
    const jours = Array.from({ length: 7 }, (_, i) => decaler(l, i));
    const entieres = jours.map(k => duJour(k).filter(o => o.el.debut == null));
    const aEntieres = entieres.some(e => e.length);
    return `
      <div class="sem-tete"><span></span>
        ${jours.map((k, i) => `<button type="button" class="jour-b${k === auj ? ' auj' : ''}" data-ouvrir-jour="${k}" data-focus="sj${k}"
            aria-label="${cap(fmt(k, { weekday: 'long', day: 'numeric', month: 'long' }))} : voir la journée">
          <span aria-hidden="true">${INITIALES[i]}</span><b aria-hidden="true">${parse(k).getDate()}</b></button>`).join('')}<span></span>
      </div>
      ${aEntieres ? `<div class="sem-journee"><span>jour</span>${entieres.map(e => `<div>${e.map(o =>
        `<button type="button" class="mini-puce${o.fait ? ' fait' : ''}" style="${styleEl(o.el)}" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}">${esc(o.el.titre)}</button>`).join('')}</div>`).join('')}<span></span></div>` : ''}
      <div class="defile semaine" data-defile="semaine">${grille(jours)}</div>
      ${tiroir()}`;
  }

  // ---------- Listes ----------
  function ligneOcc(o) {
    const el = o.el;
    const heures = el.debut == null ? '<span class="heures">Journée</span>' : `<span class="heures">${hhmm(el.debut)}<small>${hhmm(el.fin)}</small></span>`;
    const p = S.payes[o.cle];
    const details = (el.type === 'libre' ? ['Pour moi', ETAT_LIBRE[etatLibre(o)]] : [cat(el.cat).nom, el.type === 'evenement' ? 'Événement' : ''])
      .concat([el.rep ? REPET[el.rep.freq] : '', p && p.pts && el.type === 'tache' ? '+' + p.pts + ' pts' : '']).filter(Boolean).join(' · ');
    return `<div class="ligne-occ${o.fait ? ' fait' : ''}" style="${styleEl(el)}">
      <span class="marque">${el.type === 'tache' ? caseTache(o) : `<i aria-hidden="true"${el.type === 'libre' ? ' class="m-libre"' : ''}></i>`}</span>
      <button type="button" class="ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}">${heures}
        <span class="quoi"><b>${esc(el.titre)}</b><small>${esc(details)}</small></span></button>
    </div>`;
  }
  const nomJour = k => {
    const auj = aujourdhui();
    const base = fmt(k, { weekday: 'long', day: 'numeric', month: 'long' });
    return k === auj ? "Aujourd'hui · " + base : k === decaler(auj, 1) ? 'Demain · ' + base : base;
  };

  function vueMois() {
    const k = U.date, auj = aujourdhui();
    const premier = k.slice(0, 8) + '01';
    const depart = lundiDe(premier);
    const cases = [];
    for (let i = 0; i < 42; i++) {
      const d = decaler(depart, i);
      if (i === 35 && d.slice(0, 7) !== k.slice(0, 7)) break;      // 5 semaines suffisent
      const occs = duJour(d);
      const couleurs = [...new Set(occs.map(o => couleurEl(o.el)))].slice(0, 3);
      cases.push(`<button type="button" class="${d.slice(0, 7) !== k.slice(0, 7) ? 'autre' : ''}${d === auj ? ' auj' : ''}" data-choisir="${d}" aria-pressed="${d === k}" data-focus="m${d}"
          aria-label="${cap(fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }))}${d === auj ? ", aujourd'hui" : ''}${occs.length ? ', ' + occs.length + ' élément' + (occs.length > 1 ? 's' : '') : ''}">
        <b aria-hidden="true">${parse(d).getDate()}</b><span class="points-jour" aria-hidden="true">${couleurs.map(c => `<i style="--c:${c}"></i>`).join('')}</span></button>`);
    }
    const occs = duJour(k);
    return `<div class="defile" data-defile="mois">
      <div class="mois">
        <div class="mois-tete" aria-hidden="true">${INITIALES.map(l => `<span>${l}</span>`).join('')}</div>
        <div class="mois-grille">${cases.join('')}</div>
      </div>
      <div class="mois-jour">
        <h2 class="titre-jour${k === auj ? ' auj' : ''}"><span>${esc(nomJour(k))}</span><button type="button" class="lien" style="font-size:13px;min-height:0;padding:0" data-ouvrir-jour="${k}" data-focus="voirjour">Voir la journée</button></h2>
        ${occs.length ? occs.map(ligneOcc).join('') : `<p class="vide">Rien de prévu.</p>`}
      </div>
      <div class="bas-espace"></div>
    </div>${boutonPlus()}`;
  }

  function vueListe() {
    const auj = aujourdhui();
    const retard = enAttente();
    let h = sectionRetard(retard) + sectionCaser(), total = S.acaser.length + retard.length;
    for (let i = 0; i < CONFIG.joursListe; i++) {
      const k = decaler(auj, i);
      const occs = duJour(k);
      if (!occs.length && i > 0) continue;
      total += occs.length;
      const t = occs.filter(o => o.el.type === 'tache');
      h += `<section aria-label="${esc(nomJour(k))}"><h2 class="titre-jour${k === auj ? ' auj' : ''}"><span>${esc(nomJour(k))}</span>${t.length ? `<small>${t.filter(o => o.fait).length} / ${t.length}</small>` : ''}</h2>
        ${occs.length ? occs.map(ligneOcc).join('') : '<p class="vide">Rien de prévu aujourd\'hui.</p>'}</section>`;
    }
    if (!total) h += `<div class="vide"><p>Rien de prévu pour les ${CONFIG.joursListe} prochains jours.</p><button type="button" class="bouton" data-action="ajouter" data-focus="ajouter-vide">Ajouter</button></div>`;
    return `<div class="defile" data-defile="liste">${h}<div class="bas-espace"></div></div>${boutonPlus()}`;
  }

  // ---------- À caser ----------
  const dureeTexte = m => m < 60 ? `${m} min` : duree(m);
  const puceCaser = x => `<div role="listitem"><button type="button" class="puce-caser" data-caser="${x.id}" style="${styleCat(x.cat)}" data-focus="pc${x.id}"
      aria-label="${esc(x.titre)}, ${dureeTexte(x.duree)}, ${esc(cat(x.cat).nom)} : la caser"><b>${esc(x.titre)}</b><small>${dureeTexte(x.duree)} · ${esc(cat(x.cat).nom)}</small></button></div>`;
  const listeCaser = () => S.acaser.length ? S.acaser.map(puceCaser).join('')
    : '<p class="note" role="listitem">Rien à caser. Note ici ce qui n\'a pas encore de créneau.</p>';
  const formAjout = () => `<form class="ajout-rapide" data-form="acaser"><label class="masque" for="acaser-nom-${U.vue}">Nouvelle tâche à caser</label>
      <input id="acaser-nom-${U.vue}" name="nouvelle" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="Une tâche à caser…" data-focus="acaser-nom">
      <button type="submit" class="bouton clair">Ajouter</button></form>`;
  function tiroir() {
    return `<div class="tiroir${U.tiroir ? ' ouvert' : ''}">
      ${boutonPlus()}
      <div class="tiroir-contenu" id="tiroir-contenu"${U.tiroir ? '' : ' hidden'}>
        ${formAjout()}
        <div class="caser-liste" role="list" aria-label="Tâches à caser" id="caser-liste">${listeCaser()}</div>
        ${S.acaser.length ? '<p class="note">Maintiens une tâche puis glisse-la dans la grille, ou touche-la pour choisir son créneau.</p>' : ''}
      </div>
      <button type="button" class="tiroir-barre" data-action="tiroir" aria-expanded="${!!U.tiroir}" aria-controls="tiroir-contenu" data-focus="tiroir">
        <span>À caser</span><b aria-label="${S.acaser.length} tâche${S.acaser.length > 1 ? 's' : ''}">${S.acaser.length}</b><i aria-hidden="true">▲</i></button>
    </div>`;
  }
  function sectionRetard(liste) {
    if (!liste.length) return '';
    return `<section class="section-caser section-retard" aria-label="Pas faites">
      <h2 class="titre-jour"><span>Pas faites · ${liste.length}</span><button type="button" class="lien fort" data-action="decider" data-focus="decider">Décider</button></h2>
      ${liste.map(o => `<div class="ligne-occ" style="${styleEl(o.el)}">
        <span class="marque">${caseTache(o)}</span>
        <button type="button" class="ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}, pas faite" data-focus="o${o.cle}">
          <span class="heures">${esc(nomCourt(o.k))}<small>${o.el.debut == null ? 'journée' : hhmm(o.el.debut)}</small></span>
          <span class="quoi"><b>${esc(o.el.titre)}</b><small>${esc(cat(o.el.cat).nom)} · pas faite</small></span></button>
      </div>`).join('')}
    </section>`;
  }
  function sectionCaser() {
    const lignes = S.acaser.map(x => `<div class="ligne-occ" style="${styleCat(x.cat)}">
        <span class="marque"><i aria-hidden="true"></i></span>
        <button type="button" class="ouvrir" data-caser-ouvrir="${x.id}" aria-label="${esc(x.titre)}, ${dureeTexte(x.duree)}, à caser : ouvrir" data-focus="co${x.id}">
          <span class="heures">${dureeTexte(x.duree)}</span><span class="quoi"><b>${esc(x.titre)}</b><small>${esc(cat(x.cat).nom)} · à caser</small></span></button>
        <button type="button" class="bouton clair petit" data-caser-auto="${x.id}" data-focus="ca${x.id}" aria-label="Caser « ${esc(x.titre)} » au prochain créneau libre">Caser</button>
      </div>`).join('');
    return `<section class="section-caser" aria-label="À caser"><h2 class="titre-jour"><span>À caser</span><small>${S.acaser.length}</small></h2>
      ${formAjout()}${lignes}</section>`;
  }
  // Met à jour la liste du tiroir sans tout redessiner (le clavier de l'iPhone reste ouvert)
  function majTiroir() {
    const l = $('#caser-liste');
    if (!l) return render();
    l.innerHTML = listeCaser();
    const b = $('.tiroir-barre b');
    if (b) { b.textContent = S.acaser.length; b.setAttribute('aria-label', `${S.acaser.length} tâche${S.acaser.length > 1 ? 's' : ''}`); }
  }
  function ajouterACaser(titre, opts = {}) {
    const x = { id: uid(), titre: titre.slice(0, 120), cat: opts.cat || (S.categories.find(c => c.id === 'perso') || S.categories[0]).id, duree: opts.duree || CONFIG.duree, ajouteLe: Date.now() };
    S.acaser.push(x);
    return x;
  }
  // Premier créneau libre de cette durée, entre creneaux.debut et creneaux.fin, à partir de maintenant (14 jours)
  function prochainCreneau(d) {
    const auj = aujourdhui();
    for (let i = 0; i < 14; i++) {
      const k = decaler(auj, i);
      let t = Math.max(CONFIG.creneaux.debut, i === 0 ? Math.ceil((minNow() + 5) / 15) * 15 : 0);
      const occupe = duJour(k).filter(o => o.el.debut != null).map(o => [o.el.debut, o.el.fin]).sort((a, b) => a[0] - b[0]);
      for (const [a, b] of occupe) { if (a >= t + d) break; if (b > t) t = b; }
      if (t + d <= CONFIG.creneaux.fin) return { k, debut: t };
    }
    return null;
  }
  const quand = (k, debut, fin) => `${k === aujourdhui() ? "aujourd'hui" : k === decaler(aujourdhui(), 1) ? 'demain' : fmt(k, { weekday: 'long', day: 'numeric', month: 'long' })}, ${hhmm(debut)} – ${hhmm(fin)}`;
  // Pose une tâche à caser dans le calendrier. Elle compte comme planifiée maintenant.
  function placer(id, k, debut) {
    const x = S.acaser.find(y => y.id === id);
    if (!x) return null;
    debut = borne(debut, 0, 1440 - Math.min(x.duree, 1440));
    const el = { id: uid(), type: 'tache', titre: x.titre, cat: x.cat, date: k, debut, fin: Math.min(debut + x.duree, 1440), rep: null, exceptions: {}, faits: {}, creeLe: Date.now() };
    S.elements.push(el);
    S.acaser = S.acaser.filter(y => y !== x);
    sauver();
    const cle = el.id + '|' + k;
    U.selection = null; U.brouillon = null;
    if (U.vue === 'jour' && k !== U.date) U.date = k;
    if (U.vue === 'semaine' && lundiDe(k) !== lundiDe(U.date)) U.date = k;
    render();
    const o = trouver(cle);
    if (!avertir(cle)) dire(`« ${x.titre} » casée : ${quand(k, el.debut, el.fin)}.${o && !prevue(o) ? ' Déjà commencée : pas de points.' : ''}`);
    return cle;
  }

  const boutonPlus = () => `<button type="button" class="plus" data-action="ajouter" aria-label="Ajouter une tâche ou un événement" data-focus="plus">${ICONE.plus}</button>`;

  // ---------- Rendu ----------
  function signatureFocus() {
    const a = document.activeElement;
    return a && a.dataset && a.dataset.focus ? a.dataset.focus : null;
  }
  function render(focus) {
    const f = focus || signatureFocus();
    const ancien = $('#vue .defile');
    if (ancien) U.defile[ancien.dataset.defile] = ancien.scrollTop;
    if (U.recentrer) { U.defile = {}; U.recentrer = false; }       // revenir à l'heure actuelle
    if (U.haut) { delete U.defile.mois; U.haut = false; }          // nouveau mois : en haut
    renderHaut();
    $('#vue').innerHTML = rappel() + { jour: vueJour, semaine: vueSemaine, mois: vueMois, liste: vueListe }[U.vue]();
    U.reaction = false;
    const d = $('#vue .defile');
    if (d) {
      const v = d.dataset.defile;
      if (U.defile[v] != null) d.scrollTop = U.defile[v];
      else if (v === 'jour' || v === 'semaine') {
        const sur = v === 'jour' ? U.date === aujourdhui() : lundiDe(U.date) === lundiDe(aujourdhui());
        // Aujourd'hui : l'heure pleine d'avant, moins une heure ; sinon l'heure d'ouverture
        d.scrollTop = Math.max(0, (sur ? Math.min(Math.floor(minNow() / 60) * 60 - 60, 16 * 60) : CONFIG.ouverture * 60) / 60 * H);
      }
    }
    if (f) { const c = document.querySelector(`[data-focus="${CSS.escape(f)}"]`); if (c) c.focus({ preventScroll: true }); }
  }

  let minuteurToast;
  function dire(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('visible');
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => t.classList.remove('visible'), 2600);
  }

  // ---------- Navigation ----------
  function changerVue(v) {
    U.vue = v; S.vue = v; U.selection = null; U.brouillon = null;
    sauver(); render();
  }
  function naviguer(sens) {
    U.selection = null; U.brouillon = null;
    if (U.vue === 'jour') U.date = decaler(U.date, sens);
    else if (U.vue === 'semaine') U.date = decaler(U.date, 7 * sens);
    else if (U.vue === 'mois') { U.date = moisPlus(U.date, sens); U.haut = true; }
    render();
  }
  function allerA(k, vue) {
    U.date = k; U.selection = null; U.brouillon = null;
    if (vue && vue !== U.vue) { U.vue = vue; S.vue = vue; sauver(); }
    render();
  }

  // ---------- Questions (remplace confirm) ----------
  function demander(titreQ, texte, options) {
    return new Promise(resoudre => {
      const d = $('#question');
      $('#q-titre').textContent = titreQ;
      $('#q-texte').textContent = texte;
      $('#q-choix').innerHTML = options.map((o, i) => `<button type="button" class="bouton${o.clair ? ' clair' : ''}" data-q="${i}">${esc(o.texte)}</button>`).join('');
      let rendu = null;
      const fin = () => { d.removeEventListener('close', fin); resoudre(rendu); };
      d.addEventListener('close', fin);
      $('#q-choix').onclick = e => { const b = e.target.closest('[data-q]'); if (!b) return; rendu = options[+b.dataset.q].valeur; d.close(); };
      d.showModal();
    });
  }
  const demanderPortee = (action) => demander('Élément répété', `${action} seulement cette fois, ou celle-ci et toutes les suivantes ?`, [
    { texte: 'Cette fois seulement', valeur: 'une' },
    { texte: 'Celle-ci et les suivantes', valeur: 'suivantes' },
    { texte: 'Annuler', valeur: null, clair: true }
  ]);

  // ---------- Cocher ----------
  function cocher(cle) {
    const o = trouver(cle);
    if (!o || o.el.type !== 'tache') return;
    const msg = basculer(o);
    sauver();
    render();
    dire(msg);
    grandir();
  }
  // Nouveau stade : on le dit
  function grandir() {
    if (!U.grandi) return;
    dire(`Guts grandit : ${U.grandi.nom} !`);
    U.grandi = null;
  }
  // Une tâche ou un événement posé sur un temps pour moi : on prévient
  function avertir(cle) {
    const o = trouver(cle);
    if (!o || o.el.type === 'libre' || o.el.debut == null || finOcc(o) <= Date.now()) return false;
    const l = duJour(o.k).find(x => x.el.type === 'libre' && x.el.debut < o.el.fin && x.el.fin > o.el.debut && !S.payes[x.cle]);
    if (!l) return false;
    dire(`Attention : ça empiète sur « ${l.el.titre} » (${hhmm(l.el.debut)} – ${hhmm(l.el.fin)}).`);
    return true;
  }

  // ---------- Éditeur ----------
  const ED = $('#editeur'), FORM = $('#form-ed');

    U.edition.depart = m;
    U.edition.duree = m.debut == null ? CONFIG.duree : m.fin - m.debut;
    FORM.reset();
    champ('type').value = m.type;

    champ('journee').checked = m.debut == null;
    champ('date').value = m.date;
    champ('debut').value = hhmm(m.debut == null ? 9 * 60 : m.debut);

    $('#ed-cats').innerHTML = S.categories.map(c => `<label style="--c:${c.couleur}"><input type="radio" name="cat" value="${esc(c.id)}"${c.id === (cat(m.cat).id) ? ' checked' : ''}><i aria-hidden="true"></i>${esc(c.nom)}</label>`).join('');

  function majEditeur() {
    const journee = champ('journee').checked;

    document.querySelectorAll('#editeur .horaire').forEach(r => r.classList.toggle('cache', journee));
    const rep = !!champ('rep').value;
    $('#ed-jusqua').classList.toggle('cache', !rep);

    const libre = type === 'libre';
    $('#ed-acaser').hidden = !(type === 'tache' && U.edition && U.edition.peutCaser && !champ('rep').value);
    $('#ed-fait').hidden = !(type === 'tache' && U.edition && U.edition.o);
    // Un temps pour moi a toujours des heures et pas de catégorie
    $('#ed-journee').classList.toggle('cache', libre);
    if (libre && journee) { champ('journee').checked = false; return majEditeur(); }
    $('#ed-cat-zone').hidden = libre;

    $('#ed-regle').textContent = {
      tache: `Rapporte ${CONFIG.points.tache} pts une fois faite, si elle est prévue avant son début.`,

      libre: `Rapporte ${CONFIG.points.libre} pts si rien d'autre n'est prévu sur ce créneau jusqu'à la fin (${CONFIG.points.libreMin} min au moins, ${CONFIG.points.libresParJour} par jour).`

  FORM.addEventListener('input', e => {
    // Changer le début garde la durée, comme l'app Calendrier ; changer la fin règle la durée
    const n = e.target.name;

      const d = versMin(champ('debut').value), f0 = versMin(champ('fin').value);
      if (n === 'debut' && d != null && U.edition.duree > 0) champ('fin').value = hhmm(Math.min(d + U.edition.duree, 1440) % 1440);
      else if (n === 'fin' && d != null && f0 != null) { const f = f0 === 0 ? 1440 : f0; if (f > d) U.edition.duree = f - d; }
    }

  FORM.addEventListener('change', majEditeur);

  function lireFormulaire() {
    const libre = champ('type').value === 'libre';
    const titre = champ('titre').value.trim() || (libre ? LIBRE.titre : '');
    if (!titre) return { erreur: 'Donne un titre.', champ: champ('titre') };
    if (!champ('date').value) return { erreur: 'Choisis une date.', champ: champ('date') };
    const journee = champ('journee').checked && !libre;
    let debut = null, fin = null;
    if (!journee) {
      debut = versMin(champ('debut').value); fin = versMin(champ('fin').value);
      if (debut == null || fin == null) return { erreur: 'Indique le début et la fin.', champ: champ('debut') };
      if (fin === 0 && debut > 0) fin = 1440;              // « 00:00 » en fin = minuit
      if (fin <= debut) return { erreur: 'La fin doit être après le début.', champ: champ('fin') };
    }
    const freq = champ('rep').value;
    const jusqua = freq && champ('jusqua').value ? champ('jusqua').value : null;
    if (jusqua && jusqua < champ('date').value) return { erreur: "« Jusqu'au » doit venir après la date.", champ: champ('jusqua') };
    const c = FORM.querySelector('input[name="cat"]:checked');
    const type = ['evenement', 'libre'].includes(champ('type').value) ? champ('type').value : 'tache';
    return { champs: { type, titre, date: champ('date').value, debut, fin, rep: freq ? { freq, jusqua } : null, cat: c ? c.value : S.categories[0].id }, fait: champ('fait').checked };
  }
  const memeRep = (a, b) => (!a && !b) || (a && b && a.freq === b.freq && (a.jusqua || null) === (b.jusqua || null));

  FORM.addEventListener('submit', async e => {
    e.preventDefault();

    if (r.erreur) { $('#ed-erreur').textContent = r.erreur; r.champ.focus(); return; }
    const o = U.edition.o;
    let cle;
    if (!o) {
      const el = Object.assign({ id: uid(), exceptions: {}, faits: {}, creeLe: Date.now() }, r.champs);
      S.elements.push(el);
      cle = el.id + '|' + el.date;
      const n = trouver(cle);
      dire(el.type !== 'evenement' && n && !prevue(n) ? (el.type === 'tache' ? 'Tâche ajoutée. Déjà commencée : elle ne rapportera pas de points.' : 'Ajouté. Déjà commencé : pas de points cette fois.')
        : { tache: 'Tâche ajoutée.', evenement: 'Événement ajouté.', libre: 'Temps pour moi protégé.' }[el.type]);
    } else {
      let portee = 'une';
      if (o.el.rep) {
        if (!memeRep(o.el.rep, r.champs.rep)) portee = 'suivantes';
        else {

      cle = appliquer(o, champs, portee);
      // « Faite » dans le formulaire : appliquée à l'occurrence finale, avec ses points
      const n = trouver(cle);
      if (n && n.el.type === 'tache' && n.fait !== r.fait) dire(basculer(n));
    }
    avertir(cle);
    sauver();
    ED.close();
    U.brouillon = null;
    U.selection = null;
    const k = cle.slice(cle.lastIndexOf('|') + 1);
    if (U.vue !== 'liste' && k !== U.date && (U.vue === 'jour' || (U.vue === 'semaine' && lundiDe(k) !== lundiDe(U.date)) || (U.vue === 'mois' && k.slice(0, 7) !== U.date.slice(0, 7)))) U.date = k;

  RG.addEventListener('input', e => {
    const n = e.target.dataset.rcNom;

  });
  RG.addEventListener('change', e => {
    const opt = e.target.dataset.rapOpt;
    if (opt) {
      S.rappels[opt] = e.target.type === 'checkbox' ? e.target.checked : Number(e.target.value);

    if (e.target.hasAttribute('data-theme-choix')) { S.theme = e.target.value; sauver(); appliquerTheme(); return; }
    const id = e.target.dataset.rcCouleur;
    if (id != null) { const c = S.categories.find(x => x.id === id); if (c) { c.couleur = e.target.value; sauver(); const r = e.target.closest('.r-cat'); if (r) r.style.setProperty('--c', c.couleur); } }

  RG.addEventListener('click', async e => {

    if (!b) return;

      const c = cat(b.dataset.rcRetirer);
      const n = S.elements.filter(el => el.cat === c.id).length;
      const ok = await demander('Retirer « ' + c.nom + ' » ?', n ? `${n} élément${n > 1 ? 's passeront' : ' passera'} dans « ${S.categories.find(x => x.id !== c.id).nom} ».` : 'Aucun élément ne l\'utilise.',
        [{ texte: 'Retirer', valeur: true }, { texte: 'Annuler', valeur: false, clair: true }]);
      if (!ok) return;
      S.categories = S.categories.filter(x => x.id !== c.id);
      S.elements.forEach(el => { if (el.cat === c.id) el.cat = S.categories[0].id; });

    }

    if (a === 'fermer') { RG.close(); return; }
    if (a === 'ajouter-cat') {
      const libre = PALETTE.find(p => !S.categories.some(c => c.couleur === p.c)) || PALETTE[7];
      S.categories.push({ id: uid(), nom: 'Nouvelle', couleur: libre.c });
      sauver(); renderReglages();
      const champs = RG.querySelectorAll('[data-rc-nom]');
      const dernier = champs[champs.length - 1];

      return;

    if (a === 'exporter') { await exporter(); renderReglages(); return; }
    if (a === 'importer') $('#fichier-import').click();
  });
  RG.addEventListener('close', () => render());
  // Rappels : ces boutons ne passent par aucune attente avant l'appel (iOS n'accepte la demande d'autorisation que sur un toucher)
  RG.addEventListener('click', e => {
    const b = e.target.closest('[data-rap]');
    if (!b || b.disabled) return;
    if (b.dataset.rap === 'activer') activerRappels();
    if (b.dataset.rap === 'essai') essaiRappels();
    if (b.dataset.rap === 'couper') couperRappels();
  });

  // ---------- Sauvegarde dans un fichier ----------
  const contenuSauvegarde = () => JSON.stringify({ app: 'guts', version: VERSION, exporteLe: new Date().toISOString(), donnees: S });
  async function exporter() {
    const nom = `guts-${aujourdhui()}.json`;
    const blob = new Blob([contenuSauvegarde()], { type: 'application/json' });
    const tactile = window.matchMedia('(pointer: coarse)').matches;
    let fait = false;
    if (tactile && navigator.canShare) {
      const f = new File([blob], nom, { type: 'application/json' });
      if (navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f] }); fait = true; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
    }
    if (!fait) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    S.derniereExport = new Date().toISOString();
    sauver();
    dire('Sauvegarde créée : ' + nom);
  }
  $('#fichier-import').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    let x;
    try { x = JSON.parse(await f.text()); } catch (err) { dire("Ce fichier n'est pas une sauvegarde Guts."); return; }
    const d = x && x.app === 'guts' ? x.donnees : x;
    if (d && d.taches && typeof d.taches === 'object' && !Array.isArray(d.elements)) { await importerV14(d); return; }
    if (!d || !Array.isArray(d.elements)) { dire("Ce fichier n'est pas une sauvegarde du calendrier Guts."); return; }
    const ok = await demander('Restaurer cette sauvegarde ?', 'Elle remplacera tout ce qui est sur cet appareil.', [{ texte: 'Restaurer', valeur: true }, { texte: 'Annuler', valeur: false, clair: true }]);
    if (!ok) return;
    S = Object.assign(vide(), d);
    if (!S.depuis) S.depuis = aujourdhui();
    sauver();
    U.vue = S.vue || 'jour';
    renderReglages();
    render();
    dire('Sauvegarde restaurée.');
  });

  // ---------- Gestes sur la grille ----------
  // Souris : glisser sur un vide dessine une plage ; glisser une plage la déplace ; son bord bas la redimensionne.
  // Tactile : appui long sur un vide puis glisser dessine ; appui long sur une plage la soulève ; les poignées la redimensionnent.
  // Un toucher simple sur un vide pose une « Nouvelle » plage d'une heure, ajustable, à toucher pour la remplir.
  let G = null;
  const actif = () => G && ['creer', 'deplacer', 'redim', 'caser'].includes(G.mode);
  function sous(e) {
    const r = G.cols.getBoundingClientRect();
    const n = G.cols.children.length;
    const i = borne(Math.floor((e.clientX - r.left) / (r.width / n)), 0, n - 1);
    return { min: (e.clientY - r.top) / H * 60, k: G.cols.children[i].dataset.jour, col: G.cols.children[i] };
  }
  function cible(blocEl) {
    if (blocEl.dataset.brouillon) return Object.assign({ brouillon: true }, U.brouillon);
    const o = trouver(blocEl.dataset.cle);
    return o ? { o, k: o.k, debut: o.el.debut, fin: o.el.fin } : null;
  }
  function demarrer(mode) {
    G.mode = mode;
    clearTimeout(G.minuteur);
    try { G.cols.setPointerCapture(G.id); } catch (e) { /* déjà capturé */ }
    if (navigator.vibrate && G.tactile) { try { navigator.vibrate(8); } catch (e) { /* facultatif */ } }
    if (mode === 'creer') {
      const p = sous(G.depart);
      G.k = p.k;
      G.m0 = borne(Math.floor(p.min / CONFIG.pas) * CONFIG.pas, 0, 1440 - CONFIG.pas);
      G.vue = document.createElement('div');
      G.vue.className = 'bloc brouillon leve';
      G.vue.style.cssText = 'left:2px;width:calc(100% - 4px)';
      G.vue.innerHTML = '<span class="b-texte"><b>Nouvelle</b><small></small></span>';
      p.col.appendChild(G.vue);
      G.min0 = p.min;
      G.debut = G.m0; G.fin = Math.min(G.m0 + CONFIG.duree, 1440);
      majVue();
      return;
    }
    G.t = cible(G.blocEl);
    if (!G.t) { G.mode = 'libre'; return; }
    G.debut = G.t.debut; G.fin = G.t.fin; G.k = G.t.k;
    G.min0 = sous(G.depart).min;
    G.vue = G.blocEl;
    G.vue.classList.add('leve');
    if (mode === 'deplacer') { G.vue.style.left = '2px'; G.vue.style.width = 'calc(100% - 4px)'; }
  }
  function majVue() {
    const v = G.vue;
    v.style.top = G.debut / 60 * H + 'px';
    const h = Math.max((G.fin - G.debut) / 60 * H, 20);
    v.style.height = h + 'px';
    v.classList.toggle('court', h < 38);
    const s = v.querySelector('.b-texte small');
    if (s) s.textContent = `${hhmm(G.debut)} – ${hhmm(G.fin)}`;
  }
  function suivre(e, sansBord) {
    if (G.mode === 'caser') { suivreCaser(e); if (!sansBord) defilerBord(e); return; }
    const p = sous(e);
    if (G.mode === 'creer') {
      // Tant qu'on n'a pas bougé d'un quart d'heure, la plage garde la durée par défaut
      if (!G.bouge && Math.abs(p.min - G.min0) < CONFIG.pas) { G.debut = G.m0; G.fin = Math.min(G.m0 + CONFIG.duree, 1440); }
      else {
        G.bouge = true;
        const m = borne(caler(p.min), 0, 1440);
        if (m >= G.m0 + CONFIG.pas) { G.debut = G.m0; G.fin = m; }
        else if (m <= G.m0) { G.debut = m; G.fin = G.m0 + CONFIG.pas; }
        else { G.debut = G.m0; G.fin = G.m0 + CONFIG.pas; }
      }
    } else if (G.mode === 'deplacer') {
      const duree = G.t.fin - G.t.debut;
      G.debut = borne(caler(G.t.debut + p.min - G.min0), 0, 1440 - duree);
      G.fin = G.debut + duree;
      if (p.k !== G.k) { G.k = p.k; p.col.appendChild(G.vue); }
    } else if (G.mode === 'redim') {
      const m = borne(caler(p.min), 0, 1440);
      if (G.bord === 'haut') G.debut = Math.min(m, G.t.fin - CONFIG.pas);
      else G.fin = Math.max(m, G.t.debut + CONFIG.pas);
    }
    majVue();
    if (!sansBord) defilerBord(e);
  }
  // Défilement automatique quand on tire près du haut ou du bas
  let rafBord = null;
  function defilerBord(e) {
    const d = G.cols.closest('.defile');
    const r = d.getBoundingClientRect();
    // Depuis le tiroir, le doigt traverse le bas de la grille : pas de défilement avant d'y être vraiment entré
    if (G.mode === 'caser') {
      if (e.clientY > r.top + 40 && e.clientY < r.bottom - 40) G.entre = true;
      if (!G.entre) return;
    }
    const vitesse = e.clientY < r.top + 40 ? -8 : e.clientY > r.bottom - 40 ? 8 : 0;
    G.dernier = e;
    if (!vitesse) { cancelAnimationFrame(rafBord); rafBord = null; return; }
    if (rafBord) return;
    const pas = () => {
      if (!actif()) { rafBord = null; return; }
      const r2 = d.getBoundingClientRect();
      const v = G.dernier.clientY < r2.top + 40 ? -8 : G.dernier.clientY > r2.bottom - 40 ? 8 : 0;
      if (!v) { rafBord = null; return; }
      d.scrollTop += v;
      suivre(G.dernier, true);
      rafBord = requestAnimationFrame(pas);
    };
    rafBord = requestAnimationFrame(pas);
  }

  async function terminer() {
    const g = G;
    G = null;
    cancelAnimationFrame(rafBord); rafBord = null;
    U.avaler = Date.now();
    if (g.mode === 'caser') {
      g.fantome.remove();
      if (g.apercu) { g.apercu.remove(); placer(g.caser, g.k, g.debut); }
      else render();
      return;
    }
    if (g.mode === 'creer') {
      g.vue.remove();
      U.brouillon = { k: g.k, debut: g.debut, fin: g.fin };
      U.selection = null;
      ouvrirEditeur(null, { date: g.k, debut: g.debut, fin: g.fin });
      render();
      return;
    }
    const t = g.t;
    const change = g.debut !== t.debut || g.fin !== t.fin || g.k !== t.k;
    if (t.brouillon) {
      U.brouillon = { k: g.k, debut: g.debut, fin: g.fin };
      render();
      return;
    }
    if (!change) {
      if (g.tactile) U.selection = t.o.cle;      // appui long sans bouger : la plage reste choisie, poignées visibles
      render();
      return;
    }
    let portee = 'une';
    if (t.o.el.rep) { portee = await demanderPortee('Déplacer'); if (!portee) { render(); return; } }
    const cle = appliquer(t.o, { date: g.k, debut: g.debut, fin: g.fin }, portee);
    sauver();
    U.selection = g.tactile ? cle : null;
    render();
    if (!avertir(cle)) dire(`${t.o.el.titre} : ${hhmm(g.debut)} – ${hhmm(g.fin)}`);
  }

  const VUE = $('#vue');
  VUE.addEventListener('pointerdown', e => {
    if (G || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('.case')) return;
    const tactile = e.pointerType !== 'mouse';
    const puceC = e.target.closest('[data-caser]');
    if (puceC) {   // puce « À caser » : appui long (ou glisser à la souris) pour l'emmener dans la grille
      G = { id: e.pointerId, depart: e, x0: e.clientX, y0: e.clientY, mode: 'attente', tactile, caser: puceC.dataset.caser, puceEl: puceC, sansBalayage: true };
      if (tactile) G.minuteur = setTimeout(() => { if (G && G.mode === 'attente') demarrerCaser(); }, CONFIG.appuiLong);
      return;
    }
    const cols = e.target.closest('.colonnes');
    if (!cols) {   // ailleurs dans la feuille : seul le balayage horizontal compte
      G = { id: e.pointerId, depart: e, x0: e.clientX, y0: e.clientY, mode: 'attente', libreSeul: true, tactile, sansBalayage: !!e.target.closest('.tiroir') };
      return;
    }
    const poignee = e.target.closest('[data-bord]');
    const blocEl = e.target.closest('.bloc');
    G = { id: e.pointerId, cols, depart: e, x0: e.clientX, y0: e.clientY, tactile, blocEl, mode: 'attente' };
    // Plage déjà choisie (ou nouvelle plage) : on peut la tirer tout de suite, sans appui long
    G.direct = !!(blocEl && (blocEl.classList.contains('choisi') || blocEl.dataset.brouillon));
    if (poignee && blocEl && (poignee.classList.contains('poignee') || !tactile)) {
      G.bord = poignee.dataset.bord;
      demarrer('redim');
      e.preventDefault();
      return;
    }
    if (tactile && !G.direct) G.minuteur = setTimeout(() => { if (G && G.mode === 'attente') demarrer(blocEl ? 'deplacer' : 'creer'); }, CONFIG.appuiLong);
  });
  window.addEventListener('pointermove', e => {
    if (!G || e.pointerId !== G.id) return;
    const dist = Math.hypot(e.clientX - G.x0, e.clientY - G.y0);
    if (G.mode === 'attente') {
      if (G.caser) {
        if (!G.tactile && dist > 5) demarrerCaser();
        else { if (dist > 10) { clearTimeout(G.minuteur); G.mode = 'libre'; } return; }
      }
      else if (G.direct && dist > 5) demarrer('deplacer');
      else if (G.libreSeul || G.tactile) { if (dist > 10) { clearTimeout(G.minuteur); G.mode = 'libre'; } return; }
      else if (dist > 5) demarrer(G.blocEl ? 'deplacer' : 'creer');
      else return;
    }
    if (actif()) { e.preventDefault(); suivre(e); }
  });
  window.addEventListener('pointerup', e => {
    if (!G || e.pointerId !== G.id) return;
    clearTimeout(G.minuteur);
    if (actif()) { terminer(); return; }
    // Balayage horizontal : jour, semaine ou mois voisin
    const dx = e.clientX - G.x0, dy = e.clientY - G.y0;
    const g = G; G = null;
    if (g.tactile && g.mode === 'libre' && !g.sansBalayage && Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy) && U.vue !== 'liste') {
      U.avaler = Date.now();
      naviguer(dx < 0 ? 1 : -1);
    }
  });
  window.addEventListener('pointercancel', e => {
    if (!G || e.pointerId !== G.id) return;
    clearTimeout(G.minuteur);
    const etait = actif();
    if (G.mode === 'creer' && G.vue) G.vue.remove();
    if (G.mode === 'caser') { G.fantome.remove(); if (G.apercu) G.apercu.remove(); }
    G = null;
    if (etait) render();
  });
  function demarrerCaser() {
    const x = S.acaser.find(y => y.id === G.caser);
    G.cols = $('#vue .colonnes');
    if (!x || !G.cols) { G.mode = 'libre'; return; }
    G.mode = 'caser';
    G.x = x;
    clearTimeout(G.minuteur);
    if (navigator.vibrate && G.tactile) { try { navigator.vibrate(8); } catch (e) { /* facultatif */ } }
    G.puceEl.classList.add('prise');
    G.fantome = document.createElement('div');
    G.fantome.className = 'fantome';
    G.fantome.setAttribute('style', styleCat(x.cat));

    document.body.appendChild(G.fantome);
    suivreCaser(G.depart);

  // Au-dessus de la grille : aperçu de la plage à l'heure visée ; ailleurs : la puce suit le doigt
  function suivreCaser(e) {
    const f = G.fantome;
    f.style.left = e.clientX + 'px';
    f.style.top = e.clientY + 'px';
    const d = G.cols.closest('.defile').getBoundingClientRect(), c = G.cols.getBoundingClientRect();
    const dessus = e.clientY >= d.top && e.clientY <= d.bottom && e.clientX >= c.left && e.clientX <= c.right;
    f.classList.toggle('cache', dessus);
    if (!dessus) { if (G.apercu) { G.apercu.remove(); G.apercu = null; } return; }
    const p = sous(e);
    const duree = Math.min(G.x.duree, 1440);
    G.debut = borne(caler(p.min - 10), 0, 1440 - duree);
    G.k = p.k;

    }
    if (G.apercu.parentNode !== p.col) p.col.appendChild(G.apercu);
    G.apercu.style.top = G.debut / 60 * H + 'px';
    const h = Math.max(duree / 60 * H, 20);

  }

  // Un nouvel appui ou une touche du clavier : plus de clic à ignorer
  document.addEventListener('pointerdown', () => { U.avaler = 0; }, true);

  // Empêche la page de défiler pendant un geste (Safari)

  // ---------- Clics ----------
  document.addEventListener('click', e => {
    if (e.target.closest('dialog')) return;

    const b = e.target.closest('button, .colonne');
    if (!b) return;
    const d = b.dataset;
    if (d.vue) return changerVue(d.vue);
    if (d.nav) return naviguer(+d.nav);
    if (d.saut) { U.date = decaler(U.date, +d.saut); U.selection = null; U.brouillon = null; return render(); }
    if (d.aller) return allerA(d.aller);
    if (d.choisir) { U.date = d.choisir; return render(); }
    if (d.ouvrirJour) return allerA(d.ouvrirJour, 'jour');
    if (d.cocher) return cocher(d.cocher);
    if (d.ouvrir) {
      const o = trouver(d.ouvrir);
      if (!o) return;
      if (U.selection && U.selection !== o.cle) { U.selection = null; }
      U.brouillon = null;
      return ouvrirEditeur(o);
    }
    if (d.action === 'remplir' && U.brouillon) return ouvrirEditeur(null, { date: U.brouillon.k, debut: U.brouillon.debut, fin: U.brouillon.fin });
    if (d.action === 'ajouter') {
      const auj = aujourdhui();
      const k = U.vue === 'liste' ? auj : U.date;
      const debut = k === auj ? Math.min(Math.ceil((minNow() + 1) / 60) * 60, 23 * 60) : 9 * 60;
      return ouvrirEditeur(null, { date: k, debut, fin: debut + CONFIG.duree });
    }
    if (d.action === 'aujourdhui') { U.recentrer = true; return allerA(aujourdhui()); }
    if (d.action === 'reglages') { renderReglages(); RG.showModal(); return; }
    if (d.action === 'guts') return ouvrirGuts();
    if (d.action === 'sauvegarder') return exporter().then(() => render());
    if (d.action === 'plus-tard') { S.rappelVu = aujourdhui(); sauver(); return render('plus'); }
    if (d.action === 'tiroir') { U.tiroir = !U.tiroir; return render('tiroir'); }
    if (d.caser) return ouvrirCaser(d.caser);
    if (d.caserOuvrir) return ouvrirCaser(d.caserOuvrir);
    if (d.caserAuto) return caserAuto(d.caserAuto);
    if (d.action === 'decider') return ouvrirRetard();
    if (b.classList.contains('colonne')) {
      // Toucher un vide : enlève la sélection, ou pose une nouvelle plage d'une heure
      if (U.selection || U.brouillon) { U.selection = null; U.brouillon = null; return render(); }
      const r = b.getBoundingClientRect();
      const m = borne(Math.floor((e.clientY - r.top) / H * 60 / 30) * 30, 0, 1440 - CONFIG.duree);
      U.brouillon = { k: b.dataset.jour, debut: m, fin: m + CONFIG.duree };
      return render();
    }
  });

  // Saisie rapide d'une tâche à caser (tiroir ou Liste)
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-form="acaser"]');

  // Clavier : flèches gauche et droite pour changer de jour, de semaine ou de mois
