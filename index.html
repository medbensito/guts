<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guts</title>
<meta name="description" content="Guts, ton calendrier avec un renard qui protège ton temps libre.">
<meta name="theme-color" content="#0c1433">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<script>
  try {
    var t = (JSON.parse(localStorage.getItem('guts-cal-v1')) || {}).theme;
    document.documentElement.dataset.theme = t === 'clair' || t === 'sombre' ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair');
  } catch (e) { /* le script principal s'en chargera */ }
</script>
<style>
  :root {
    --bg: #0c1433; --bleu: #4f7cff; --bleu-fond: #3b63e6; --rouge: #ff4d5e; --rouge-fond: #d92636;
    --creme: #fff4ea; --papier: #fffaf4; --noir: #0a0f26; --cyan: #7ef0ff; --or: #ffd66b; --doux: #8d99cc;
    --ligne: #ece3d8; --ligne-forte: #d8ccbe; --gris: #5d627c;
    /* Rôles sur la feuille et dans les feuilles de saisie : redéfinis pour le thème sombre */
    --encre: #0a0f26;          /* texte */
    --trait: #0a0f26;          /* contour des champs et des puces */
    --bord-fort: #0a0f26;      /* séparations épaisses */
    --champ: #fff; --champ-2: #f3ece3; --fait: #f1ebe3; --tiroir: #fff4ea; --interrupteur: #d8d1c8;
    --encre-bloc: #43475e;     /* petit texte dans les plages teintées */
    --rouge-texte: #d92636; --bleu-texte: #3b63e6; --focus: #3b63e6;
    --libre-a: #e3fbff; --libre-b: #cdf5fc; --libre-texte: #1d5763; --grignote-texte: #a51c29;
    --brouillon-a: #fff; --brouillon-b: #f3ece3; --auj-fond: rgba(217, 38, 54, .035);
    color-scheme: light;
    --H: 56px;              /* hauteur d'une heure dans la grille */
    --gouttiere: 46px;      /* colonne des heures */
  }
  /* ---------- Thème sombre ---------- */
  :root[data-theme="sombre"] {
    --papier: #121a3c; --encre: #eef1ff; --trait: #7d88c4; --bord-fort: #050816;
    --champ: #1b2450; --champ-2: #27315f; --fait: #1d2548; --tiroir: #18204a; --interrupteur: #3a4578;
    --ligne: #232c55; --ligne-forte: #3d4880; --gris: #a8b0da; --encre-bloc: #cdd3f2;
    --rouge-texte: #ff8590; --bleu-texte: #9db3ff; --focus: #7ef0ff;
    --libre-a: #123544; --libre-b: #17404f; --libre-texte: #a6ecf7; --grignote-texte: #ff9aa3;
    --brouillon-a: #1b2450; --brouillon-b: #222c5a; --auj-fond: rgba(255, 77, 94, .07);
    color-scheme: dark;
  }
  :root[data-theme="sombre"] .bloc, :root[data-theme="sombre"] .puce, :root[data-theme="sombre"] .mini-puce,
  :root[data-theme="sombre"] .puce-caser, :root[data-theme="sombre"] .fantome { background: var(--fond-s); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--creme); overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    background-image: repeating-linear-gradient(-45deg, transparent 0 22px, rgba(79,124,255,.08) 22px 24px); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
  .papier :focus-visible, dialog :focus-visible { outline-color: var(--focus); }
  .masque { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 860px; margin: 0 auto; }

  /* ---------- En-tête Guts ---------- */
  header.haut { flex: none; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; }
  .ligne1 { display: flex; align-items: center; gap: 10px; }
  .guts-mini { display: flex; align-items: center; gap: 4px; background: var(--bleu-fond); color: var(--creme); border: 3px solid var(--noir); text-align: left;
    box-shadow: 3px 3px 0 var(--noir); padding: 0 8px 0 0; height: 46px; flex: none; }
  .guts-mini svg { width: 46px; height: 46px; margin: -6px -2px 0 -4px; }
  .guts-mini:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--noir); }
  .guts-mini b.monte { display: inline-block; animation: monte-pts .7s ease-out; }
  @keyframes monte-pts { 30% { transform: scale(1.35); color: var(--or); } }
  .guts-mini b { font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; }
  .guts-mini small { display: block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  h1 { flex: 1; min-width: 0; margin: 0; font-size: 23px; line-height: 1; font-weight: 900; text-transform: uppercase; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 small { display: block; font-size: 11px; color: var(--doux); letter-spacing: .08em; margin-bottom: 3px; }
  .rond { width: 38px; height: 38px; flex: none; display: grid; place-items: center; background: var(--creme); color: var(--noir);
    border: 3px solid var(--noir); box-shadow: 3px 3px 0 var(--noir); padding: 0; }
  .rond:active, .pilule:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--noir); }
  .rond svg { width: 20px; height: 20px; }
  .ligne2 { display: flex; gap: 8px; margin-top: 12px; }
  .vues { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--creme); border: 3px solid var(--noir); box-shadow: 3px 3px 0 var(--noir); }
  .vues button { border: 0; border-left: 2px solid var(--noir); background: none; color: var(--noir); font-weight: 800; font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em; padding: 8px 0; min-height: 36px; }
  .vues button:first-child { border-left: 0; }
  .vues button[aria-selected="true"] { background: var(--rouge-fond); color: var(--creme); }
  .pilule { flex: none; background: var(--creme); color: var(--noir); border: 3px solid var(--noir); box-shadow: 3px 3px 0 var(--noir);
    font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 0 10px; min-height: 42px; }
  .pilule[disabled] { opacity: .45; cursor: default; }

  /* ---------- Feuille du calendrier ---------- */
  main.papier { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--papier); color: var(--encre);
    border-top: 3px solid var(--noir); position: relative; }
  /* Balayage horizontal possible sur la grille et les listes (la page ne défile que verticalement) */
  .defile, .bande, .sem-tete, .sem-journee, .jour-titre, .journee { touch-action: pan-y; }
  @media (min-width: 700px) { main.papier { border: 3px solid var(--noir); margin: 0 14px 14px; box-shadow: 6px 6px 0 var(--noir); } }
  .defile { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; overscroll-behavior: contain; }

  /* Bande de la semaine (vue Jour) */
  .bande { flex: none; display: grid; grid-template-columns: 26px repeat(7, 1fr) 26px; align-items: center; padding: 6px 2px 2px; border-bottom: 1px solid var(--ligne); }
  .fleche { border: 0; background: none; color: var(--gris); font-size: 22px; font-weight: 700; padding: 6px 0; line-height: 1; }
  .jour-b { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0 4px; color: var(--encre); }
  .jour-b span { font-size: 10px; font-weight: 700; color: var(--gris); text-transform: uppercase; }
  .jour-b b { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .jour-b.auj b { color: var(--rouge-texte); font-weight: 900; }
  .jour-b[aria-pressed="true"] b { background: var(--encre); color: var(--papier); }
  .jour-b.auj[aria-pressed="true"] b { background: var(--rouge-fond); color: var(--creme); }
  .jour-b i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .jour-b i.plein { background: var(--ligne-forte); }
  .jour-titre { flex: none; padding: 8px 14px 6px; font-weight: 800; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
  .jour-titre .compte { font-weight: 600; font-size: 12px; color: var(--gris); }

  /* Journée entière */
  .journee { flex: none; display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 8px 6px var(--gouttiere); position: relative; border-bottom: 1px solid var(--ligne); }
  .journee::before { content: "journée"; position: absolute; left: 4px; top: 9px; font-size: 10px; color: var(--gris); width: calc(var(--gouttiere) - 8px); text-align: right; }
  .puce { display: flex; align-items: center; gap: 6px; min-height: 30px; max-width: 100%; border-radius: 6px; background: var(--fond); border-left: 4px solid var(--c); padding: 0 8px 0 4px; font-size: 13px; font-weight: 600; }
  .puce .ouvrir { border: 0; background: none; padding: 4px 2px; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .puce.fait, :root[data-theme="sombre"] .puce.fait { background: var(--fait); }
  .puce.fait .ouvrir { text-decoration: line-through; color: var(--gris); }

  /* Grille horaire */
  .grille { position: relative; height: calc(24 * var(--H)); margin: 0; }
  .heure { position: absolute; left: 0; width: var(--gouttiere); padding-right: 6px; text-align: right; font-size: 11px; color: var(--gris);
    transform: translateY(-50%); font-variant-numeric: tabular-nums; pointer-events: none; }
  .trait-h { position: absolute; left: var(--gouttiere); right: 0; border-top: 1px solid var(--ligne); pointer-events: none; }
  .colonnes { position: absolute; left: var(--gouttiere); right: 4px; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
  .colonne { position: relative; border-left: 1px solid var(--ligne); }
  .colonne.auj { background: var(--auj-fond); }
  .maintenant { position: absolute; left: var(--gouttiere); right: 0; height: 0; border-top: 2px solid var(--rouge-fond); z-index: 3; pointer-events: none; }
  .maintenant span { position: absolute; right: 100%; top: -9px; background: var(--rouge-fond); color: var(--creme); font-size: 10px; font-weight: 800;
    padding: 2px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; margin-right: 1px; }
  .maintenant i { position: absolute; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--rouge-fond); margin-left: -4px; }

  /* Blocs */
  .bloc { position: absolute; border-radius: 6px; background: var(--fond); border-left: 4px solid var(--c); color: var(--encre);
    box-shadow: 0 0 0 1px var(--papier); overflow: hidden; z-index: 1; }
  .bloc .b-ouvrir { position: absolute; inset: 0; border: 0; background: none; padding: 0; width: 100%; z-index: 1; }
  .bloc .b-texte { position: relative; display: block; padding: 3px 5px 2px 5px; font-size: 12px; line-height: 1.25; pointer-events: none; z-index: 2; }
  .bloc .b-texte b { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; }
  .bloc .b-texte small { font-size: 11px; color: var(--encre-bloc); font-variant-numeric: tabular-nums; }   /* lisible sur toutes les teintes */
  .bloc.court .b-texte { display: flex; gap: 5px; white-space: nowrap; padding-top: 1px; }
  .bloc.court .b-texte b { flex: 0 1 auto; }
  .bloc.tache .b-texte { padding-left: 28px; }
  .bloc .case { position: absolute; left: 3px; top: 3px; z-index: 3; }
  .bloc.court .case { top: 50%; transform: translateY(-50%); }
  .bloc.fait .b-texte b { text-decoration: line-through; color: var(--gris); }
  .bloc.tache.fait, :root[data-theme="sombre"] .bloc.tache.fait { background: var(--fait); }
  /* Événements : couleur pleine et texte nuit, dans les deux thèmes */
  .bloc.evenement, :root[data-theme="sombre"] .bloc.evenement { background: var(--c); color: var(--noir); }
  .bloc.evenement .b-texte small { color: inherit; }
  .bloc.choisi, .bloc.brouillon { touch-action: none; }
  .bloc.choisi { box-shadow: 0 0 0 2px var(--encre), 3px 3px 0 2px var(--bord-fort); z-index: 4; overflow: visible; }
  .bloc.leve { box-shadow: 0 0 0 2px var(--encre), 6px 8px 0 2px rgba(10,15,38,.35); z-index: 6; opacity: .95; transition: none; }
  .bloc.brouillon, :root[data-theme="sombre"] .bloc.brouillon { background: repeating-linear-gradient(-45deg, var(--brouillon-a) 0 8px, var(--brouillon-b) 8px 16px); border: 2px dashed var(--encre); border-left-width: 2px; z-index: 5; overflow: visible; }
  .bloc.brouillon .b-texte b { color: var(--encre); }
  .semaine .bloc .b-texte b { overflow-wrap: break-word; text-overflow: clip; hyphens: auto; }
  /* Téléphone : colonnes étroites, titres seuls */
  @media (max-width: 600px) {
    .semaine .bloc .b-texte { font-size: 10px; padding: 2px 3px; }
    .semaine .bloc .b-texte small { display: none; }
    .semaine .bloc.etroit .b-texte b { white-space: nowrap; overflow-wrap: normal; }
    .semaine .bloc.etroit .b-texte { padding: 2px 1px 2px 2px; }
  }
  .semaine .bloc.tache .b-texte { padding-left: 3px; }
  .semaine .bloc.court .b-texte { padding-top: 0; }
  .poignee { position: absolute; z-index: 7; width: 44px; height: 30px; touch-action: none; }
  .poignee::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--papier); border: 3px solid var(--encre); }
  .poignee.haut { right: -14px; top: -15px; cursor: ns-resize; }
  .poignee.bas { left: -14px; bottom: -15px; cursor: ns-resize; }
  .bord { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; z-index: 3; cursor: ns-resize; display: none; }
  @media (pointer: fine) { .bord { display: block; } }

  /* Case à cocher ronde */
  .case { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--encre); background: var(--champ); color: var(--papier); padding: 0; display: grid; place-items: center; flex: none; }
  .case svg { width: 13px; height: 13px; opacity: 0; }
  .case[aria-checked="true"] { background: var(--encre); }
  .case[aria-checked="true"] svg { opacity: 1; }
  .case::before { content: ""; position: absolute; inset: -9px; }
  .case { position: relative; }

  /* Vue Semaine */
  .sem-tete { flex: none; display: grid; grid-template-columns: var(--gouttiere) repeat(7, 1fr) 4px; border-bottom: 1px solid var(--ligne); padding-top: 4px; }
  .sem-tete .jour-b b { width: 28px; height: 28px; font-size: 14px; }
  .sem-journee { flex: none; display: grid; grid-template-columns: var(--gouttiere) repeat(7, 1fr) 4px; border-bottom: 1px solid var(--ligne); min-height: 8px; }
  .sem-journee > div { border-left: 1px solid var(--ligne); padding: 2px 1px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sem-journee > span { font-size: 9px; color: var(--gris); text-align: right; padding: 4px 4px 0 0; }
  .mini-puce { display: block; width: 100%; border: 0; border-radius: 4px; background: var(--fond); border-left: 3px solid var(--c); font-size: 10px; font-weight: 600;
    text-align: left; padding: 2px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--encre); }
  .mini-puce.fait, :root[data-theme="sombre"] .mini-puce.fait { text-decoration: line-through; background: var(--fait); color: var(--gris); }

  /* Vue Mois */
  .mois { padding: 4px 6px 0; flex: none; }
  .mois-tete, .mois-grille { display: grid; grid-template-columns: repeat(7, 1fr); }
  .mois-tete span { text-align: center; font-size: 10px; font-weight: 700; color: var(--gris); text-transform: uppercase; padding: 4px 0; }
  .mois-grille button { border: 0; border-top: 1px solid var(--ligne); background: none; color: var(--encre); padding: 5px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; }
  .mois-grille button b { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .mois-grille button.autre b { color: var(--gris); font-weight: 400; }
  .mois-grille button.auj b { color: var(--rouge-texte); font-weight: 900; }
  .mois-grille button[aria-pressed="true"] b { background: var(--encre); color: var(--papier); }
  .mois-grille button.auj[aria-pressed="true"] b { background: var(--rouge-fond); color: var(--creme); }
  .points-jour { display: flex; gap: 3px; height: 6px; }
  .points-jour i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .mois-jour { border-top: 3px solid var(--bord-fort); margin-top: 4px; }

  /* Listes (Mois et Liste à venir) */
  .titre-jour { position: sticky; top: 0; z-index: 2; margin: 0; padding: 10px 14px 6px; background: var(--papier); font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--ligne); display: flex; justify-content: space-between; gap: 8px; }
  .titre-jour.auj { color: var(--rouge-texte); }
  .titre-jour small { font-weight: 700; color: var(--gris); text-transform: none; letter-spacing: 0; }
  .ligne-occ { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 14px; border-bottom: 1px solid var(--ligne); min-height: 56px; }
  .ligne-occ .marque { width: 22px; display: grid; place-items: center; flex: none; }
  .ligne-occ .marque i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); border: 2px solid var(--trait); }
  .ligne-occ .ouvrir { flex: 1; min-width: 0; display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px 0; color: var(--encre); }
  .ligne-occ .heures { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; border-right: 3px solid var(--c); padding-right: 8px; }
  .ligne-occ .heures small { display: block; font-weight: 500; color: var(--gris); }
  .ligne-occ .quoi { min-width: 0; }
  .ligne-occ .quoi b { display: block; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ligne-occ .quoi small { display: block; font-size: 12px; color: var(--gris); margin-top: 1px; }
  .ligne-occ.fait .quoi b { text-decoration: line-through; color: var(--gris); }
  .vide { padding: 22px 18px; color: var(--gris); font-size: 14px; text-align: center; }
  .vide button { margin-top: 10px; }
  .bouton { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; background: var(--rouge-fond); color: var(--creme);
    border: 3px solid var(--noir); box-shadow: 3px 3px 0 var(--noir); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .bouton.clair { background: var(--creme); color: var(--noir); }
  .bouton:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--noir); }

  /* Bouton + */
  .plus { position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 8; width: 58px; height: 58px; border-radius: 50%;
    background: var(--rouge-fond); color: var(--creme); border: 3px solid var(--noir); box-shadow: 4px 4px 0 var(--noir); display: grid; place-items: center; padding: 0; }
  .plus svg { width: 26px; height: 26px; }
  .plus:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--noir); }

  /* ---------- Tiroir « À caser » (vues Jour et Semaine) ---------- */
  .tiroir { flex: none; position: relative; z-index: 6; background: var(--tiroir); border-top: 3px solid var(--bord-fort); padding-bottom: env(safe-area-inset-bottom); }
  .tiroir .plus { bottom: auto; top: -33px; }
  .tiroir.ouvert .plus { top: -70px; }      /* tiroir ouvert : le + passe au-dessus, loin du champ de saisie */
  .tiroir-barre { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 46px; border: 0; background: none; padding: 0 92px 0 14px; color: var(--encre);
    font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; text-align: left; }
  .tiroir-barre b { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--encre); color: var(--papier); display: grid; place-items: center; font-size: 12px; }
  .tiroir-barre i { font-style: normal; font-size: 11px; transition: transform .15s; }
  .tiroir.ouvert .tiroir-barre i { transform: rotate(180deg); }
  .tiroir-contenu { padding: 10px 0 2px; border-bottom: 1px solid var(--ligne-forte); }
  .ajout-rapide { display: flex; gap: 8px; padding: 0 14px 0 14px; }
  .ajout-rapide input { flex: 1; min-width: 0; font: inherit; font-size: 16px; font-weight: 600; border: 2px solid var(--trait); border-radius: 10px; padding: 8px 10px; background: var(--champ); color: var(--encre); }
  .ajout-rapide .bouton { min-height: 40px; padding: 0 12px; font-size: 11px; box-shadow: 2px 2px 0 var(--noir); }
  .caser-liste { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px 10px; touch-action: pan-x; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .caser-liste::-webkit-scrollbar { display: none; }
  .puce-caser { flex: none; max-width: 190px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 10px 7px 9px; border: 2px solid var(--trait);
    border-left: 5px solid var(--c); border-radius: 8px; background: var(--fond); color: var(--encre); text-align: left; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .puce-caser b { font-size: 13px; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .puce-caser small { font-size: 11px; color: var(--encre-bloc); font-weight: 600; }
  .puce-caser.prise { opacity: .35; }
  .tiroir .note { padding: 0 14px 10px; font-size: 12px; }
  .fantome { position: fixed; z-index: 60; pointer-events: none; padding: 7px 10px; border: 2px solid var(--trait); border-left: 5px solid var(--c); border-radius: 8px;
    background: var(--fond); color: var(--encre); font-size: 13px; font-weight: 700; box-shadow: 4px 4px 0 var(--noir); transform: translate(-50%, -120%); white-space: nowrap; }
  .fantome.cache { display: none; }
  .ligne-occ .bouton.petit { min-height: 36px; padding: 0 10px; font-size: 11px; box-shadow: 2px 2px 0 var(--noir); flex: none; }
  .section-caser { border-bottom: 3px solid var(--bord-fort); }
  .section-caser .ajout-rapide { padding: 10px 14px; }
  .bas-espace { height: calc(env(safe-area-inset-bottom) + 84px); }

  /* Message bref */
  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%) translateY(-16px); opacity: 0; pointer-events: none;
    background: var(--noir); color: var(--creme); border: 2px solid var(--creme); padding: 10px 14px; font-size: 14px; font-weight: 700; max-width: calc(100% - 32px);
    transition: opacity .2s, transform .2s; z-index: 50; text-align: center; }
  .toast.visible { opacity: 1; transform: translateX(-50%); }

  /* ---------- Feuilles (formulaires) ---------- */
  dialog { border: 3px solid var(--noir); background: var(--papier); color: var(--encre); padding: 0; width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh;
    box-shadow: 0 -4px 0 var(--noir); }
  dialog::backdrop { background: rgba(10, 15, 38, .6); }
  dialog.feuille { margin: auto auto 0; border-bottom: 0; border-radius: 18px 18px 0 0; overflow: hidden; }
  dialog.feuille[open] { display: flex; flex-direction: column; animation: monte .22s ease-out; }
  @media (min-width: 600px) { dialog.feuille { margin: auto; border-bottom: 3px solid var(--noir); border-radius: 14px; box-shadow: 8px 8px 0 var(--noir); } }
  @keyframes monte { from { transform: translateY(40px); opacity: .4; } }
  dialog.question { max-width: 360px; margin: auto; border-radius: 14px; box-shadow: 6px 6px 0 var(--noir); padding: 18px; width: calc(100% - 32px); }
  dialog.question h2 { margin: 0 0 6px; font-size: 18px; font-weight: 900; }
  dialog.question p { margin: 0 0 14px; color: var(--gris); font-size: 14px; line-height: 1.4; }
  dialog.question .choix { display: grid; gap: 8px; }
  dialog.question .bouton { width: 100%; }
  .f-haut { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--ligne); }
  .f-haut h2 { margin: 0; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; text-align: center; }
  .lien { border: 0; background: none; color: var(--bleu-texte); font-weight: 700; font-size: 16px; padding: 10px 8px; justify-self: start; min-height: 44px; }
  .lien.fort { justify-self: end; color: var(--rouge-texte); font-weight: 900; }
  /* max-content : les rangées gardent leur hauteur quand la feuille déborde (sinon la carte de Guts s'écrase) */
  .f-corps { overflow-y: auto; padding: 14px 14px calc(env(safe-area-inset-bottom) + 18px); display: grid; gap: 14px; grid-auto-rows: max-content; }
  .segment { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); border: 3px solid var(--trait); background: var(--champ); }
  .segment label { position: relative; text-align: center; padding: 10px 4px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; border-left: 2px solid var(--trait); cursor: pointer; }
  .segment label:first-child { border-left: 0; }
  .segment input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .segment label:has(input:checked) { background: var(--encre); color: var(--papier); }
  .segment label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: -5px; }
  .groupe { background: var(--champ); border: 2px solid var(--trait); border-radius: 10px; overflow: hidden; }
  .groupe > * + * { border-top: 1px solid var(--ligne); }
  .champ-titre { width: 100%; border: 2px solid var(--trait); border-radius: 10px; padding: 12px; font: inherit; font-size: 17px; font-weight: 700; background: var(--champ); color: var(--encre); }
  .rang { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 4px 12px; font-size: 16px; }
  .rang > span { font-weight: 600; }
  .rang input[type="date"], .rang input[type="time"], .rang select { font: inherit; font-size: 16px; font-weight: 700; border: 0; background: var(--champ-2); color: var(--encre);
    border-radius: 7px; padding: 6px 8px; min-height: 36px; max-width: 62%; }
  .rang input:disabled { opacity: .4; }
  .rang.cache { display: none; }
  .interrupteur { position: relative; width: 52px; height: 32px; flex: none; }
  .interrupteur input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .interrupteur i { position: absolute; inset: 0; border-radius: 16px; background: var(--interrupteur); border: 2px solid var(--trait); transition: background .15s; }
  .interrupteur i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--trait); transition: transform .15s; }
  .interrupteur input:checked + i { background: var(--rouge-fond); }
  .interrupteur input:checked + i::after { transform: translateX(20px); }
  .interrupteur input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); margin-bottom: 8px; padding: 0; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cats label { position: relative; display: flex; align-items: center; gap: 7px; padding: 8px 12px 8px 9px; border: 2px solid var(--trait); border-radius: 20px; background: var(--champ); font-weight: 700; font-size: 14px; cursor: pointer; min-height: 40px; }
  .cats label i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 2px solid var(--trait); }
  .cats input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .cats label:has(input:checked) { background: var(--encre); color: var(--papier); }
  .cats label:has(input:checked) i { border-color: var(--papier); }
  .cats label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .erreur { margin: 0; color: var(--rouge-texte); font-weight: 700; font-size: 14px; }
  .erreur:empty { display: none; }
  .supprimer { border: 2px solid var(--rouge-texte); background: var(--champ); color: var(--rouge-texte); font-weight: 800; font-size: 15px; border-radius: 10px; min-height: 48px; }
  .note { font-size: 13px; color: var(--gris); line-height: 1.45; margin: 0; }
  .r-cat { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px 12px; }
  .r-cat .r-nom { display: flex; gap: 8px; align-items: center; }
  .r-cat input[type="text"] { flex: 1; min-width: 0; width: 0; font: inherit; font-size: 16px; font-weight: 700; border: 0; background: var(--champ-2); border-radius: 7px; padding: 8px 10px; color: var(--encre); }
  .r-cat .retirer { border: 0; background: none; color: var(--rouge-texte); font-weight: 800; font-size: 14px; padding: 8px 4px; min-height: 40px; }
  .nuancier { display: flex; gap: 6px; flex-wrap: wrap; }
  .nuancier label { position: relative; width: 32px; height: 32px; border-radius: 50%; background: var(--c); border: 2px solid var(--trait); cursor: pointer; }
  .nuancier input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .nuancier label:has(input:checked) { box-shadow: 0 0 0 3px var(--papier), 0 0 0 5px var(--encre); }
  .nuancier label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .version { text-align: center; font-size: 12px; color: var(--gris); margin: 0; }

  /* ---------- Renard ---------- */
  .fox { overflow: visible; }
  .fox .yeux { transform-box: fill-box; transform-origin: center; animation: cligne 9s infinite; }
  .fox.endormie .yeux { animation: none; }
  .fox .lueur { animation: pulse 2.6s ease-in-out infinite; }
  .fox .fox-reaction { transform-box: fill-box; transform-origin: 50% 100%; }
  .fox.saut .fox-reaction { animation: saut .7s cubic-bezier(.3, .7, .4, 1); }
  .grand-renard { display: flex; justify-content: center; align-items: center; height: 186px; }
  .grand-renard .fox { width: 180px; height: 180px; animation: respire 3.4s ease-in-out infinite; }
  .grand-renard .fox.endormie { animation-duration: 5s; }
  @keyframes respire { 50% { transform: translateY(-4px); } }
  @keyframes saut { 0% { transform: none; } 20% { transform: scale(1.06, .9); } 50% { transform: translateY(-18px) scale(.96, 1.05); } 78% { transform: scale(1.04, .95); } 100% { transform: none; } }
  @keyframes cligne { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ---------- Temps pour moi, points ---------- */
  .bloc.libre, :root[data-theme="sombre"] .bloc.libre { background: repeating-linear-gradient(-45deg, var(--libre-a) 0 7px, var(--libre-b) 7px 14px); }
  .bloc.libre .b-texte small { color: var(--libre-texte); }
  .bloc.libre.grignote { box-shadow: inset 0 0 0 2px var(--rouge-texte); }
  .bloc.libre.grignote .b-texte small { color: var(--grignote-texte); }
  .gain { position: absolute; right: 4px; top: 3px; z-index: 2; font-size: 10px; font-weight: 900; background: var(--encre); color: var(--papier); padding: 1px 5px; border-radius: 4px; pointer-events: none; }
  .semaine .gain { display: none; }
  .ligne-occ .marque i.m-libre { border-radius: 50%; background: repeating-linear-gradient(-45deg, #e3fbff 0 3px, #1aa9c4 3px 5px); }
  .rappel { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; background: var(--or); border-bottom: 3px solid var(--noir); font-size: 13px; font-weight: 700; color: var(--noir); }
  .rappel span { flex: 1; line-height: 1.3; }
  .rappel .bouton { min-height: 36px; padding: 0 10px; font-size: 11px; box-shadow: 2px 2px 0 var(--noir); }
  .rappel .fermer { border: 0; background: none; color: var(--noir); width: 40px; height: 40px; font-size: 22px; line-height: 1; padding: 0; }

  /* ---------- Panneau Guts et bilan ---------- */
  .carte-guts { position: relative; background: var(--bleu-fond); color: var(--creme); border: 3px solid var(--noir); box-shadow: 5px 5px 0 var(--noir); padding: 14px 16px 16px; overflow: hidden; }
  .carte-guts::before { content: ""; position: absolute; right: -42px; top: -42px; width: 150px; height: 150px; background: var(--rouge); border-radius: 50%; border: 3px solid var(--noir); }
  .carte-guts > * { position: relative; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { background: var(--creme); color: var(--noir); border: 2px solid var(--noir); font-weight: 800; font-size: 12px; padding: 3px 8px; text-transform: uppercase; letter-spacing: .03em; }
  .carte-guts .phrase { font-weight: 800; font-size: 16px; line-height: 1.35; margin: 2px 0 0; text-align: center; }
  .barre { height: 20px; margin-top: 14px; background: var(--creme); border: 3px solid var(--noir); overflow: hidden; }
  .barre span { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--rouge) 0 8px, #ff6d7a 8px 16px); border-right: 3px solid var(--noir); }
  .barre span[style*="width:0%"] { border-right: 0; }
  .carte-guts .suite { font-size: 12px; font-weight: 700; margin: 6px 0 0; text-align: right; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--champ); border: 2px solid var(--trait); border-radius: 10px; padding: 10px 4px; text-align: center; }
  .stat b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat span { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--gris); margin-top: 2px; }
  .regles { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .regles li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; line-height: 1.4; }
  .regles .pts { flex: none; min-width: 44px; text-align: center; background: var(--encre); color: var(--papier); font-weight: 900; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
  .bilan-date { margin: 0; font-size: 13px; font-weight: 700; color: var(--gris); text-align: center; }
  #bilan .bouton { width: 100%; }

  /* ---------- Bilan de la semaine ---------- */
  .sm-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
  .sm-nav p { margin: 0; text-align: center; }
  .sm-nav p b { display: block; font-size: 16px; font-weight: 900; }
  .sm-nav p small { display: block; font-size: 12px; font-weight: 700; color: var(--gris); margin-top: 2px; }
  .sm-fleche { width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--trait); border-radius: 50%; background: var(--champ); color: var(--encre); padding: 0; }
  .sm-fleche[disabled] { opacity: .35; cursor: default; }
  .carte-guts.basse .grand-renard { height: 132px; }
  .carte-guts.basse .grand-renard .fox { width: 128px; height: 128px; }
  .stat .ecart { display: block; font-size: 11px; font-weight: 700; color: var(--gris); margin-top: 3px; text-transform: none; letter-spacing: 0; }
  .stats.semaine-stats .stat b { font-variant-numeric: normal; }
  .graphe { display: grid; gap: 10px; }
  .graphe h3 { margin: 0; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); display: flex; justify-content: space-between; }
  .graphe h3 span { color: var(--encre); letter-spacing: 0; text-transform: none; font-size: 13px; }
  /* Barres horizontales : une par catégorie, valeur au bout, nom à gauche (la couleur n'est jamais seule) */
  .h-ligne { display: grid; grid-template-columns: 82px 1fr auto; align-items: center; gap: 10px; min-height: 26px; }
  .h-nom { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-piste { position: relative; height: 14px; }
  .h-piste i { position: absolute; left: 0; top: 0; bottom: 0; min-width: 4px; background: var(--c); border-radius: 0 4px 4px 0; }
  .h-val { font-size: 13px; font-weight: 700; color: var(--encre); min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  /* Colonnes jour par jour : hauteur = heures prévues, seuil de fatigue en trait fin */
  .jours-graphe { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; height: 150px; padding-top: 16px; border-bottom: 1px solid var(--ligne-forte); }
  .cj { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
  .cj-barre { width: min(24px, 70%); background: var(--bleu); border-radius: 4px 4px 0 0; min-height: 0; }
  .cj.charge .cj-barre { background: var(--rouge); }
  .cj.avenir .cj-barre { opacity: .45; }
  .cj-val { font-size: 11px; font-weight: 700; color: var(--encre); margin-bottom: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cj.charge .cj-val::before { content: "▲ "; color: var(--rouge-texte); }
  .seuil { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rouge-texte); pointer-events: none; }
  .seuil span { position: absolute; right: 0; top: -15px; font-size: 10px; font-weight: 800; color: var(--rouge-texte); }
  .jours-bas { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .jours-bas b { display: block; font-size: 12px; font-weight: 800; }
  .jours-bas b.auj { color: var(--rouge-texte); }
  .jours-bas small { display: block; font-size: 11px; color: var(--gris); font-variant-numeric: tabular-nums; }
  .legende { margin: 0; font-size: 12px; color: var(--gris); line-height: 1.45; }
  .faits-semaine { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .faits-semaine li { display: flex; gap: 10px; font-size: 14px; line-height: 1.4; }
  .faits-semaine li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--encre); }

  /* ---------- Pas faites (fin de journée) ---------- */
  .rt-ligne { background: var(--champ); border: 2px solid var(--trait); border-left: 5px solid var(--c); border-radius: 10px; padding: 10px 12px; display: grid; gap: 10px; }
  .rt-haut { display: flex; gap: 10px; align-items: center; }
  .rt-quoi { min-width: 0; }
  .rt-quoi b { display: block; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt-quoi small { display: block; font-size: 12px; color: var(--gris); margin-top: 1px; }
  .rt-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rt-actions .bouton { min-height: 38px; padding: 0 12px; font-size: 11px; box-shadow: 2px 2px 0 var(--noir); }
  .lien-discret { border: 0; background: none; color: var(--gris); font-weight: 700; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; min-height: 38px; margin-left: auto; }
  .rt-msg { flex: none; margin: 0; padding: 8px 14px; background: var(--encre); color: var(--papier); font-weight: 700; font-size: 14px; }
  .rt-msg:empty { display: none; }
  .rt-fini { text-align: center; display: grid; gap: 6px; justify-items: center; }
  .rt-fini .grand-renard { height: 130px; }
  .rt-fini .grand-renard .fox { width: 124px; height: 124px; }
  .rt-fini p { margin: 0; font-weight: 800; font-size: 16px; }
  .section-retard .titre-jour .lien { font-size: 13px; min-height: 0; padding: 0; text-transform: none; letter-spacing: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="haut" id="haut"></header>
  <main class="papier" id="vue"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="feuille" id="editeur" aria-labelledby="ed-titre">
  <form id="form-ed" novalidate>
    <div class="f-haut">
      <button type="button" class="lien" data-ed="annuler">Annuler</button>
      <h2 id="ed-titre">Nouvelle tâche</h2>
      <button type="submit" class="lien fort" id="ed-ok">Ajouter</button>
    </div>
    <div class="f-corps">
      <div class="segment" role="radiogroup" aria-label="Type" style="--n:3">
        <label><input type="radio" name="type" value="tache"> Tâche</label>
        <label><input type="radio" name="type" value="evenement"> Événement</label>
        <label><input type="radio" name="type" value="libre"> Pour moi</label>
      </div>
      <p class="note" id="ed-regle"></p>
      <label class="masque" for="ed-nom">Titre</label>
      <input class="champ-titre" id="ed-nom" name="titre" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="Titre">
      <div class="groupe">
        <label class="rang" id="ed-journee"><span>Journée entière</span><span class="interrupteur"><input type="checkbox" name="journee" role="switch"><i></i></span></label>
        <label class="rang"><span>Date</span><input type="date" name="date"></label>
        <label class="rang horaire"><span>Début</span><input type="time" name="debut" step="900"></label>
        <label class="rang horaire"><span>Fin</span><input type="time" name="fin" step="900"></label>
      </div>
      <div class="groupe">
        <label class="rang"><span>Répétition</span>
          <select name="rep">
            <option value="">Jamais</option>
            <option value="jour">Chaque jour</option>
            <option value="ouvres">En semaine (lun.–ven.)</option>
            <option value="semaine">Chaque semaine</option>
            <option value="mois">Chaque mois</option>
          </select></label>
        <label class="rang" id="ed-jusqua"><span>Jusqu'au</span><input type="date" name="jusqua" aria-describedby="ed-jusqua-note"></label>
      </div>
      <p class="note" id="ed-jusqua-note" hidden>Laisse « Jusqu'au » vide pour répéter sans fin.</p>
